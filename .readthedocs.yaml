# Read the Docs builds this repo's docs/ directory as-is: same commit, same
# review, and one built version per git tag, so an owner running an older
# package can read that package's docs rather than master's.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # A broken cross-link fails the build. The docs make claims about a machine
  # that can be left unbootable; a link that quietly stops resolving is the
  # cheapest of those claims to check, so it is checked.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
