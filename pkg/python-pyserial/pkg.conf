# anvil-python-pyserial -- for the CPython this feed builds.
#
# Serial transport for anything that talks to the MCU from python.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_PYSERIAL_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-pyserial
PKG_VERSION="$(pypkg_version pyserial)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="pyserial -- serial port access. Pure python."
