# anvil-s6 -- the process supervisor.
#
# THE PREFIX IS BAKED IN AT COMPILE TIME and is the thing most likely to be got
# wrong by whoever bumps this. s6 resolves s6-ftrigrd through the libexecdir
# its binaries were configured with: every waiting verb (s6-svc -w, s6-svwait)
# execs s6-svlisten, which spawns s6-ftrigrd from that path. Built for any
# other prefix, s6-svstat and respawn keep working and only the waiting verbs
# fail -- so it fails late and partially, which is the worst way for a
# supervisor to fail. Moving $MODDIR means rebuilding this.
#
# DEPENDS NAMES anvil-execline, WHICH IS NEW. s6 itself does not need execline
# at runtime -- our run scripts are #!/bin/sh -- but it is no longer built with
# --disable-execline, because s6-rc cannot be, and a printer that has s6
# without execline cannot run anything s6-rc compiled. Declaring it here is
# what makes `opkg install anvil-s6` bring the thing it will actually need.
PKG_NAME=anvil-s6
PKG_VERSION="$S6_VERSION"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-execline"
PKG_BUILD_DEPENDS="skalibs execline"

# THE HEADERS AND libs6.a GO TO anvil-s6-dev. s6-rc links libs6, so the feed
# needs them; a printer does not. Same split as execline, and the same reason:
# the runtime package is what a machine runs, the dev package is what a build
# machine opens, and no printer should be carrying the second.
PKG_DEV_FILES="include lib"
PKG_DEV_DESCRIPTION="s6 headers and static library. Needed to link s6-rc; nothing installs this on a printer."
PKG_DESCRIPTION="s6, the process supervisor. The supervision subset plus the six programs s6-rc's generated scripts exec, and libexec/s6-ftrigrd, which every waiting verb spawns by a compiled-in path."
