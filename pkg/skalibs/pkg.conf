# anvil-skalibs -- s6's own C library, and a build dependency of everything
# else in the supervision stack.
#
# SECTION libdevel: nothing installs this on a printer. It exists so that
# execline, s6 and s6-rc have something to link against, and it is a real
# package rather than a private sysroot inside one of them precisely so that
# "does it contain what its dependents need" is answered by the next recipe's
# configure, on every build.
#
# WHAT MAKES IT MORE THAN HEADERS-AND-AN-ARCHIVE is lib/skalibs/sysdeps. That
# directory is a cache of answers about the LIBC -- does this target have
# /dev/urandom, does posix_spawn return early, is /proc/self/exe readable --
# settled by compiling and running probes, which a cross-build cannot do and
# so must be told. Every consumer reads it through --with-sysdeps and refuses
# to configure without it. It also carries a `target` file holding the host
# triplet, and each consumer checks that its own --host matches it exactly, so
# there is precisely one spelling of PY_HOST that works for all four.
#
# That is also why switching libc had to invalidate this package rather than
# reuse it: the sysdeps are answers about glibc now, and they were answers
# about musl before.
PKG_NAME=anvil-skalibs-dev
PKG_VERSION="$SKALIBS_VERSION"
PKG_RELEASE=1
PKG_SECTION=libdevel
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_DESCRIPTION="skalibs, the C library s6 and its relatives are built on. Headers, the static archive, and the cross-compile sysdeps cache every consumer configures against. Nothing installs this on the printer."
