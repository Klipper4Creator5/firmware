# anvil-python-preprocess-cancellation -- for the CPython this feed builds.
#
# NO BUILD DEPENDENCY ON python, AND THAT IS THE HONEST ANSWER rather than a
# missing line: this package is one .py file copied into site-packages. It
# compiles nothing, so it needs no interpreter to build against -- only one to
# run on, which is what Depends says.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_PREPROCESS_CANCELLATION_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-preprocess-cancellation
PKG_VERSION="$(pypkg_version preprocess-cancellation)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="preprocess_cancellation -- gcode object cancellation. One module, copied rather than built; Moonraker imports it lazily in the metadata subprocess."
