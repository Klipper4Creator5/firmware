# anvil-core -- this repo's own files: the init scripts, the two shell
# libraries everything sources, the helper programs and the configuration.
#
# THE ONLY RECIPE WHOSE SOURCE IS THIS CHECKOUT. Everything else under pkg/
# unpacks a pinned tarball whose sha256 is in versions.env. These files are
# edited here, reviewed here, and have no upstream -- which is why the recipe
# says so with pkg_intree and why the cache key needs the extra field below.
#
# ARCHITECTURE all. Shell, Python source, JSON and Klipper .cfg. Not one byte
# of native code, so there is no architecture to claim -- and, usefully, no
# reason for a printer to reject it.
PKG_NAME=anvil-core
PKG_ARCH=all

# THE VERSION IS THE RELEASE'S. MOD_VER is what bin/pack.sh already stamps on
# the tarball and what bin/common.sh defaults to today's date, and it is
# pinnable (MOD_VER=20260824) precisely so an old release can be rebuilt --
# the same property every other package here gets from an upstream version
# number. It is monotone, so opkg orders upgrades correctly.
PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# No Depends, deliberately, and it is the interesting empty field in this
# tree. The init scripts call s6 and start Moonraker, so naming anvil-s6 and
# anvil-moonraker here looks obviously right -- and would be wrong: every one
# of those services is gated by a flag in anvil.conf that the user can turn
# off, and a printer running MOD_WEB=0 MOD_UI=0 should still be able to
# install the scripts that read those flags. This package is what makes the
# machine ours; the things it can start are separate decisions.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

# THE CACHE KEY IS THE CONTENT, because the version cannot be. MOD_VER is a
# date: with it pinned, an edit to payload/init.d/S60nginx would read as
# "already current" and the printer would get yesterday's script; without it
# pinned, the package rebuilds once a day whether or not anything changed.
# Neither is a cache. So the version says which release this is and this says
# what is actually in it -- sixteen hex digits over exactly the files the
# recipe ships.
#
# It has to stay cheap: pkg_conf is called for every recipe by pkg_recipes,
# by pkg_order and by bin/fetch-assets.sh's pkg_needs, so this hash runs
# several times per build. Seventy small text files is a few milliseconds.
PKG_STAMP_EXTRA="$( { find "$ROOT/payload/init.d" "$ROOT/payload/bin" \
                          "$ROOT/payload/etc" "$ROOT/payload/helixscreen" \
                          "$ROOT/payload/klipper/config" -type f -print0 2>/dev/null
                      printf '%s\0' "$ROOT/payload/anvil-env.sh" \
                                    "$ROOT/payload/anvil-service.sh" \
                                    "$ROOT/assets/nginx.conf" \
                                    "$ROOT/assets/moonraker.conf" \
                                    "$ROOT/assets/moonraker-custom.conf"
                    } | LC_ALL=C sort -z | xargs -0 sha256sum 2>/dev/null \
                      | sha256sum | cut -c1-16 )"

PKG_DESCRIPTION="The mod's own scripts and configuration: init.d services, the shared environment and service libraries, the wifi and startup helpers, and the nginx and Moonraker config."
