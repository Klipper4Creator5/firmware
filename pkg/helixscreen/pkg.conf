# anvil-helixscreen -- the touchscreen UI.
#
# THE ONE ASSET PACKAGE WITH A BINARY IN IT. Mainsail and Moonraker are
# Architecture: all because nothing in them is compiled; this tarball is a
# prebuilt mipsel program and its libraries, so it carries the real
# architecture and is gated like anything else that executes on the printer.
#
# THAT GATE IS NEW. bin/patch.sh has never run mips_abi_gate over this tree --
# section 5 unpacks it and moves on -- so the ELF objects in the largest thing
# we ship have never been checked for the ABI the kernel will actually accept.
# bin/build-packages.sh gates every package's tree, so building this recipe is
# the first time anybody has asked.
PKG_NAME=anvil-helixscreen

# HELIX_VERSION is "v0.99.115-creator5.2": a tag, with an upstream version and
# a platform revision joined by a hyphen. The 'v' comes off for the same
# reason it does for Mainsail. The hyphen becomes a dot because opkg reads the
# LAST hyphen in a version field as the separator before the packaging
# revision -- leaving it in would make "0.99.115-creator5.2-1" parse as
# upstream "0.99.115-creator5.2" release "1", which happens to be right, and
# would stop being right the first time the tag gained another hyphen. A dot
# keeps every component and cannot be misread.
PKG_VERSION="$(printf '%s' "${HELIX_VERSION#v}" | tr '-' '.')"
PKG_RELEASE=1
PKG_SECTION=ui

PKG_EXCLUDE=".version"

PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_WHEN='[ "${BUILD_HELIX:-1}" = "1" ]'

PKG_DESCRIPTION="HelixScreen, the touchscreen UI, as published by upstream for the Creator 5. Includes this repo's printer-database entry so the printer is detected as a tool changer."
