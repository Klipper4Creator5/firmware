# anvil-python-libnacl -- for the CPython this feed builds.
#
# IT REACHES libsodium THROUGH ctypes, which is why anvil-libsodium is a
# runtime dependency and not a build one: there is nothing to link, and the
# .so has to be findable at import time or Moonraker's ed25519 signing fails.
# libnacl constructs the library name with a dlopen fallback, so the SONAME
# symlinks anvil-libsodium ships are load-bearing.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_LIBNACL_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-libnacl
PKG_VERSION="$(pypkg_version libnacl)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python, anvil-libsodium"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="libnacl -- ctypes bindings for libsodium. Pure python; the library it binds is anvil-libsodium."
