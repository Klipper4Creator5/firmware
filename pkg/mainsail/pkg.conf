# anvil-mainsail -- the web UI, as a package.
#
# THE FIRST PACKAGE HERE THAT COMPILES NOTHING. Mainsail is a zip of static
# files that upstream builds; this recipe unpacks it and says where it goes.
# That makes it the cheapest possible exercise of pkg_stage and of
# Architecture: all, which is why it was migrated before anything with a
# compiler in it.
#
# ARCHITECTURE all, AND THAT IS NOT A SHORTCUT. There is no ELF in this
# package -- it is HTML, CSS and JavaScript -- so a build for one printer is
# byte-identical to a build for another and saying `mipsel_xburst2` would be
# claiming a constraint that does not exist. pkg/ipk-install accepts `all`
# already (see its architecture check), so this costs the installer nothing.
PKG_NAME=anvil-mainsail
PKG_ARCH=all

# The 'v' comes off: MAINSAIL_VERSION is a git tag ("v2.18.2") and a package
# version is a version, not a tag name. opkg compares these fields, and a
# leading letter is one more thing for it to be wrong about.
PKG_VERSION="${MAINSAIL_VERSION#v}"
PKG_RELEASE=1
PKG_SECTION=web

PKG_EXCLUDE=".version"

# No Depends, and it is worth saying why rather than leaving it blank. Mainsail
# is served by the STOCK nginx at /usr/prog/nginx/sbin/nginx -- see
# payload/init.d/S60nginx -- which is the rootfs's and not a package in this
# feed. What we ship for nginx is a config file, and that lives in anvil-core
# with the rest of our own files.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

# Gated, because the zip is a download and a build configured without it has
# nothing to unpack. BUILD_MAINSAIL defaults to 1 in bin/common.sh, so this is
# false only when somebody has deliberately left Mainsail out -- and then the
# right answer is a feed with no anvil-mainsail in it, not a failed build.
PKG_WHEN='[ "${BUILD_MAINSAIL:-1}" = "1" ]'

PKG_DESCRIPTION="Mainsail, the Klipper web interface. Static files served by the printer's own nginx from /usr/data/anvil/www/mainsail."
