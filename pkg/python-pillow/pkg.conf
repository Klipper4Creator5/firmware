# anvil-python-pillow -- for the CPython this feed builds.
#
# ZLIB ONLY, AND THAT IS THE WHOLE CONFIGURATION. Moonraker's only use of
# pillow is components/file_manager/metadata.py, which runs as a SUBPROCESS to
# pull thumbnails out of gcode -- and gcode thumbnails are base64 PNG, so zlib
# is the only codec on that path. jpeg, tiff, webp, jpeg2000, lcms, freetype
# and imagequant are libraries nobody has cross-built here, and pillow probes
# for them by trying to LINK against the HOST's copies unless told not to.
#
# Not on Moonraker's startup path: without this package Moonraker runs and
# Mainsail shows no thumbnails.
#
# THE PIN IS IN versions.env, as PYPKG_PILLOW_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-pillow
PKG_VERSION="$(pypkg_version pillow)"
PKG_RELEASE=1
PKG_SECTION=python

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python zlib"

PKG_DESCRIPTION="Pillow with zlib and nothing else -- enough to read the base64 PNG thumbnails out of gcode, which is all Moonraker asks of it."
