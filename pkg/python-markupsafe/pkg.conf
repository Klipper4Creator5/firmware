# anvil-python-markupsafe -- for the CPython this feed builds.
#
# jinja2's escape accelerator, on the path of every gcode macro klippy
# renders. A pure-python fallback (_native.py) ships inside the package if the
# extension ever fights.
#
# THE PIN IS IN versions.env, as PYPKG_MARKUPSAFE_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-markupsafe
PKG_VERSION="$(pypkg_version markupsafe)"
PKG_RELEASE=1
PKG_SECTION=python

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="MarkupSafe -- jinja2's escaping accelerator, with its C speedup built for mipsel."
