# anvil-zlib -- metadata for the package bin/build-packages.sh builds from
# work/pkg/zlib. Sourced by bin/build-packages.sh and by pkg/lib.sh's pkg_conf,
# so this file is the single description of the package and the build cannot
# disagree with the packaging about what it is making.
#
# THE anvil- PREFIX IS THE NAMESPACE. Every package this repo produces carries
# it, for the reason IPK_ARCH is deliberately not an OpenWrt architecture
# string: `zlib` is a name a thousand feeds already use, and a package of ours
# should be impossible to confuse with one of theirs even by accident.
#
# SECTION libdevel, because nothing installs this on a printer. It exists so
# that anvil-libarchive and (in phase 1) anvil-python have something to build
# against, and it is a real package rather than a build directory precisely so
# that "does it contain the headers its dependents need" is a question the next
# recipe's configure answers on every build.
PKG_NAME=anvil-zlib
PKG_VERSION="$ZLIB_VERSION"
PKG_RELEASE=1
PKG_SECTION=libdevel
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_DESCRIPTION="zlib headers and static library, built -fPIC with 64-bit off_t. Linked into opkg via libarchive, and into CPython's zlib module and OpenSSL. Nothing installs this on the printer; it exists to be built against."
