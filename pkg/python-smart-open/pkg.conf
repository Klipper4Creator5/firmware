# anvil-python-smart-open -- for the CPython this feed builds.
#
# NOT OPTIONAL, WHATEVER THE NAME SUGGESTS, and it is not Moonraker that
# wants it: streaming-form-data's targets.py imports it at MODULE SCOPE, so
# `import streaming_form_data` raises ModuleNotFoundError without it. Measured
# on the replica, where every other package imported and that one did not.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_SMART_OPEN_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-smart-open
PKG_VERSION="$(pypkg_version smart-open)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="smart_open -- streamed file opening. Present because streaming_form_data imports it at module scope."
