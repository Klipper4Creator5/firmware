# anvil-python-dbus-next -- for the CPython this feed builds.
#
# Moonraker's dbus_manager component.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_DBUS_NEXT_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-dbus-next
PKG_VERSION="$(pypkg_version dbus-next)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="dbus_next -- a pure-python DBus library. Moonraker's dbus_manager uses it."
