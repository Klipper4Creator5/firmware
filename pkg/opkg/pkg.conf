# The package manager, packaged by itself. See pkg/opkg/build.sh for why it is
# static musl and why the --prefix it was configured with is load-bearing.
PKG_NAME=opkg
PKG_VERSION="$OPKG_VERSION"
PKG_RELEASE=1

# base rather than libs: this is a program, and the section is what a `opkg
# list` groups by.
PKG_SECTION=base

PKG_ROOT="$OPKG_BUILD"
PKG_EXCLUDE=".version"

# No Depends, and this one is worth a sentence because it looks like the
# package that should have the most. opkg is linked statically against musl,
# libarchive and zlib, so at runtime it needs nothing at all -- not even the
# printer's libc. The two libraries it is built from are pinned in versions.env
# and are BUILD dependencies; neither is a package in this feed and neither
# ever lands on the printer as a file.
PKG_DEPENDS=""

PKG_DESCRIPTION="The opkg package manager, statically linked. Installs and removes .ipk packages under /usr/data/anvil, which is also the prefix it was configured with -- opkg resolves its own status database from that path, not from --offline-root."
