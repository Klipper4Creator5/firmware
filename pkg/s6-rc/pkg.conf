# anvil-s6-rc -- the service manager that sits on top of s6.
#
# WHAT IT ADDS OVER PLAIN s6. s6-svscan supervises a flat directory of
# services and has no opinion about the order they start in or what depends on
# what. s6-rc adds exactly that: a compiled database of services with
# dependencies, oneshots as well as longruns, and `s6-rc -u change` to bring a
# named set up in the right order. That is what the init.d scripts' hand-rolled
# ordering is being replaced with.
#
# NO --disable-execline EXISTS FOR THIS PACKAGE. s6-rc links -lexecline
# unconditionally and s6-rc-compile writes execline scripts into every database
# it produces, which is the whole reason anvil-execline is now a package. If
# you are reading this while wondering whether execline can be dropped again:
# it cannot, not while s6-rc is here.
PKG_NAME=anvil-s6-rc
PKG_VERSION="$S6RC_VERSION"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-s6 anvil-execline"
PKG_BUILD_DEPENDS="skalibs execline s6"
PKG_DESCRIPTION="s6-rc, the service manager: a compiled dependency graph over s6's supervision, with the oneshot runner and fdholder filler its generated databases exec."
