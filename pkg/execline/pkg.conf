# anvil-execline -- skarnet's scripting language, shipped because s6-rc
# requires it.
#
# THIS PACKAGE EXISTS AGAINST A DOCUMENTED DECISION NOT TO SHIP IT, and the
# reversal is on the record rather than silent. bin/patch.sh built s6 with
# --disable-execline and tools/supervisor/README.md called execline "53 more
# binaries and 2.1MB" for nothing. Both were right at the time: our `run`
# scripts are plain #!/bin/sh and nothing execed an execline program.
#
# Two things changed. s6-rc has no --disable-execline -- it links -lexecline
# unconditionally, and s6-rc-compile writes execline scripts into every
# compiled database whether or not our own services need them. And the 2.1MB
# was measured unstripped and statically linked against musl; built the way
# everything is built now it is 1008KB for all 53 binaries.
#
# ALL 53 SHIP, deliberately, rather than a chosen subset. Which execline
# programs a compiled database references depends on the service definitions:
# a plain longrun's run script is copied verbatim and needs none, a pipeline
# needs fdswap, a oneshot needs the runner. A subset picked from today's
# services fails the day somebody adds a pipeline -- at boot, on a printer,
# naming a program nobody decided to leave out. 1008KB is not worth that.
PKG_NAME=anvil-execline
PKG_VERSION="$EXECLINE_VERSION"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# No runtime Depends: libskarnet is linked in statically, and libc is the
# rootfs's. The build dependency below is a different thing entirely.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="skalibs"

# THE HEADERS AND THE ARCHIVE GO TO anvil-execline-dev. s6 and s6-rc link
# libexecline, so the feed has to carry it -- but a printer has no compiler and
# no reason to hold 48KB of headers it will never open. Splitting them means
# `opkg install anvil-execline` puts 53 binaries on the machine and nothing
# else, while `pkg_deps` still finds everything the next recipe needs by
# unpacking both halves into its sysroot.
PKG_DEV_FILES="include lib"
PKG_DEV_DESCRIPTION="execline headers and static library. Needed to link s6 and s6-rc; nothing installs this on a printer."

PKG_DESCRIPTION="execline, skarnet's non-interactive scripting language. Shipped because s6-rc links it and its compiled databases exec it."
