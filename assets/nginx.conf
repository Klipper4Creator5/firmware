# anvil nginx -- serves Mainsail and proxies Moonraker.
# Run with:  nginx -p /usr/data/mod/nginx -c /usr/data/mod/nginx/nginx.conf
# We use our own prefix so FlashForge's /usr/prog/nginx/conf/nginx.conf is
# never touched and the stock web endpoints keep working.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /usr/prog/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  off;
    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path  tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    # Mainsail uploads gcode through this vhost.
    client_max_body_size 1024m;
    proxy_read_timeout   600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout   600s;

    upstream moonraker {
        server 127.0.0.1:7125;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/data/mod/www/mainsail;
        index index.html;

        # Mainsail is a SPA: unknown paths must fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the shell, or updates silently do nothing.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        # Moonraker's own file trees, served straight from disk.
        location /server/files/gcodes/ {
            alias /usr/data/gcodes/;
            add_header Content-Disposition "attachment";
        }
        location /server/files/config/ {
            alias /usr/data/config/;
            add_header Content-Disposition "attachment";
        }
        location /server/files/logs/ {
            alias /usr/data/logs/;
            add_header Content-Disposition "attachment";
        }
    }
}
