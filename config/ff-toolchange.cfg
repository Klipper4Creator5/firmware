# ff-toolchange.cfg -- configuration for the native Creator 5 Pro toolchanger.
#
# The implementation lives in klippy-extras/ff_toolchange.py (copy it to
# /usr/prog/klipper/klippy/extras/).
#
# It is a Python extra rather than a set of gcode_macros because firmwareExe's
# sequence is a polling state machine -- it waits for the grab sensor to read
# active BEFORE energising the lock motor, and retries the whole approach up to
# three times if it never does. A gcode_macro renders its entire template
# before executing any of it, so it cannot poll or retry.
# See OKF/31-recovered-toolchange-sequences.md.
#
# ---------------------------------------------------------------------------
# THIS FILE CARRIES NO PER-UNIT NUMBERS ON PURPOSE
#
# The dock coordinates, grab feedrates and per-tool offsets are factory
# calibration that already exists on this printer, in firmwareExe's own JSON
# under /usr/data/firmwareRes/config/. The module reads those files directly:
#
#   dock_x        <- extruder.json  x_check_pos, x_check_pos1..3
#   dock_y        <- extruder.json  y_check_pos, y_check_pos1..3
#   x_correction  <- test.json      grabOffset
#   fast_feed     <- test.json      grabSpeed     x60  (mm/s -> mm/min)
#   slow_feed     <- test.json      grabSpeedSlow x60
#   offset_x/y    <- extruder.json  t<n>_offset_x/y minus the base tool's
#   offset_z      <- zoffset.json   z_offset_t<n+1>  (1-BASED: t1 is tool 0)
#                    plus extruder.json t<n>_offset_z minus the base tool's
#
# Copying those into this file would mean re-editing it every time the machine
# is recalibrated from the touchscreen, and silently printing with stale
# geometry when someone forgets. Anything you set below OVERRIDES the factory
# value; leaving it unset is the normal case.
#
# Precedence, highest first:  this file  >  firmwareRes JSON  >  app fallback.
#
# TOOLCHANGE_STATUS prints every resolved value with its provenance, and flags a
# disagreement with the app's own now_extruder. TOOLCHANGE_RELOAD re-reads the JSON
# after a touchscreen recalibration without a Klipper restart.
#
# ---------------------------------------------------------------------------
# How a tool line reaches this code
#
# Set in the OrcaSlicer printer profile:
#     change_filament_gcode = T{next_extruder} ; ff-toolchange
#
# The trailing comment satisfies both consumers at once:
#   * Orca parses the block with a G-code reader, sees a real `T<n>` command,
#     and suppresses its own bare `Tn` (custom_gcode_changes_tool()).
#   * The fork's trap is `line.startswith("T") and line in VALID_GCODE_T`
#     (virtual_sdcard.py:566), and `line` is NEVER stripped -- it comes straight
#     from data.split('\n') at :449. "T2 ; ff-toolchange" != "T2", so the trap
#     does not fire, doingChangeEx/refuelling stay false, and nothing waits on
#     the touchscreen app.
#   * The line reaches gcode.run_script(), where ff_toolchange.py's T2 command
#     handles it.
#
# A BARE "T2" is still swallowed by the fork before run_script and never
# reaches this code -- so untouched touchscreen jobs behave exactly as before
# and firmwareExe keeps servicing them.
#
# ---------------------------------------------------------------------------
# INSTALL
#   1. cp klippy-extras/ff_toolchange.py  /usr/prog/klipper/klippy/extras/
#      (Klipper lives on the firmware partition -- klipper_pri.sh runs
#      /usr/prog/klipper/klippy/klippy.py. It may be mounted read-only, and an
#      OTA will overwrite it, so keep a copy and a re-apply script.)
#   2. append to /usr/data/config/printer.cfg:   [include ff-toolchange.cfg]
#      It MUST come after [virtual_sdcard] -- the SDCARD_PRINT_FILE wrapper
#      below uses rename_existing. Do NOT put it in printer.override.cfg, which
#      is included first, before virtual_sdcard exists.
#   3. Run TOOLCHANGE_STATUS and confirm the sensor names AND the loaded geometry
#      before moving anything.
# ---------------------------------------------------------------------------

[ff_toolchange]
# Where firmwareExe keeps its per-unit calibration. The default is correct for
# a stock machine; point it elsewhere only to test against a pulled copy.
#firmware_config_dir: /usr/data/firmwareRes/config

# --- overrides (all optional; omit to use the factory value) ---------------
#dock_x: 296.557861, 296.538940, 296.532623, 296.952393
#dock_y: 56.235977, 106.336197, 155.631531, 205.320541
#x_correction: 0.0
#fast_feed: 30000
#slow_feed: 5400
#release_slow_feed: 5400
#offset_z: 0, 0, 0, 0

# Per-tool G-code offsets come from the firmware JSON too -- see the table
# above plus `offset_x`/`offset_y` below. They are DIFFERENCES against a base
# tool, exactly as CommMgr::setGrabGcodeOffsetMgr computes them:
#     X = t<tool>_offset_x - t<base>_offset_x
#     Y = t<tool>_offset_y - t<base>_offset_y
#     Z = z_offset_t<tool+1> + (t<tool>_offset_z - t<base>_offset_z)
# and are applied after a successful pickup as the app does, in two commands:
#     SET_GCODE_OFFSET X=.. Y=.. MOVE=1 MOVE_SPEED=100
#     SET_GCODE_OFFSET Z=..       MOVE=1 MOVE_SPEED=40
#
# The base tool is CommMgr+0x59c, zeroed by the constructor, so T0. The
# touchscreen can rebase it via setBaseExtruder() when a print does not start
# on T0; we do not follow that -- set offset_base here if you need to.
#offset_base: 0
#offset_x: 0, 0, 0, 0
#offset_y: 0, 0, 0, 0

# Homing safety. firmwareExe auto-homes before a grab (doGrabExtruderLatest
# calls homeManager when not homed) -- but on the touchscreen someone is
# standing at the machine. A remote T<n> silently starting G28 can crash into
# whatever is sitting on the bed, so by default an unhomed toolchange ABORTS
# with "run G28 first". Set True to restore the app's behaviour.
#auto_home: False

# Staging positions. These are code constants in the app, not stored config.
x_safe: 250
x_approach: 280
grab_pullback: 20
grab_retreat_feed: 1500
release_retreat_feed: 4800
accel_move: 8000
# accel_restore -- the app hardcodes 20000, but unset the module restores the
# accel limit that was live when the sequence started, so a machine configured
# below 20000 does not come out of a toolchange faster than its [printer]
# max_accel. Set this only to force the app's literal behaviour.
#accel_restore: 20000
# The release-side mate feed. Same grabSpeedSlow JSON key as slow_feed, but
# the app's fallback on the release path is 5400, not 6000.
#release_slow_feed: 5400

# Sensor names. These are microswitches, exposed to Klipper as [gcode_button]
# sections in printer.base.cfg -- but what they ARE is the app's sensors:
#   dock_sensors -- one per tool; PRESSED means that tool IS in its dock.
#     (CommMgr::checkInLocation indexes these by tool.)
#   grab_sensors -- OR'd; any PRESSED means the carriage is mated with a tool.
#     (CommMgr::getGrabSensorStatus -- a plain OR, kept for fidelity.)
# Confirmed against this printer's printer.base.cfg: it defines extruder_pos1..4
# and extruder_grab1..4 and NOTHING ELSE of this family -- there is no bare
# `extruder_grab`, no servo_min/servo_max, no extruder_check_pos, and motor_pin
# is commented out in printer.motor.cfg.
dock_sensors: extruder_pos1, extruder_pos2, extruder_pos3, extruder_pos4
grab_sensors: extruder_grab1, extruder_grab2, extruder_grab3, extruder_grab4

# Lock-motor macros. CONFIRMED PRESENT in this printer's printer.motor.cfg
# (not printer.macro.cfg -- that file has no MOTOR_* at all).
#
# The production lock is a [manual_stepper gear_stepper] on an A4988 with a
# PWM current-reference pin, NOT the DC-motor-on-H-bridge of the dev config:
#   MOTOR_GRAB    -> STEPPER_LOCK:   VREF 0.25, MANUAL_STEPPER MOVE=0.07 SPEED=0.25, M400
#   MOTOR_GRAB2   -> VREF 0.25, MANUAL_STEPPER MOVE=0.03 SPEED=0.02 SYNC=0,
#                    then delayed LOW_VREF drops the ref to 0.05 after 1.7 s
#   MOTOR_RELEASE -> STEPPER_UNLOCK: VREF 0.35, MOVE=-0.1 STOP_ON_ENDSTOP=1 SYNC=0
#   MOTOR_STOP    -> entirely commented out; a NO-OP. We still call it, as the app does.
grab_macro: MOTOR_GRAB
grab2_macro: MOTOR_GRAB2
release_macro: MOTOR_RELEASE
stop_macro: MOTOR_STOP


# NO PERSISTENT STATE -- there is deliberately no [save_variables] here.
#
# The mounted tool is DERIVED FROM THE DOCK SENSORS every time it is needed: the
# tool whose dock is empty is the one on the carriage. Nothing is stored, so
# nothing can go stale after a touchscreen print, a power cut mid-change, or a
# manual swap.
#
# firmwareExe cannot do this. Its getGrabSensorStatus(info, tool) @0x76f294
# ignores the `tool` argument and just ORs the four grab bytes, so the app only
# learns THAT something is held, never WHICH. That is why it keeps an imperative
# index (extruderConfig()+0x5c / now_extruder): written on grab, reset to -1 on
# release and on every home (homeManager stores -1 at 0x76c408/0x76c510/0x76c5a8),
# persisted by syncExtruderConfig, and read in ~30 places. checkInstallExtruder
# @0x781a34 shows how the two combine:
#     installed = dock_sensor[tool] || (anyGrabbed && now_extruder == tool)
# Sensors first; the stored index only to put a name to the held tool.
#
# extruder_pos1..4 are per-tool, so they carry that name directly, and they also
# distinguish "tool is on the carriage" from "tool has been taken out of the
# machine" (dock empty, nothing grabbed) -- which now_extruder cannot express.
#
# Anything the sensors cannot explain ABORTS rather than guessing:
#   * a tool grabbed while all four docks are occupied  -> impossible, sensor fault
#   * a tool grabbed while >1 dock is empty             -> cannot say which is held
# Guessing wrong means releasing the wrong tool: driving to another tool's dock
# and dropping the tool actually being carried into it. TOOLCHANGE_STATUS shows
# every switch so you can see which one disagrees.


# ---------------------------------------------------------------------------
# Moonraker's print entry point.
#
# WHY THIS WRAPPER EXISTS
#
# The fork rewrites tool lines as it reads the file. virtual_sdcard.py:457-473,
# for every line that does not start with ";" and matches r'T(\d+)':
#
#     if self.need_check_ex or self.no_filament_check_ex:
#         i = self.gcode_ex_used.index("T<n>")
#         if i >= 0: line = line.replace("T<n>", self.gcode_ex_used_changed[i], 1)
#
# That is the touchscreen's "print this job on a different extruder"
# substitution. While either flag is set, OUR `T2 ; ff-toolchange` line is
# looked up in that table and silently rewritten to whatever tool it maps to --
# the print runs on the wrong extruder, with no error.
#
# Neither flag is reset by cmd_M23 NOR by cmd_SDCARD_PRINT_FILE. They are
# cleared only by their own commands (:287, :293), which the touchscreen app
# issues at the right moments and Moonraker never does. So they persist from
# the last touchscreen job into every subsequent Mainsail print. Those two
# lines below are the load-bearing ones.
#
# cmd_M23 (touchscreen) also resets change_filament / enable_ffm /
# set_velocity_limit (:340-342); cmd_SDCARD_PRINT_FILE (Moonraker) resets none
# of them -- it only calls _reset_file() and do_resume() (:244-251). Of those:
#   * SDCARD_CLEAR_REFUELLING -- change_filament is reported as `refuelling` in
#     get_status (:188), so a stale true makes the UI show a refuelling state
#     that never clears. It cannot deadlock us: the busy-wait at :572 is reached
#     only from the bare-Tn trap, which our commented tool lines evade.
#   * SDCARD_ENABLE_FFM ENABLE=0 -- belt and braces. enable_ffm is written in
#     four places and READ NOWHERE in klippy; it is inert.
#   * set_velocity_limit needs no line here: SDCARD_SET_CHANNEL clears it (:259)
#     and ff_toolchange issues that on every change.
# ---------------------------------------------------------------------------
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _FF_SDCARD_PRINT_FILE
gcode:
    SDCARD_CLEAR_REFUELLING
    SDCARD_ENABLE_FFM ENABLE=0
    SDCARD_SET_NEED_CHECK_EX CHECK=0
    SDCARD_NO_FILAMENT_CHECK_EX CHECK=0
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=mainsail VALUE=1
    _FF_SDCARD_PRINT_FILE {rawparams}
