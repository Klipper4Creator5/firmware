# ---------------------------------------------------------------------------
# ff-filament.cfg -- LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE for the
# FlashForge Creator 5 Pro under Mainsail / HelixScreen.
#
# Port of the touchscreen app's FilamentLoad page (FilamentLoad::doLoad ->
# startPrepareLoad -> pthreadFilamentLoad -> doLoadingOperation), recovered
# from MIPS machine code: firmwareExe-decompiled/recovered/filament-load.md.
#
# Facts that shape these macros (all address-verified there):
#   * Each tool has its own direct-drive extruder; "loading" is the tool's own
#     `G1 E...` after the tool has been grabbed onto the carriage. The
#     [manual_stepper gear_stepper] is the tool LOCK motor, not a feeder.
#   * The app grabs the tool, drives it to the purge chute at the back right
#     (X275 Y254, per-tool nudges), heats to material temp + 30, waits for
#     |actual - target| <= 3, turns the chamber fans off, pushes 150 + 145 mm
#     at F240 (F80 for a 0.25 mm nozzle), restores the fans, parks the tool
#     again and sets the heater to 0.
#   * The app's "unload" is THE SAME forward push -- the stock firmware has no
#     retract-unload at all (the guide tells the user to cut and pull). Our
#     UNLOAD_FILAMENT below is therefore designed, not ported: renew the melt,
#     then pull the filament out of the extruder in two stages.
#   * No M109, no filament-sensor arming, no sensor check after the feed.
#
# Deliberate divergences:
#   * Purge height: the app probes the eddy at (265, 4.8) with an empty
#     carriage and lifts to probeZ + 8; z_offset is 0.0 on this machine so
#     that is nominal Z8 -- we go straight to `purge_z` (default 8) and skip
#     the probe. Z is only ever raised, never lowered, before the XY travel.
#   * Temperature comes from TEMP= (HelixScreen pre-fills it from the active
#     material); the app's per-material table is reproduced in `temps` below
#     for MATERIAL=PLA style calls. Default 220 = the app's default entry.
#   * While a print is PAUSED the macros act on the mounted tool only, do not
#     touch Z, do not park the tool and do not turn the heater off (RESUME
#     reheats and continues) -- the shape of the app's LoadFilamentPrint path.
#   * TEMPERATURE_WAIT replaces the app's 1 s polling loop; it has no timeout
#     either.
#
# Include from printer.cfg after ff-toolchange.cfg:
#     [include ff-filament.cfg]
#
# HelixScreen: assign LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE in
# Settings -> Macro Buttons. With the tool-changer backend its default
# Load/Unload buttons only mount/unmount the tool (SELECT_TOOL /
# UNSELECT_TOOL); a user-assigned macro outranks that. The parameter modal
# picks up the `params.X|default(..)` references below.
# ---------------------------------------------------------------------------

[gcode_macro _FF_FILAMENT]
description: Tunables for LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE
# Purge chute position (app: moveLoadLocation, 275/254 @db6b2c/@db6b28) and
# the per-tool XY nudge the app applies by now_extruder (0:(0,0) 1:(-2,0)
# 2:(-2,1.5) 3:(-2,-8)).
variable_purge_x: 275.0
variable_purge_y: 254.0
variable_purge_z: 8.0
variable_tool_dx: [0.0, -2.0, -2.0, -2.0]
variable_tool_dy: [0.0, 0.0, 1.5, -8.0]
variable_travel_x_feed: 12000
variable_travel_y_feed: 24000
variable_approach_feed: 2400
# Feed: app pushes load_length_1 then load_length_2 (150 + 145 = 295 mm),
# F240, or F80 when the tool's nozzle is 0.25 mm.
variable_load_length_1: 150.0
variable_load_length_2: 145.0
variable_load_feed: 240
variable_load_feed_thin: 80
variable_load_boost: 30.0
# In-print (paused) load: app's LoadFilamentPrint pushes 100 then retracts 5.
variable_print_load_length: 100.0
variable_print_retract: 5.0
# Unload (designed, see header): renew the melt, quick pull out of the melt
# zone, then the rest at feed speed. unload_length must clear the drive gears
# and the fd_ex<n> switch above them; 80 mm is a conservative first guess for
# this compact direct drive -- shorten once measured.
variable_unload_prime: 10.0
variable_unload_fast: 20.0
variable_unload_fast_feed: 1200
variable_unload_length: 80.0
variable_unload_feed: 600
# Purge (app: clearNozzlePrint): E50 then E-5 with the part fan at 60 %.
variable_purge_length: 50.0
variable_purge_retract: 5.0
variable_purge_fan: 0.6
# Chamber fans around the feed (app: changeFilamentControlFan).
variable_chamber_heat_fan: 0.9
variable_chamber_loop_fan: 0.3
# App's g_mapFilamentTempDefault (.rodata 0xd61d44); 'custom' -> 220.
variable_temps: {'PLA': 220, 'PETG': 240, 'PLA-CF': 220, 'PETG-CF': 240,
                 'ABS': 250, 'ASA': 250, 'SILK': 220, 'PET-CF': 270,
                 'PAHT-CF': 280, 'S-PAHT': 280, 'S-MULTI': 270, 'PA-CF': 270,
                 'HIPS': 250, 'PVA': 220, 'TPU-90A': 220, 'TPU-95A': 220,
                 'TPU-64D': 220, 'PC': 260, 'PA': 260, 'PC-ABS': 260,
                 'PPS-CF': 290, 'CUSTOM': 220}
variable_default_temp: 220
# State shared between the helpers of one operation.
variable_tool: -1
variable_in_print: 0
variable_saved_chamber_fan: 0.0
gcode:
    { action_respond_info("LOAD_FILAMENT TOOL=n [TEMP=|MATERIAL=] | UNLOAD_FILAMENT TOOL=n [TEMP=] | PURGE [TOOL=n] [PURGE_TEMP=] [LENGTH=]") }

# ---------------------------------------------------------------------------
# Internal: resolve TOOL / temperature, refuse in the wrong state, heat, mount
# the tool, travel to the purge chute, wait for temperature, chamber fans off.
# Leaves the extruder of TOOL active at the chute, ready for G1 E.
# ---------------------------------------------------------------------------
[gcode_macro _FF_FILAMENT_PREP]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tc = printer.ff_toolchange %}
    {% set temp = params.TEMP|float %}
    {% set tool = params.TOOL|int %}
    {% set state = printer.print_stats.state %}
    {% set paused = printer.pause_resume.is_paused %}
    {% if state == 'printing' and not paused %}
        { action_raise_error("Refusing: a print is running (pause it first)") }
    {% endif %}
    {% if paused %}
        {% if tool < 0 %}{% set tool = tc.current_tool %}{% endif %}
        {% if tool != tc.current_tool %}
            { action_raise_error("Print is paused with T%s mounted; filament operations "
                                 "on another tool would resume with the wrong tool"
                                 % tc.current_tool) }
        {% endif %}
    {% elif tool < 0 %}
        {% set tool = tc.current_tool %}
    {% endif %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("TOOL=0..3 required (no tool mounted to default to)") }
    {% endif %}
    {% if not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% set extruder = printer["tool T%d" % tool].extruder %}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=in_print VALUE={1 if paused else 0}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=saved_chamber_fan VALUE={printer["fan_generic chamber_fan"].speed}
    M104 S{temp} T{tool}                 ; app: heatManager first, heat while travelling
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28                              ; app: homeManager(1,1,1) when not homed
    {% endif %}
    G90
    {% if not paused %}
        SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600   ; app, before the grab
        M400
    {% endif %}
    {% if tool != tc.current_tool %}
        SELECT_TOOL T={tool}             ; grab: applies this tool's offsets, activates its extruder
        M400
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
    {% endif %}
    {% if not paused and printer.toolhead.position.z < ff.purge_z %}
        G1 Z{ff.purge_z} F3000           ; app: G1 Z<probeZ+8> F3000 (raised before XY here)
    {% endif %}
    G1 X{ff.purge_x - 25} F{ff.travel_x_feed}           ; app: G1 X250
    G1 Y{ff.purge_y + ff.tool_dy[tool]} F{ff.travel_y_feed}
    G1 X{ff.purge_x + ff.tool_dx[tool]} F{ff.approach_feed}
    M400
    TEMPERATURE_WAIT SENSOR={extruder} MINIMUM={temp - 3} MAXIMUM={temp + 3}   ; app: |cur-target| <= 3
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    {% if printer["heater_generic chamber_heater"].target > 0 %}
        SET_FAN_SPEED FAN=chamber_heat_fan SPEED=0
        SET_FAN_SPEED FAN=chamber_loop_fan SPEED=0
    {% endif %}

# ---------------------------------------------------------------------------
# Internal: restore fans, park the tool (unless paused), heater off.
# ---------------------------------------------------------------------------
[gcode_macro _FF_FILAMENT_FINISH]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = ff.tool %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    M400
    SET_FAN_SPEED FAN=chamber_fan SPEED={ff.saved_chamber_fan}
    {% if printer["heater_generic chamber_heater"].target > 0 %}
        SET_FAN_SPEED FAN=chamber_heat_fan SPEED={ff.chamber_heat_fan}
        SET_FAN_SPEED FAN=chamber_loop_fan SPEED={ff.chamber_loop_fan}
    {% endif %}
    {% if not ff.in_print %}
        {% if release %}
            UNSELECT_TOOL                ; app: doReleaseExtruderMgr
        {% endif %}
        {% if heat_off %}
            M104 S0 T{tool}              ; app: heatManager(tool, 0) on exit
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=in_print VALUE=0

# ---------------------------------------------------------------------------
# LOAD_FILAMENT TOOL=<0..3> [TEMP=<material temp>] [MATERIAL=PLA] [BOOST=30]
#               [LENGTH=<mm>] [SPEED=<mm/min>] [RELEASE=1] [HEAT_OFF=1]
# Feeds the spool of TOOL into its hotend at the purge chute. Heats to
# TEMP + BOOST as the app does (material temp + 30). While a print is paused:
# mounted tool only, in-print lengths (100 then -5), tool stays mounted.
# ---------------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Load filament into a tool's hotend (app FilamentLoad sequence)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set material = params.MATERIAL|default('')|upper %}
    {% set base = ff.temps[material] if material in ff.temps else ff.default_temp %}
    {% set temp = params.TEMP|default(base)|float %}
    {% set boost = params.BOOST|default(ff.load_boost)|float %}
    {% set length = params.LENGTH|default(ff.load_length_1 + ff.load_length_2)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set t = printer.ff_toolchange.current_tool if tool < 0 else tool %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp + boost}
    {% set nozzle = printer.configfile.settings[printer["tool T%d" % t].extruder].nozzle_diameter|float if t >= 0 else 0.4 %}
    {% set speed = params.SPEED|default(ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed)|int %}
    SAVE_GCODE_STATE NAME=_ff_filament
    M82
    G92 E0
    {% if printer.pause_resume.is_paused %}
        G1 E{ff.print_load_length} F{speed}     ; app LoadFilamentPrint: G1 E100
        M400
        G92 E0
        G1 E-{ff.print_retract} F{speed}        ; G1 E-5
        M400
    {% else %}
        {% set first = [length, ff.load_length_1]|min %}
        G1 E{first} F{speed}                     ; app: G1 E150 F240
        M400
        {% if length > first %}
            G1 E{length} F{speed}                ; app: G1 E145 (absolute E, G92 not repeated)
            M400
        {% endif %}
    {% endif %}
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}

# ---------------------------------------------------------------------------
# UNLOAD_FILAMENT TOOL=<0..3> [TEMP=<material temp>] [MATERIAL=PLA]
#                 [LENGTH=<mm>] [RELEASE=1] [HEAT_OFF=1]
# DESIGNED (no stock equivalent -- see header): heat to TEMP, renew the melt
# with a short push, pull `unload_fast` mm quickly out of the melt zone, then
# the remainder of LENGTH at `unload_feed`. Cut the filament at the spool side
# first if the spool is tensioned.
# ---------------------------------------------------------------------------
[gcode_macro UNLOAD_FILAMENT]
description: Retract filament out of a tool's extruder (designed; stock app only pushes forward)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set material = params.MATERIAL|default('')|upper %}
    {% set base = ff.temps[material] if material in ff.temps else ff.default_temp %}
    {% set temp = params.TEMP|default(base)|float %}
    {% set length = params.LENGTH|default(ff.unload_length)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}
    SAVE_GCODE_STATE NAME=_ff_filament
    M83
    G92 E0
    G1 E{ff.unload_prime} F{ff.load_feed}           ; renew the melt so the tip pulls clean
    M400
    {% set fast = [ff.unload_fast, length]|min %}
    G1 E-{fast} F{ff.unload_fast_feed}               ; out of the melt zone before it freezes
    {% if length > fast %}
        G1 E-{length - fast} F{ff.unload_feed}
    {% endif %}
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}

# ---------------------------------------------------------------------------
# PURGE [TOOL=<0..3>] [PURGE_TEMP=<temp>] [LENGTH=50] [RELEASE=1] [HEAT_OFF=1]
# Port of the app's clearNozzlePrint purge at the chute: E<LENGTH>, part fan
# 60 %, E-5. PURGE_TEMP is the name HelixScreen pre-fills from the active
# material. Defaults to the mounted tool.
# ---------------------------------------------------------------------------
[gcode_macro PURGE]
description: Purge at the chute (app clearNozzlePrint sequence)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set temp = params.PURGE_TEMP|default(ff.default_temp)|float %}
    {% set length = params.LENGTH|default(ff.purge_length)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set t = printer.ff_toolchange.current_tool if tool < 0 else tool %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}
    {% set nozzle = printer.configfile.settings[printer["tool T%d" % t].extruder].nozzle_diameter|float if t >= 0 else 0.4 %}
    {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
    SAVE_GCODE_STATE NAME=_ff_filament
    M83
    G92 E0
    G1 E{length} F{speed}                            ; app: G92 E0; G1 E50 F<speed>; M400
    M400
    M106 P1 S{(ff.purge_fan * 255)|int}              ; app: M106 P1 S153
    G1 E-{ff.purge_retract} F{speed}                 ; app: G92 E0; G1 E-5 F<speed>; M400
    M400
    M106 P1 S0
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}
