name: release

# A release is blocked on the printer replica passing.
#
# The replica is the printer's real rootfs.squashfs, chrooted under
# qemu-mipsel, with /usr/prog installed by FlashForge's own updater, so the
# installer under test runs on the printer's busybox, tar, md5sum and unTar.
# If that fails, nothing ships.
#
# The stock packages and the factory image are large but not secret: this
# fetches what is already public at ghzserg/FF, pinned by sha256 and enforced,
# so the archive cannot change under us while the gates report green.
#
# TAGS. `v<YYYYMMDD>-<city>`, e.g. v20260824-nova-kakhovka: the release date
# and a Ukrainian city under occupation. Only the date reaches the package
# filename, so the city is carried by the tag and the release title.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the stock firmware and the factory image
        # Same artefacts, same checksums as ci.yml. Enforced: a mismatch here
        # means the thing we test against is not the thing we tested against
        # last time, and that has to stop the release rather than colour it.
        env:
          STOCK_URL_CREATOR5PRO: https://github.com/ghzserg/FF/releases/download/R/Creator5Pro-1.9.7-1.2.9-20260810.tgz
          STOCK_SHA_CREATOR5PRO: 1f3252feaae6d8fc72d7b0fd1ba832cc63d369659f8b2d2896efcf7adab2976b
          STOCK_URL_CREATOR5: https://github.com/ghzserg/FF/releases/download/R/Creator5-1.9.7-1.2.9-20260810.tgz
          STOCK_SHA_CREATOR5: 72009be183e74a4562050a927787ba686c6b558a075f00958892197ac52659cc
          FACTORY_URL: https://github.com/ghzserg/FF/releases/download/R/Creator5Pro-factory.tar.xz
          FACTORY_SHA: 45657924298a41b5cd48c0f4412b4b2fb67df624af666b494d6bcea969cc5b7b
        run: |
          set -euo pipefail
          mkdir -p stock
          curl -fsSL "$STOCK_URL_CREATOR5PRO" -o stock/Creator5Pro-stock.tgz
          curl -fsSL "$STOCK_URL_CREATOR5"    -o stock/Creator5-stock.tgz
          curl -fsSL "$FACTORY_URL"           -o stock/factory.tar.xz
          # Exactly two spaces before the path: sha256sum -c reads everything
          # after them as the filename, so a column-aligned line looks for a
          # file whose name begins with spaces and fails as "not found".
          echo "$STOCK_SHA_CREATOR5PRO  stock/Creator5Pro-stock.tgz" | sha256sum -c -
          echo "$STOCK_SHA_CREATOR5  stock/Creator5-stock.tgz" | sha256sum -c -
          echo "$FACTORY_SHA  stock/factory.tar.xz" | sha256sum -c -
          ls -lh stock

      - name: Write test.env (the replica's /usr/prog)
        env:
          # A prebuilt replica image carrying the factory partitions AND the
          # stock package already installed, about a minute saved per case.
          # The end-to-end test reinstalls the baseline itself when the
          # package under test is for the other model, so this only changes
          # how long it takes, never what it proves.
          PRINTER_IMAGE: ${{ vars.PRINTER_IMAGE || 'monstrofil/creator5-printer:latest' }}
        run: |
          set -euo pipefail
          echo "PROG_DUMP=\"$PWD/stock/factory.tar.xz\"" > test.env
          [ -z "${PRINTER_IMAGE:-}" ] || echo "PRINTER_IMAGE=\"$PRINTER_IMAGE\"" >> test.env
          cat test.env

      - name: Write config.env
        run: |
          cat > config.env <<CFG
          MOD_NAME=anvil
          # The tag is v<YYYYMMDD>-<city>; the package version is the date
          # alone, which FlashForge's installer compares as a number. A manual
          # run has no tag, so leave it empty and let the build stamp today's
          # UTC date. The optional trailing letter (20260824b) is the same-day
          # re-release convention and only keeps the outer filenames distinct.
          MOD_VER=$(case "$GITHUB_REF" in
                      refs/tags/*) echo "${GITHUB_REF_NAME#v}" | sed -n 's/^\([0-9]\{8\}[a-z]\{0,1\}\).*/\1/p' ;;
                      *) echo "" ;;
                    esac)
          SW_VER=""
          TARGET_MACHINE=Creator5Pro
          STOCK_TGZ_CREATOR5PRO="$PWD/stock/Creator5Pro-stock.tgz"
          STOCK_TGZ_CREATOR5="$PWD/stock/Creator5-stock.tgz"
          STOCK_TGZ=""
          # No Klipper source knob any more: pkgs/klipper builds from the
          # commit pinned in versions.env. KLIPPER_FORK used to be settable
          # here, and setting it to "" is what made v20260824 ship the stock
          # 0.12-era klippy.
          #
          # The password secret is INTENTIONALLY unset: a hash baked in here
          # would be the same root password in every public release. Empty
          # means each printer picks a random one on first install. The
          # plumbing stays so a fork can bake one in deliberately.
          ROOT_PW_HASH='${{ secrets.ROOT_PW_HASH }}'
          FF_KEY='FFP0331&*%root'
          CFG

      # Before the suite, not after: the replica gates run ./bin/patch.sh
      # directly and it expects vendor/ already populated. Cached because the
      # set includes the Klipper fork and the ~203MB MIPS toolchain; the key
      # is the pin file.
      - name: Cache the pinned vendor assets
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('versions.env') }}

      - name: Fetch the pinned Mainsail, HelixScreen, Moonraker and Klipper assets
        run: make vendor ASSET_ROOT=$PWD

      - name: Extract the printer rootfs
        run: make rootfs ASSET_ROOT=$PWD

      - name: Brick-safety suite, replica required
        # No REQUIRE_PRINTER_SIM and no ALLOW_SKIP: qa has no skip mode, so a
        # missing docker, image or package fails at the point that needs it.
        run: |
          docker build -q -t creator5-fw-build -f docker/Dockerfile.build docker
          docker run --rm \
            -v "$PWD":"$PWD" -w "$PWD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            creator5-fw-build \
            sh -c './bin/unpack.sh && ./bin/patch.sh && ./bin/pack.sh \
                   && python3 -m pytest ./qa -q'

      - name: Build both models
        run: make release ASSET_ROOT=$PWD

      - name: End-to-end update test on the packages that will actually ship
        # The suite above tested a package built from the same tree; this
        # tests the exact files attached to the release.
        #
        # In the build image, not on the runner: every earlier step ran as
        # root inside that image, so work/ and dist/ belong to root and the
        # replica cannot create its scratch directory as the runner user. It
        # also needs the docker socket.
        #
        # REAL_PKG points the replica lane at one exact package instead of the
        # newest in work/out. Two models ship per release and they are not
        # interchangeable, so each is installed and asserted against in turn.
        run: |
          docker run --rm \
            -v "$PWD":"$PWD" -w "$PWD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            creator5-fw-build sh -c '
              for p in dist/*.tgz; do
                echo "=== $p ==="
                REAL_PKG="$p" python3 -m pytest ./qa/replica -q || exit 1
              done'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-packages
          path: dist/*.tgz
          retention-days: 30

      - name: Assemble the release notes
        if: startsWith(github.ref, 'refs/tags/')
        # The fixed half is the same every time; the half naming the city is
        # not. docs/releases/<tag>.md carries it and is appended when it
        # exists, so that story lives in the repo at the tagged commit rather
        # than only on a hand-edited release page.
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          Copy the file matching YOUR printer to the root of a FAT32 USB
          stick and power the machine on. A `Creator5Pro-` package will not
          install on a Creator 5 and vice versa.

          Every package here was installed into a replica of the printer --
          the real rootfs running under qemu-mipsel, with the package on a
          real FAT filesystem that the machine's own app_startup.sh found
          and installed -- and the machine was booted again afterwards and
          checked to come up.

          **If the screen stays dark**, the printer is still up: ssh and
          Mainsail run from their own services, before and independently of
          the UI, so reach it at `http://<printer-ip>/` or ssh in and read
          `/usr/data/logs/helixscreen.log`. There is no automatic fallback --
          `opkg remove anvil-helixscreen` to boot headless on
          purpose. **To go back to stock**, put FlashForge's own package on a
          USB stick and power on -- that path is tested on every release too.

          ---

          NOTES
          CITY="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$CITY" ]; then
            cat "$CITY" >> RELEASE_NOTES.md
          else
            echo "::warning::no $CITY -- publishing the generic line instead"
            echo "Releases are named for a Ukrainian city under occupation." \
                 >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          # Every build so far is a pre-release: this replaces the stock UI on
          # a machine whose only recovery path is a USB stick with the stock
          # package on it. Worth saying with the flag, not just in prose.
          prerelease: true
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
