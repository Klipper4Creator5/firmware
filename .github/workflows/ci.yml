name: ci

# The stock FlashForge firmware is proprietary and ~93MB, so it is never in
# the repo. The `test` job runs against a synthetic fixture that reproduces
# the package STRUCTURE (see test/integration/make-stock-fixture.sh) -- enough
# for the static and packaging checks, but NOT enough to prove a package will
# not brick a printer.
#
# That proof needs the printer's real rootfs, and so it needs the stock
# package. `printer-sim` below now always runs, because the packages it needs
# are publicly mirrored (see env: below) rather than hidden behind a secret
# nobody had set. It used to be gated on STOCK_URL_CREATOR5PRO, which meant
# that for its entire existence it never ran once: a grey dash beside two
# green ticks, reading as "CI passed" while the only gates that decide
# whether a package bricks a printer were never executed.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# The stock packages and the factory image, from ghzserg/FF -- a public
# archive of FlashForge firmware that this repo already points at in
# docs/printer-replica.md. Nothing proprietary is redistributed from here; the
# workflow fetches what is already published elsewhere.
#
# Every one is pinned by sha256, and the checksum is enforced, not advisory.
# An unpinned download would let the archive change under us and the suite
# would keep reporting green while testing a different firmware than the one
# these gates were written against -- the same class of silent drift as a gate
# that skips without saying so. Verified byte-for-byte against the maintainer's
# local copies on 2026-08-24.
env:
  STOCK_URL_CREATOR5PRO: https://github.com/ghzserg/FF/releases/download/R/Creator5Pro-1.9.7-1.2.9-20260810.tgz
  STOCK_SHA_CREATOR5PRO: 1f3252feaae6d8fc72d7b0fd1ba832cc63d369659f8b2d2896efcf7adab2976b
  STOCK_URL_CREATOR5: https://github.com/ghzserg/FF/releases/download/R/Creator5-1.9.7-1.2.9-20260810.tgz
  STOCK_SHA_CREATOR5: 72009be183e74a4562050a927787ba686c6b558a075f00958892197ac52659cc
  FACTORY_URL: https://github.com/ghzserg/FF/releases/download/R/Creator5Pro-factory.tar.xz
  FACTORY_SHA: 45657924298a41b5cd48c0f4412b4b2fb67df624af666b494d6bcea969cc5b7b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc/pkg-config/perl/zlib1g-dev/patch/make are for the SAME reason
      # docker/Dockerfile.build carries them: cross-building CPython 3.13
      # needs a HOST build-python of its own to freeze modules and
      # byte-compile the stdlib, and that one needs a host C compiler,
      # pkg-config (CPython's configure probes libffi through it), perl
      # (OpenSSL's Configure is a perl program), zlib1g-dev (the build-python
      # needs a working zlib module or ensurepip cannot even unpack pip's
      # bundled wheel) and patch (lmdb's setup.py shells out to
      # /usr/bin/patch by absolute path). See that file's own comment for the
      # long version.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssl xz-utils unzip binutils file squashfs-tools \
            python3-pytest python3-jinja2 python3-pyflakes \
            gcc pkg-config perl zlib1g-dev patch make

      # Syntax and the brick lint are the first thing run-tests.py does, so
      # they are not repeated here.
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # Errors are a gate. These used to end in `|| true`, which meant
          # shellcheck could report anything it liked and the job stayed green.
          # payload scripts run under busybox ash on the printer.
          shellcheck -s sh   -S error pkg/*/payload/*.sh pkg/*/payload/init.d/S* pkg/*/prog/*.sh pkg/*/prog/firmwareExe installer/*.sh
          shellcheck -s bash -S error bin/*.sh test/integration/*.sh
          # Warnings are advisory: printed, not enforced.
          shellcheck -s sh -S warning pkg/*/payload/*.sh pkg/*/payload/init.d/S* pkg/*/prog/*.sh pkg/*/prog/firmwareExe installer/*.sh || true

      # s6 and CPython 3.13 have no BUILD_ flag -- every package ships them
      # (see bin/fetch-assets.sh) -- so this job builds them for real rather
      # than stubbing around them the way it stubs Mainsail, HelixScreen and
      # the Klipper fork. Cached on versions.env: an unchanged pin never
      # re-fetches the ~203MB Ingenic toolchain and never recompiles either
      # tree. Both are recipes under work/pkg now -- four for s6, nineteen for
      # CPython and its site-packages -- and every one carries pkg_stamp's key.
      #
      # work/pkg is every recipe under pkg/ at once -- one cache entry instead
      # of one per package, because pkg/lib.sh derives the output directory
      # from the recipe name rather than naming each one in bin/common.sh. A
      # new recipe therefore needs no edit here, which is the same property
      # that makes adding a package one directory.
      - name: Cache the s6 + CPython 3.13 build inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            vendor
            work/pkg
          key: fixture-py-${{ hashFiles('versions.env') }}

      - name: Fetch the s6 + CPython 3.13 build inputs
        run: |
          set -euo pipefail
          # BUILD_KLIPPER=stock only -- this config.env exists purely to let
          # fetch-assets.sh see a config at all; it skips Mainsail, HelixScreen
          # and the Klipper fork (all still gated on their own BUILD_ flags,
          # unset here) and fetches only what s6 and CPython need, since
          # neither has a BUILD_ flag of its own. run-tests.py's own fixture
          # harness writes its own throwaway config.env for the actual suite
          # run below, with synthetic Mainsail/HelixScreen/Moonraker
          # stand-ins -- this one never reaches patch.sh, only fetch-assets.sh.
          # The actual cross-build of s6 and CPython happens inside the suite,
          # in bin/patch.sh sections 5b/5c, the first time it runs against a
          # vendor/ that now has what those sections need.
          cat > config.env <<'CFG'
          BUILD_KLIPPER=stock
          BUILD_MAINSAIL=0
          BUILD_HELIX=0
          BUILD_MOONRAKER=0
          CFG
          ./bin/fetch-assets.sh
          rm -f config.env

      # The qa suite's static lane. Runs BEFORE the old suite because it is
      # seconds rather than minutes and it covers the same static ground, so a
      # syntax error in the payload is reported by name in the first few
      # seconds of the job rather than several minutes in as one red gate.
      #
      # No strictness flag: a missing shellcheck or pyflakes fails on its own,
      # because there is no configuration in which running this lane without
      # them is a complete run. Only the static lane here -- this job has no
      # firmware on purpose, and printer-sim below is where the replica is
      # proved.
      - name: qa -- static lane
        run: python3 -m pytest ./qa/static -q

      # This job has no stock package on purpose, so exactly two gates cannot
      # run: the tests that read the real rootfs, and the replica itself. The
      # suite refuses to call a gate it did not run a pass, so they have to be
      # accepted explicitly -- BY NAME. `ALLOW_SKIP=1` would accept them and
      # also every future skip, which would make this job green while it
      # quietly stopped testing things. Naming them means a third skip fails
      # here, and both are still printed and annotated on every run.
      #
      # The job that must not skip at all is printer-sim below, and
      # release.yml; both set REQUIRE_PRINTER_SIM=1 and no ALLOW_SKIP.
      - name: Full test suite (fixture-based)
        run: ALLOW_SKIP="pytest,the printer replica" ./test/run-tests.py

      - name: Upload built fixture packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-packages
          path: work/out/*.tgz
          if-no-files-found: ignore
          retention-days: 7

  # The real check: install the package into a replica of the printer -- the
  # actual rootfs.squashfs under qemu-mipsel, on the printer's own busybox --
  # and assert the machine still boots. No `if:` guard: this job is the point
  # of the repo, and a version of it that can quietly not run is worse than
  # not having it.
  printer-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ~370MB of somebody else's release assets per run (two ~93MB stock
      # packages and the 182MB factory image), and they never
      # change -- the cache key is their checksums, so a new pin misses and
      # re-fetches, and an unchanged pin costs the archive nothing.
      - name: Cache the stock firmware
        uses: actions/cache@v4
        with:
          path: stock
          key: stock-${{ env.STOCK_SHA_CREATOR5PRO }}-${{ env.STOCK_SHA_CREATOR5 }}-${{ env.FACTORY_SHA }}

      - name: Fetch the stock firmware
        env:
          # Secrets override the public pins, for a fork testing its own
          # firmware. Override the URL and you must override the checksum too,
          # or the fetch refuses to run -- an unverified download is exactly
          # what this is meant to prevent.
          SECRET_PRO:     ${{ secrets.STOCK_URL_CREATOR5PRO }}
          SECRET_PRO_SHA: ${{ secrets.STOCK_SHA256_CREATOR5PRO }}
          SECRET_STD:     ${{ secrets.STOCK_URL_CREATOR5 }}
          SECRET_STD_SHA: ${{ secrets.STOCK_SHA256_CREATOR5 }}
        run: |
          set -euo pipefail
          mkdir -p stock

          get() {   # name url sha dest
            if [ -z "$2" ]; then
              echo "::error::no URL for $1"; exit 1
            fi
            if [ -z "$3" ]; then
              echo "::error title=Unverified firmware download::$1 has a URL but no sha256. Set the matching STOCK_SHA256_* secret; an unpinned firmware would let this suite report green against bytes nobody checked."
              exit 1
            fi
            if [ -f "$4" ] && echo "$3  $4" | sha256sum -c - >/dev/null 2>&1; then
              echo "  $1: cache hit, checksum ok"
              return
            fi
            echo "  $1: fetching $2"
            curl -fsSL "$2" -o "$4"
            echo "$3  $4" | sha256sum -c -
          }

          # Written out rather than nested in one expansion: a URL and its
          # checksum must come from the SAME source, and a clever ${x:+y}${x:-z}
          # pair silently pastes the URL in where the checksum belongs.
          PRO_URL="${SECRET_PRO:-$STOCK_URL_CREATOR5PRO}"
          if [ -n "${SECRET_PRO:-}" ]; then PRO_SHA="${SECRET_PRO_SHA:-}"
          else PRO_SHA="$STOCK_SHA_CREATOR5PRO"; fi

          STD_URL="${SECRET_STD:-$STOCK_URL_CREATOR5}"
          if [ -n "${SECRET_STD:-}" ]; then STD_SHA="${SECRET_STD_SHA:-}"
          else STD_SHA="$STOCK_SHA_CREATOR5"; fi

          get Creator5Pro "$PRO_URL" "$PRO_SHA" stock/Creator5Pro-stock.tgz
          get Creator5    "$STD_URL" "$STD_SHA" stock/Creator5-stock.tgz

      - name: Write test.env (the replica's /usr/prog)
        env:
          SECRET_FACTORY:     ${{ secrets.FACTORY_URL }}
          SECRET_FACTORY_SHA: ${{ secrets.FACTORY_SHA256 }}
          # A prebuilt replica image: it carries the factory partitions AND
          # the stock package already installed, which is about a minute of
          # setup saved on EVERY replica case -- with a full suite's worth of
          # them, that is the difference between this job and a coffee break.
          # Defaults to the public one; vars.PRINTER_IMAGE overrides it for a
          # fork building its own. Left unset for a long time, silently, which
          # is what made every run here pay the local-build cost on every
          # case without anyone deciding that on purpose.
          PRINTER_IMAGE: ${{ vars.PRINTER_IMAGE || 'monstrofil/creator5-printer:latest' }}
        run: |
          set -euo pipefail
          : > test.env

          URL="${SECRET_FACTORY:-$FACTORY_URL}"
          if [ -n "${SECRET_FACTORY:-}" ]; then SHA="${SECRET_FACTORY_SHA:-}"
          else SHA="$FACTORY_SHA"; fi

          if [ -z "$SHA" ]; then
            echo "::error title=Unverified factory image::FACTORY_URL is set without FACTORY_SHA256."
            exit 1
          fi
          if [ -f stock/factory.tar.xz ] && \
             echo "$SHA  stock/factory.tar.xz" | sha256sum -c - >/dev/null 2>&1; then
            echo "  factory image: cache hit, checksum ok"
          else
            curl -fsSL "$URL" -o stock/factory.tar.xz
            echo "$SHA  stock/factory.tar.xz" | sha256sum -c -
          fi
          echo "PROG_DUMP=\"$PWD/stock/factory.tar.xz\"" >> test.env

          [ -z "${PRINTER_IMAGE:-}" ] || echo "PRINTER_IMAGE=\"$PRINTER_IMAGE\"" >> test.env
          cat test.env

      - name: Write config.env
        run: |
          cat > config.env <<CFG
          MOD_NAME=anvil
          MOD_VER=ci
          SW_VER=""
          TARGET_MACHINE=Creator5Pro
          STOCK_TGZ_CREATOR5PRO="$PWD/stock/Creator5Pro-stock.tgz"
          STOCK_TGZ_CREATOR5="$PWD/stock/Creator5-stock.tgz"
          STOCK_TGZ=""
          # No Klipper source knob any more: pkg/klipper builds from the
          # commit pinned in versions.env and nothing else. The variable that
          # used to live here, KLIPPER_FORK, is what let v20260824 ship the
          # stock klippy tree by being set to "" in this very file.
          ROOT_PW_HASH='\$6\$ci\$abcdefghijklmnopqrstuvwxyz'
          FF_KEY='FFP0331&*%root'
          CFG

      # The replica gates run ./bin/patch.sh, which needs the real Mainsail
      # zip and HelixScreen tarball in vendor/ -- patch.sh does not fetch them
      # itself, bin/build.sh does, and the gates do not go through build.sh.
      # Nothing here noticed until this job ran for the first time, because
      # every local run already had a populated vendor/. All are public,
      # sha256-pinned in versions.env, and re-download only on a version bump.
      #
      # Cached because the set now includes the Klipper fork and the ~203MB
      # MIPS toolchain that compiles its chelper -- this job runs on every
      # push, and the toolchain host should not pay for that.
      - name: Cache the pinned vendor assets
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('versions.env') }}

      - name: Fetch the pinned Mainsail, HelixScreen, Moonraker and Klipper assets
        run: make vendor ASSET_ROOT=$PWD

      - name: Extract the printer rootfs
        run: make rootfs ASSET_ROOT=$PWD

      # The replica starts sibling containers through the docker socket and
      # needs loop devices for the simulated USB stick; both work on a stock
      # ubuntu-latest runner.
      - name: Brick-safety suite on the printer replica
        run: |
          docker build -q -t creator5-fw-build -f docker/Dockerfile.build docker
          docker run --rm \
            -v "$PWD":"$PWD" -w "$PWD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e REQUIRE_PRINTER_SIM=1 \
            creator5-fw-build ./test/run-tests.py

      # The qa suite, on the same machine the gate above just used.
      #
      # It runs after the old suite rather than instead of it. Every assertion
      # in qa/replica is currently also made by a case-*.sh, on purpose: a
      # case script is deleted only once its replacement here has been green,
      # so there is never a window where coverage drops. As those deletions
      # land this step grows and the one above shrinks.
      #
      # ORDER IS LOAD-BEARING, and not only for tidiness. The qa replica lane
      # INSTALLS the package for real -- the printer's own app_startup.sh, off
      # a FAT stick -- so it needs a built package in work/out. The step above
      # produces one (run-tests.py runs unpack/patch/pack before its install
      # gate). So this step depends on that one having RUN, not merely on it
      # having passed.
      #
      # That also supplies the cross-built s6, because s6 ships INSIDE the
      # package; there is no separate s6 build tree to track.
      #
      # WHEN THE OLD SUITE IS DELETED, this needs an explicit
      # `./bin/unpack.sh && ./bin/patch.sh && ./bin/pack.sh` (or `make build`)
      # step before it, or it goes red for a reason that has nothing to do
      # with the code under test.
      #
      # Not `if: always()` -- if the release gate above failed, the machine is
      # in a state neither suite is describing any more.
      - name: qa suite on the printer replica
        run: |
          docker run --rm \
            -v "$PWD":"$PWD" -w "$PWD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            creator5-fw-build \
            python3 -m pytest ./qa -q
