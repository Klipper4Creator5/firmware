name: ci

# The stock FlashForge firmware is proprietary and ~93MB, so it is never in
# the repo. The `test` job runs against a synthetic fixture that reproduces
# the package STRUCTURE (see test/unit/make-stock-fixture.sh) -- enough
# for the static and packaging checks, but NOT enough to prove a package will
# not brick a printer.
#
# That proof needs the printer's real rootfs, and so it needs the stock
# package. The `printer-sim` job below runs it whenever the STOCK_URL_*
# secrets are set, and `release.yml` requires it outright.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssl xz-utils unzip binutils file squashfs-tools python3-pytest python3-jinja2

      # Syntax and the brick lint are the first thing run-tests.sh does, so
      # they are not repeated here.
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # Errors are a gate. These used to end in `|| true`, which meant
          # shellcheck could report anything it liked and the job stayed green.
          # payload scripts run under busybox ash on the printer.
          shellcheck -s sh   -S error payload/*.sh payload/init.d/S* payload/firmwareExe
          shellcheck -s bash -S error bin/*.sh test/*.sh test/unit/*.sh test/integration/*.sh
          # Warnings are advisory: printed, not enforced.
          shellcheck -s sh -S warning payload/*.sh payload/init.d/S* payload/firmwareExe || true

      - name: Full test suite (fixture-based)
        run: ./test/run-tests.sh

      - name: Upload built fixture packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-packages
          path: work/out/*.tgz
          if-no-files-found: ignore
          retention-days: 7

  # Does the repo have access to the stock firmware? Secrets cannot be read
  # from a job-level `if`, so decide it in a step and fan out from there.
  have-firmware:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          PRO: ${{ secrets.STOCK_URL_CREATOR5PRO }}
        run: |
          if [ -n "$PRO" ]; then echo "available=true" >> "$GITHUB_OUTPUT"
          else echo "available=false" >> "$GITHUB_OUTPUT"; fi

  # The real check: install the package into a replica of the printer -- the
  # actual rootfs.squashfs under qemu-mipsel, on the printer's own busybox --
  # and assert the machine still boots.
  printer-sim:
    needs: have-firmware
    if: needs.have-firmware.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the stock firmware
        env:
          PRO:     ${{ secrets.STOCK_URL_CREATOR5PRO }}
          STD:     ${{ secrets.STOCK_URL_CREATOR5 }}
          PRO_SHA: ${{ secrets.STOCK_SHA256_CREATOR5PRO }}
        run: |
          set -euo pipefail
          mkdir -p stock
          curl -fsSL "$PRO" -o stock/Creator5Pro-stock.tgz
          [ -z "${STD:-}" ] || curl -fsSL "$STD" -o stock/Creator5-stock.tgz
          [ -z "${PRO_SHA:-}" ] || echo "$PRO_SHA  stock/Creator5Pro-stock.tgz" | sha256sum -c -

      - name: Write test.env (the replica's /usr/prog)
        env:
          FACTORY: ${{ secrets.FACTORY_URL }}
          # Optional repository variable: a prebuilt replica image, e.g.
          # monstrofil/creator5-printer:latest. It carries the factory
          # partitions AND the stock package already installed, which is about
          # a minute of setup saved on every replica case.
          PRINTER_IMAGE: ${{ vars.PRINTER_IMAGE }}
        run: |
          set -euo pipefail
          : > test.env
          if [ -n "${FACTORY:-}" ]; then
            curl -fsSL "$FACTORY" -o stock/factory.tar.xz
            echo "PROG_DUMP=\"$PWD/stock/factory.tar.xz\"" >> test.env
          elif [ -z "${PRINTER_IMAGE:-}" ]; then
            echo "::warning::no FACTORY_URL secret and no PRINTER_IMAGE variable -- the replica has no real /usr/prog and will refuse to run"
          fi
          [ -z "${PRINTER_IMAGE:-}" ] || echo "PRINTER_IMAGE=\"$PRINTER_IMAGE\"" >> test.env
          cat test.env

      - name: Write config.env
        run: |
          cat > config.env <<CFG
          MOD_NAME=anvil
          MOD_VER=ci
          SW_VER=""
          TARGET_MACHINE=Creator5Pro
          STOCK_TGZ_CREATOR5PRO="$PWD/stock/Creator5Pro-stock.tgz"
          STOCK_TGZ_CREATOR5="$PWD/stock/Creator5-stock.tgz"
          STOCK_TGZ=""
          KLIPPER_FORK=""
          ROOT_PW_HASH='\$6\$ci\$abcdefghijklmnopqrstuvwxyz'
          FF_KEY='FFP0331&*%root'
          CFG

      - name: Extract the printer rootfs
        run: make rootfs ASSET_ROOT=$PWD

      # The replica starts sibling containers through the docker socket and
      # needs loop devices for the simulated USB stick; both work on a stock
      # ubuntu-latest runner.
      - name: Brick-safety suite on the printer replica
        run: |
          docker build -q -t creator5-fw-build -f docker/Dockerfile.build docker
          docker run --rm \
            -v "$PWD":"$PWD" -w "$PWD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e REQUIRE_PRINTER_SIM=1 \
            creator5-fw-build ./test/run-tests.sh
