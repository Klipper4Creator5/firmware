# /usr/data/anvil/anvil.conf -- runtime switches. Edit on the printer, reboot.
# PRESERVED across mod updates.

# Web stack: nginx (Mainsail on :80) + moonraker (:7125).
# The only one there is -- FlashForge's HTTP API went with firmwareExe.
# 0 = no web UI at all, ssh only.
MOD_WEB=1

# SSH: dropbear on :22
MOD_SSH=1

# WiFi: bring up wlan0 + wpa_supplicant + udhcpc, because firmwareExe used to
# do it and no longer runs.
MOD_WIFI=1
