# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it, and your changes go with
# it -- silently, save for one line in the install log. Put them in printer.cfg
# instead: no flash ever writes that file.
#
# Overriding works because Klipper parses with RawConfigParser(strict=False):
# same-named sections MERGE, the LAST value of an option wins, and a redefined
# [gcode_macro] replaces the original. So restate only what you are changing,
# at the END of printer.cfg, after the includes:
#
#     [ff_toolchange]
#     fast_feed: 24000     ; every other option in the section stays as shipped
#
# Whatever you leave out keeps the value shipped here. That is the point: your
# printer.cfg carries your differences, not a fork of this file.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# ff-runout.cfg -- filament runout / clog handling for Mainsail prints
#
# The stock config ships all eight sensors with pause_on_runout: False and a
# runout_gcode that only prints "wheel runout:Tn" -- the touchscreen app did
# the rest: it polled the MOUNTED channel's switch sensor from its print
# engine (CommMgr::serialPrint @0x7a0d4c -> M25, "Paused. Filament runout."
# E0162) and kept only the mounted tool's motion sensor enabled
# (setFilamentWheelManager @0x79b060: all four ENABLE=0, then RESET +
# ENABLE=1 for the current channel; BuildPage::checkFilamentWheel ->
# "Paused. Clog detected." E0163). See docs/notes/49-runout-recovered.md.
#
# The port splits the job: ff_toolchange.py arms the mounted tool's two
# sensors on every grab and disarms everything on release (status keys
# runout_armed / runout_sensors); this file gives the sensors a
# runout_gcode that pauses ONLY when an SD print is running and the sensor
# belongs to the mounted tool. Reload with LOAD_FILAMENT TOOL=n (its paused
# path is the app's in-print feed), then RESUME. No endless-spool: another
# tool is another head, not another spool.
#
# INSTALL: include AFTER printer.base.cfg (which includes the stock
# printer.filament.cfg). Klipper merges repeated sections, later options win
# (configfile.py: RawConfigParser(strict=False)), so this file only has to
# restate the options it changes. REQUIRED -- not an optional drop-in:
#     [include printer.base.cfg]
#     ...
#     [include ff-runout.cfg]
# Do not edit printer.filament.cfg -- the OTA overwrites it.
# ---------------------------------------------------------------------------

[filament_switch_sensor fd_ex0]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=0 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=0 KIND=switch

[filament_motion_sensor fm_ex0]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=0 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=0 KIND=motion

[filament_switch_sensor fd_ex1]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=1 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=1 KIND=switch

[filament_motion_sensor fm_ex1]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=1 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=1 KIND=motion

[filament_switch_sensor fd_ex2]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=2 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=2 KIND=switch

[filament_motion_sensor fm_ex2]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=2 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=2 KIND=motion

[filament_switch_sensor fd_ex3]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=3 KIND=switch
insert_gcode:
    _FF_INSERT TOOL=3 KIND=switch

[filament_motion_sensor fm_ex3]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=3 KIND=motion
insert_gcode:
    _FF_INSERT TOOL=3 KIND=motion

# ---------------------------------------------------------------------------
# Policy knobs, and nothing else -- no macro writes to these. clog_pause is
# the app's general.json "plugCheck" toggle (the motion sensors stay armed; a
# clog is reported, not acted on, when 0). switch_pause has no app equivalent
# -- runout always paused. Both pause the moment the sensor trips, as the app
# did: the switch sits upstream of the extruder gear with a long PTFE run
# between, so the head still holds that filament and it is lost.
# ---------------------------------------------------------------------------
[gcode_macro _FF_RUNOUT_CFG]
variable_switch_pause: 1
variable_clog_pause: 1
gcode:

# ---------------------------------------------------------------------------
# Called by the sensors' runout_gcode. Klipper already filters on the
# idle_timeout "Printing" state (any motion counts, a LOAD_FILAMENT too), so
# the SD-job check here is what keeps a manual unload from pausing nothing.
# ---------------------------------------------------------------------------
[gcode_macro _FF_RUNOUT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set kind = params.KIND|default('switch') %}
    {% set cfg = printer["gcode_macro _FF_RUNOUT_CFG"] %}
    {% set tc = printer.ff_toolchange %}
    {% set sensor = ('fm_ex' if kind == 'motion' else 'fd_ex') ~ tool %}
    {% if printer.print_stats.state != 'printing' or printer.pause_resume.is_paused %}
        { action_respond_info("%s: runout event on T%d ignored (no print running)" % (sensor, tool)) }
    {% elif tool != tc.current_tool %}
        { action_respond_info("%s: runout event on T%d ignored (mounted tool is T%d)" % (sensor, tool, tc.current_tool)) }
    {% elif kind == 'motion' and not cfg.clog_pause %}
        { action_respond_info("%s: clog detected on T%d -- not pausing (clog_pause=0)" % (sensor, tool)) }
    {% elif kind != 'motion' and not cfg.switch_pause %}
        { action_respond_info("%s: filament runout on T%d -- not pausing (switch_pause=0)" % (sensor, tool)) }
    {% elif kind == 'motion' %}
        PAUSE
        M117 T{tool} clog
        { action_respond_info("Paused: clog detected on T%d. Clear it, then RESUME (or CANCEL_PRINT)." % tool) }
    {% else %}
        PAUSE
        M117 T{tool} out of filament
        { action_respond_info("Paused: T%d ran out. Feed new filament, then LOAD_FILAMENT TOOL=%d and RESUME (or CANCEL_PRINT)." % (tool, tool)) }
    {% endif %}

# ---------------------------------------------------------------------------
# Called by the sensors' insert_gcode (Klipper only fires it while idle, so
# this never interrupts a moving print). The app logged "insert" and, for
# the motion sensors, cleared its clog flag; we just tell the user what to
# do next.
# ---------------------------------------------------------------------------
[gcode_macro _FF_INSERT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set kind = params.KIND|default('switch') %}
    {% if kind == 'switch' %}
        {% if printer.pause_resume.is_paused and tool == printer.ff_toolchange.current_tool %}
            { action_respond_info("Filament detected in T%d: LOAD_FILAMENT TOOL=%d, then RESUME." % (tool, tool)) }
        {% elif not printer.pause_resume.is_paused %}
            { action_respond_info("Filament detected in T%d: LOAD_FILAMENT TOOL=%d to feed it." % (tool, tool)) }
        {% endif %}
    {% endif %}
