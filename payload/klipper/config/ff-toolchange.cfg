# ff-toolchange.cfg -- configuration for the native Creator 5 Pro toolchanger.
#
# Implementation: klippy-extras/ff_tool.py + ff_toolchange.py (copy both to
# /usr/prog/klipper/klippy/extras/).
#
# It is a Python extra rather than a set of gcode_macros because firmwareExe's
# sequence is a polling state machine -- it waits for the grab sensor to read
# active BEFORE energising the lock motor, and retries the whole approach up to
# three times if it never does. A gcode_macro renders its entire template
# before executing any of it, so it cannot poll or retry.
# See OKF/31-recovered-toolchange-sequences.md.
#
# ---------------------------------------------------------------------------
# Where the per-unit numbers live
#
# Everything is ordinary Klipper config -- firmwareExe's JSON is not read.
#
#   [ff_tool <n>]  dock_x / dock_y        written by FF_IMPORT_FIRMWARE_CONFIG
#                                         into printer.cfg's SAVE_CONFIG block
#                  nozzle_x / nozzle_y / nozzle_z
#                                         written by TOOL_OFFSET_CALIBRATE into
#                                         printer.cfg's SAVE_CONFIG block
#                  z_adjust               per-tool persistent Z correction,
#                                         set with TOOL_Z_ADJUST (autosaved too)
#   [ff_tool_offset] station_x/y/z        written by STATION_CALIBRATE
#   [ff_toolchange]  feeds etc.           below
#
# Do NOT put dock_*/nozzle_*/station_*/cylinder_* in this or any included
# file -- SAVE_CONFIG refuses to autosave an option an include already sets.
# The per-unit values belong in the "#*#" block at the end of printer.cfg,
# like pid_* do.
#
# First install on a machine that was calibrated from the touchscreen:
# include ff-legacy.cfg, run FF_IMPORT_FIRMWARE_CONFIG, SAVE_CONFIG -- it
# stages the factory dock/nozzle/station numbers. Check with
# TOOLCHANGE_STATUS before moving anything.
#
# Tool-to-tool offsets are DIFFERENCES of nozzle_* against offset_base (T0),
# exactly as CommMgr::setGrabGcodeOffsetMgr computes them:
#     X = nozzle_x[tool] - nozzle_x[base]
#     Y = nozzle_y[tool] - nozzle_y[base]
#     Z = nozzle_z[tool] - station_z + z_adjust[tool]   (absolute, ~+3.2 mm:
#                                  Z=0 is the bed whenever a tool is mounted)
# z_adjust is the per-tool babystep Klipper lacks (SET_GCODE_OFFSET Z_ADJUST
# is global): TOOL_Z_ADJUST TOOL=1 ADJUST=-0.02, then SAVE_CONFIG.
# applied after a successful pickup as the app does, in two commands:
#     SET_GCODE_OFFSET X=.. Y=.. MOVE=1 MOVE_SPEED=100
#     SET_GCODE_OFFSET Z=..       MOVE=1 MOVE_SPEED=40
# A tool with no nozzle_* gets zero offset and a warning at startup.
#
# ---------------------------------------------------------------------------
# How a tool line reaches this code
#
# Nothing is needed in the OrcaSlicer printer profile: leave the change-filament
# G-code EMPTY. With no custom block, custom_gcode_changes_tool() is false and
# Orca emits its own bare `Tn` at each tool change, which reaches
# gcode.run_script() and ff_toolchange.py's T<n> command unimpeded.
#
# Earlier releases required a `T{next_extruder} ; ff-toolchange` marker to slip
# past a bare-`Tn` trap in FlashForge's virtual_sdcard fork. We ship upstream
# virtual_sdcard now, the trap is gone, and files sliced with the old marker
# still work: the G-code parser drops the comment and `T2` arrives regardless.
#
# ---------------------------------------------------------------------------
# INSTALL
#   1. cp klippy-extras/ff_tool.py klippy-extras/ff_toolchange.py \
#         /usr/prog/klipper/klippy/extras/
#      (Klipper lives on the firmware partition -- klipper_pri.sh runs
#      /usr/prog/klipper/klippy/klippy.py. It may be mounted read-only, and an
#      OTA will overwrite it, so keep a copy and a re-apply script.)
#   2. append to /usr/data/config/printer.cfg:   [include ff-toolchange.cfg]
#      REQUIRED -- the whole ff-*.cfg set is mandatory, not a menu of
#      optional drop-ins. Without them Klipper comes up as a plain
#      printer: no toolchanger, no tool offsets, no runout handling.
#      It MUST come after [virtual_sdcard] -- the SDCARD_PRINT_FILE wrapper
#      below uses rename_existing. Do NOT put it in printer.override.cfg, which
#      is included first, before virtual_sdcard exists.
#   3. FF_IMPORT_FIRMWARE_CONFIG + SAVE_CONFIG (see README) fills in the
#      dock and nozzle data.
#   4. Run TOOLCHANGE_STATUS and confirm the sensor names AND the geometry
#      before moving anything.
# ---------------------------------------------------------------------------

# One section per tool. Deliberately empty: the dock coordinates (carriage X
# at which the dock engages, the dock's Y -- the app's x/y_check_pos<n>) and
# the nozzle calibration are per unit and live in printer.cfg's SAVE_CONFIG
# block, filled by FF_IMPORT_FIRMWARE_CONFIG. A tool without a dock refuses
# to be grabbed or released.
[ff_tool 0]

[ff_tool 1]

[ff_tool 2]

[ff_tool 3]

[ff_toolchange]
# X added to every dock_x (the app's grabOffset; 0 on this unit).
#x_correction: 0.0
# Feeds, mm/min. The app stores mm/s (grabSpeed 500, grabSpeedSlow 90 here)
# and multiplies by 60.
#fast_feed: 30000
#slow_feed: 5400
#release_slow_feed: 5400
# degC-to-mm thermal term of the print-start Z offset:
# (nozzle_temp - 120) * temp_offset. The app's tempOffset.
#temp_offset: 0.00045
# Base tool for the offset differences. The touchscreen rebases to the
# print's first tool via setBaseExtruder(); we keep a fixed base -- the
# choice cancels out, see _apply_tool_diff_offsets.
#offset_base: 0
# Reported as each tool's `fan` in the klipper-toolchanger-shaped status
# (objects `toolchanger` and `tool T0..T3`, always registered, so UIs such as
# HelixScreen see a real toolchanger; commands SELECT_TOOL / UNSELECT_TOOL /
# INITIALIZE_TOOLCHANGER are provided too, ASSIGN_TOOL is refused).
#part_fan: fan_generic fanM106

# Homing safety. firmwareExe auto-homes before a grab (doGrabExtruderLatest
# calls homeManager when not homed) -- but on the touchscreen someone is
# standing at the machine. A remote T<n> silently starting G28 can crash into
# whatever is sitting on the bed, so by default an unhomed toolchange ABORTS
# with "run G28 first". Set True to restore the app's behaviour.
#auto_home: False

# Staging positions. These are code constants in the app, not stored config.
x_safe: 250
x_approach: 280
grab_pullback: 20
grab_retreat_feed: 1500
release_retreat_feed: 4800
accel_move: 8000
# accel_restore -- the app hardcodes 20000, but unset the module restores the
# accel limit that was live when the sequence started, so a machine configured
# below 20000 does not come out of a toolchange faster than its [printer]
# max_accel. Set this only to force the app's literal behaviour.
#accel_restore: 20000

# Sensor names. These are microswitches, exposed to Klipper as [gcode_button]
# sections in printer.base.cfg -- but what they ARE is the app's sensors:
#   dock_sensors -- one per tool; PRESSED means that tool IS in its dock.
#     (CommMgr::checkInLocation indexes these by tool.)
#   grab_sensors -- OR'd; any PRESSED means the carriage is mated with a tool.
#     (CommMgr::getGrabSensorStatus -- a plain OR, kept for fidelity.)
# Confirmed against this printer's printer.base.cfg: it defines extruder_pos1..4
# and extruder_grab1..4 and NOTHING ELSE of this family -- there is no bare
# `extruder_grab`, no servo_min/servo_max, no extruder_check_pos, and motor_pin
# is commented out in printer.motor.cfg.
dock_sensors: extruder_pos1, extruder_pos2, extruder_pos3, extruder_pos4
grab_sensors: extruder_grab1, extruder_grab2, extruder_grab3, extruder_grab4

# Lock-motor macros. CONFIRMED PRESENT in this printer's printer.motor.cfg
# (not printer.macro.cfg -- that file has no MOTOR_* at all).
#
# The production lock is a [manual_stepper gear_stepper] on an A4988 with a
# PWM current-reference pin, NOT the DC-motor-on-H-bridge of the dev config:
#   MOTOR_GRAB    -> STEPPER_LOCK:   VREF 0.25, MANUAL_STEPPER MOVE=0.07 SPEED=0.25, M400
#   MOTOR_GRAB2   -> VREF 0.25, MANUAL_STEPPER MOVE=0.03 SPEED=0.02 SYNC=0,
#                    then delayed LOW_VREF drops the ref to 0.05 after 1.7 s
#   MOTOR_RELEASE -> STEPPER_UNLOCK: VREF 0.35, MOVE=-0.1 STOP_ON_ENDSTOP=1 SYNC=0
#   MOTOR_STOP    -> entirely commented out; a NO-OP. We still call it, as the app does.
grab_macro: MOTOR_GRAB
grab2_macro: MOTOR_GRAB2
release_macro: MOTOR_RELEASE
stop_macro: MOTOR_STOP


# NO PERSISTENT TOOL STATE.
#
# The mounted tool is DERIVED FROM THE DOCK SENSORS every time it is needed: the
# tool whose dock is empty is the one on the carriage. Nothing is stored, so
# nothing can go stale after a touchscreen print, a power cut mid-change, or a
# manual swap.
#
# firmwareExe cannot do this. Its getGrabSensorStatus(info, tool) @0x76f294
# ignores the `tool` argument and just ORs the four grab bytes, so the app only
# learns THAT something is held, never WHICH. That is why it keeps an imperative
# index (extruderConfig()+0x5c / now_extruder): written on grab, reset to -1 on
# release and on every home, persisted by syncExtruderConfig. checkInstallExtruder
# @0x781a34 shows how the two combine:
#     installed = dock_sensor[tool] || (anyGrabbed && now_extruder == tool)
#
# extruder_pos1..4 are per-tool, so they carry that name directly, and they also
# distinguish "tool is on the carriage" from "tool has been taken out of the
# machine" (dock empty, nothing grabbed) -- which now_extruder cannot express.
#
# Anything the sensors cannot explain ABORTS rather than guessing:
#   * a tool grabbed while all four docks are occupied  -> impossible, sensor fault
#   * a tool grabbed while >1 dock is empty             -> cannot say which is held
# Guessing wrong means releasing the wrong tool: driving to another tool's dock
# and dropping the tool actually being carried into it. TOOLCHANGE_STATUS shows
# every switch so you can see which one disagrees.


# ---------------------------------------------------------------------------
# Moonraker's print entry point.
#
# WHY THIS WRAPPER EXISTS
#
# It refuses to start at all while the machine is uncalibrated: a file
# with its own start G-code would otherwise print in the raw eddy Z frame,
# ~3.2 mm into the plate. _FF_JOB.allow_uncalibrated=1 overrides for tests.
#
# The four SDCARD_* lines below clear per-job state that FlashForge's
# virtual_sdcard fork carried over from the last touchscreen job (a stale
# `refuelling` flag, FFM, and the two "print this job on another extruder"
# remap flags). Those commands exist only in the fork; on the upstream
# virtual_sdcard we now ship they are unknown commands. FIXME.
# ---------------------------------------------------------------------------
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _FF_SDCARD_PRINT_FILE
gcode:
    {% set tc = printer.ff_toolchange %}
    {% if not tc.print_offset_ready and not printer["gcode_macro _FF_JOB"].allow_uncalibrated %}
        { action_raise_error("Refusing to print: station_z=%s, calibrated tools %s. "
            "Run STATION_CALIBRATE / TOOL_OFFSET_CALIBRATE (or FF_IMPORT_FIRMWARE_CONFIG) "
            "and SAVE_CONFIG first -- without them the nozzle would be driven ~3 mm into the plate."
            % (tc.station_z, tc.calibrated_tools)) }
    {% endif %}
    SDCARD_CLEAR_REFUELLING
    SDCARD_ENABLE_FFM ENABLE=0
    SDCARD_SET_NEED_CHECK_EX CHECK=0
    SDCARD_NO_FILAMENT_CHECK_EX CHECK=0
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=mainsail VALUE=1
    _FF_SDCARD_PRINT_FILE {rawparams}

# ---------------------------------------------------------------------------
# Homing Z with a head on the carriage rams the nozzle into the plate: Z
# homes on the carriage's eddy sensor, whose trigger height is ~3.2 mm BELOW
# the nozzle tip (that gap is the print Z offset). The app auto-parked in
# its own flows; Mainsail/HelixScreen just send G28. So G28 docks a mounted
# tool first: X/Y home to 0, away from the docks at X~297, so homing them
# with a head on is safe, and docking needs only X/Y. If the dock sensors
# cannot say whether a head is on, Z homing is refused outright.
# ---------------------------------------------------------------------------
[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set tc = printer.ff_toolchange %}
    {% set axes = rawparams|upper %}
    {% set wants_z = 'Z' in axes or ('X' not in axes and 'Y' not in axes) %}
    {% if wants_z and not tc.state_ok %}
        { action_raise_error("Refusing to home Z: cannot tell whether a tool is mounted (%s). A head on the carriage would be driven into the plate. Check the docks, then retry." % tc.state_reason) }
    {% elif wants_z and tc.current_tool >= 0 %}
        { action_respond_info("T%d is mounted -- docking it before homing Z" % tc.current_tool) }
        G28.1 X Y
        TOOLCHANGE_PARK
        G28.1 {rawparams}
    {% else %}
        G28.1 {rawparams}
    {% endif %}

# ---------------------------------------------------------------------------
# Input shaper / resonance tests with a head on the carriage.
#
# Mainsail and HelixScreen send the stock commands verbatim and know nothing
# about tools. Measuring an empty carriage gives the wrong moving mass (the
# app's testVibration grabbed a head first -- general.json "grabVibration").
# These wrappers home if needed, grab shaper_tool when nothing is mounted,
# and hand the original parameters through. The tool stays mounted
# afterwards (TOOLCHANGE_PARK to dock it). Needs [resonance_tester].
# ---------------------------------------------------------------------------
[gcode_macro _FF_SHAPER_PREP]
variable_shaper_tool: 0
gcode:
    {% set tc = printer.ff_toolchange %}
    {% if not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28                              ; docks a mounted tool first (wrapper above)
    {% endif %}
    {% if tc.current_tool < 0 %}
        { action_respond_info("no tool mounted -- grabbing T%d for the resonance test" % shaper_tool) }
        T{shaper_tool}
    {% endif %}

[gcode_macro SHAPER_CALIBRATE]
rename_existing: _FF_SHAPER_CALIBRATE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_SHAPER_CALIBRATE_BASE {rawparams}

[gcode_macro TEST_RESONANCES]
rename_existing: _FF_TEST_RESONANCES_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_TEST_RESONANCES_BASE {rawparams}

[gcode_macro MEASURE_AXES_NOISE]
rename_existing: _FF_MEASURE_AXES_NOISE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_MEASURE_AXES_NOISE_BASE {rawparams}
