# ---------------------------------------------------------------------------
# ff-orca-compat.cfg -- run FlashForge's STOCK slicer G-code unmodified
#
# Without this file a Mainsail print needs an edited machine start G-code: a
# START_PRINT line carrying BED/TOOL/NOZZLE/LAYER, because the touchscreen app
# used to do all the print preparation itself and the stock start G-code
# therefore assumes an already-homed, already-offset machine.
#
# With this file included, the stock Orca/FlashForge start G-code works as
# shipped. Nothing to re-slice, nothing to re-profile.
#
# WHY THE STOCK G-CODE CANNOT JUST RUN
# The stock block, annotated with what is missing:
#
#     M140 S<bed>            ok
#     M106 P101 S0           ok
#     M191 S0                NOT a command in this fork -- the app intercepted
#                            it. Unknown command -> the print aborts.
#     M104 S<nozzle>         ok
#     G90 / M83              ok
#     G1 Z5 F2400            "Must home axis first" -- nothing has homed.
#     T<n>                   needs a homed machine and the tool offsets
#     M109 S<nozzle> T<n>    ok
#     G1 X256 Y0 Z0.2        the prime line, in a Z frame that is ~3.2 mm off
#                            until TOOLCHANGE_SET_PRINT_OFFSET has run
#
# So two things are needed: the machine must be READY before the file's first
# motion, and the print Z offset must be applied before the prime line. Both
# hook onto points the stock file already provides.
#
#   1. Ready:  SDCARD_PRINT_FILE (ff-toolchange.cfg) already wraps the Mainsail
#      entry point, and it runs BEFORE the file's first line. The homing and
#      bed mesh move there, which is what makes `G1 Z5` legal.
#   2. Offset: M109 is the last command before the prime line, and by then the
#      tool is grabbed (T<n> ran) and every value is known -- the nozzle target
#      from M109's own S, the bed from heater_bed.target which the file's M140
#      set, the tool from M109's T. So M109 applies the offset and then gets
#      out of the way.
#
# ABOUT LAYER HEIGHT -- the one value the stock G-code never states. It is
# needed only as a threshold: TOOLCHANGE_SET_PRINT_OFFSET subtracts 0.06 mm
# when 0 < layer <= 0.10 mm and nothing at all otherwise (the app's
# `slti 0xb` @0x9fc6c8). So for every common layer height -- 0.12, 0.15, 0.2,
# 0.25 -- the term is zero and guessing costs nothing. `default_layer` below
# is 0.2, i.e. "not a thin layer". If you print at 0.10 mm or below, set it:
#   SET_GCODE_VARIABLE MACRO=_FF_AUTOSTART VARIABLE=default_layer VALUE=0.08
# or keep a START_PRINT line with LAYER= for those profiles.
#
# SCOPE. Everything here is gated on _FF_JOB.mainsail, the flag
# SDCARD_PRINT_FILE sets. Prints started from the touchscreen still go through
# firmwareExe's own preparation and are not touched.
#
# Include AFTER ff-toolchange.cfg and ff-print-macros.cfg:
#     [include /usr/data/config/ff-toolchange.cfg]
#     [include /usr/data/config/ff-print-macros.cfg]
#     [include /usr/data/config/ff-orca-compat.cfg]
#
# STILL COMPATIBLE with an edited start G-code: an explicit START_PRINT sets
# offset_done itself, so the M109 hook stands down and nothing is applied
# twice. You can migrate profiles one at a time.
# ---------------------------------------------------------------------------

# Per-job state. Reset by _FF_AUTOSTART_PREP at the start of every Mainsail
# job, so a crashed or cancelled print cannot leave a stale flag behind.
[gcode_macro _FF_AUTOSTART]
# 0 disables the whole compat layer without removing the include.
variable_enable: 1
# Layer height assumed when the file does not say. Only matters at <= 0.10.
variable_default_layer: 0.2
# Set once the machine has been homed/meshed for this job.
variable_prepped: 0
# Set once the print Z offset has been applied for this job.
variable_offset_done: 0
gcode:

# ---------------------------------------------------------------------------
# Machine-ready half of START_PRINT, run before the file's first line.
#
# Deliberately does NOT heat, clean or grab: at this point the file has not
# run, so the bed and nozzle targets and the tool are all still unknown. Those
# stay with the file's own M140/M104/T<n>/M109, exactly as on a stock machine.
# The nozzle clean the app did (clearNozzlePrint) has no equivalent here for
# the same reason -- the stock file's own prime line at X256 -> X216 is what
# primes the nozzle. Use START_PRINT with CLEAN=1 if you want the full clean.
# ---------------------------------------------------------------------------
[gcode_macro _FF_AUTOSTART_PREP]
gcode:
    SET_GCODE_VARIABLE MACRO=_FF_AUTOSTART VARIABLE=prepped VALUE=0
    SET_GCODE_VARIABLE MACRO=_FF_AUTOSTART VARIABLE=offset_done VALUE=0
    {% if printer["gcode_macro _FF_AUTOSTART"].enable %}
        ; Same gate as START_PRINT: refuse before any motion if the Z frame
        ; cannot be established. SDCARD_PRINT_FILE has already checked
        ; print_offset_ready; this also covers the mounted tool.
        _FF_REQUIRE_CALIBRATION
        G90
        M82
        BED_MESH_CLEAR
        M400
        G28
        SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600
        SET_IDLE_TIMEOUT TIMEOUT=1800000
        BED_MESH_PROFILE LOAD=MESH_DATA   ; app: heatBedThenPrintEddy @0x9f79e4
        G1 Z10 F1200                      ; clearance for the dock run
        SET_GCODE_VARIABLE MACRO=_FF_AUTOSTART VARIABLE=prepped VALUE=1
    {% endif %}

# ---------------------------------------------------------------------------
# M191 -- "wait for chamber temperature". Not a command in this fork: the
# touchscreen app intercepted it before klippy ever saw it, and this printer
# has no controllable chamber heater, only the filter/circulation fans that
# the surrounding M106 P2/P3 lines drive.
#
# Defined here as an accepted no-op so a stock file does not abort on it. The
# target is recorded for status only; nothing waits, which matches what the
# machine actually does.
# ---------------------------------------------------------------------------
[gcode_macro M191]
variable_chamber_target: 0.0
gcode:
    {% set s = params.S|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=chamber_target VALUE={s}
    {% if s > 0 %}
        { action_respond_info(
            "M191 S%.0f: this printer has no controllable chamber heater "
            "(the app intercepted M191); continuing without waiting." % s) }
    {% endif %}

# M141 is the non-waiting form and shows up in some profiles. Same treatment.
[gcode_macro M141]
gcode:
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=chamber_target VALUE={params.S|default(0)|float}

# ---------------------------------------------------------------------------
# M109 -- wait for the hotend, then apply the print Z offset.
#
# This is the hook that lets the stock file keep its own shape. In the stock
# start G-code M109 is the last command before the prime line, and it comes
# after T<n>, so everything the offset needs is available:
#
#     NOZZLE  this command's own S
#     BED     heater_bed.target, set by the file's earlier M140
#     TOOL    this command's T, else whatever T<n> grabbed
#     LAYER   not in the file -- see default_layer at the top
#
# Applied once per job (offset_done), only for Mainsail-started jobs, and only
# when a tool is actually mounted. Every other M109 -- mid-print tool changes,
# the touchscreen, the console -- falls straight through to the real one.
# ---------------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M109.1
gcode:
    M109.1 {rawparams}
    {% set st = printer["gcode_macro _FF_AUTOSTART"] %}
    {% if st.enable and not st.offset_done
          and printer["gcode_macro _FF_JOB"].mainsail %}
        {% set tc = printer.ff_toolchange %}
        {% set tool = params.T|default(tc.current_tool)|int %}
        {% if tool >= 0 and tc.current_tool >= 0 %}
            {% set nozzle = params.S|default(0)|float %}
            {% set bed = printer.heater_bed.target|float %}
            TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={st.default_layer} TOOL={tool}
            SET_GCODE_VARIABLE MACRO=_FF_AUTOSTART VARIABLE=offset_done VALUE=1
            SET_IDLE_TIMEOUT TIMEOUT=864000       ; app value during print
        {% endif %}
    {% endif %}
