# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it, and your changes go with
# it -- silently, save for one line in the install log. Put them in printer.cfg
# instead: no flash ever writes that file.
#
# Overriding works because Klipper parses with RawConfigParser(strict=False):
# same-named sections MERGE, the LAST value of an option wins, and a redefined
# [gcode_macro] replaces the original. So restate only what you are changing,
# at the END of printer.cfg, after the includes:
#
#     [ff_toolchange]
#     fast_feed: 24000     ; every other option in the section stays as shipped
#
# Whatever you leave out keeps the value shipped here. That is the point: your
# printer.cfg carries your differences, not a fork of this file.
# ---------------------------------------------------------------------------
# ff-tool-offset.cfg -- nozzle XY/Z offset calibration, Klipper-native.
#
# Implementation: payload/klipper/extras/ff_tool_offset.py (copy next to
# ff_toolchange.py in /usr/prog/klipper/klippy/extras/).
# Recovered sequence: docs/notes/46-offset-calibration-recovered.md
#
# What it does
#   The station sits BELOW the bed plane, so the build plate has to come
#   off. That is not asked for as a flag -- the plate check (below) parks
#   the carriage and measures whether the plate is there.
#
#   TOOL_CALIBRATE_TOOL_OFFSET
#       the MOUNTED tool (SELECT_TOOL T=<n> first, as upstream's
#       CALIBRATE_TOOL_OFFSETS does): zero the G-code offset, go to
#       (cylinder_x - 12.5, cylinder_y), ESTOP Z to
#       z_target (default -3; the app used -5), four ESTOP probes outward
#       (+X +Y -X -Y, 14 mm) at Z+0.6, circle fit, second pass centred on that
#       fit with Z re-probed, store the second fit as [ff_tool n]'s
#       nozzle_x/nozzle_y/nozzle_z. Identical to the touchscreen's
#       "Four-point" (default) calibration, constants included.
#   TOOL_LOCATE_SENSOR
#       the same, with an EMPTY carriage, from (cylinder_x, cylinder_y);
#       second Z probe to -3; stores
#       station_x/y/z in [ff_tool_offset]. station_z feeds
#       TOOLCHANGE_SET_PRINT_OFFSET, so re-run this whenever the station or
#       bed is disturbed.
#   TOOL_OFFSET_STATUS                      the saved values: cylinder start
#       point, each tool's nozzle triple (or NOT CALIBRATED), the station
#       triple, and whether a calibration is staged but unsaved.
#
# Where results go
#   The SAVE_CONFIG block of printer.cfg, like PID or input-shaper results:
#       #*# [ff_tool 1]
#       #*# nozzle_x = 16.407789   nozzle_y = 211.986710   nozzle_z = 1.426736
#       #*# [ff_tool_offset]
#       #*# station_x = 28.791826  station_y = 212.639328  station_z = -1.678819
#   Values are applied live immediately and persisted by SAVE_CONFIG (restart).
#   Absolute station-frame numbers are stored, so calibrating only T2 leaves
#   T0/T1/T3 valid; ff_toolchange derives the tool-to-tool differences.
#   firmwareExe's extruder.json is never read or written (the app rewrites it
#   from memory on every grab). FF_IMPORT_FIRMWARE_CONFIG (ff-legacy.cfg)
#   imports the factory numbers once.
#
# Prerequisites
#   * [ff_tool 0..3] sections (ff-toolchange.cfg) and [ff_toolchange] for
#     T<n> / TOOLCHANGE_PARK. TOOL_CALIBRATE_TOOL_OFFSET measures whatever
#     is on the carriage, so select the tool first; TOOL_LOCATE_SENSOR
#     wants an empty one and parks for you (PARK=0 if you did it by hand).
#   * home all axes first; the extra refuses otherwise.
#   * the PEI sheet removed as for the touchscreen calibration -- the
#     station sits below the bed plane.
#   * do not write nozzle_*/station_* in an include: SAVE_CONFIG refuses to
#     autosave an option an include already sets.
#
# Safety notes (all divergences from the app, which accepts ANY numbers)
#   * the plate check runs first on both commands and REFUSES if the build
#     plate is still on -- a measurement, not an operator's promise.
#   * z_target defaults to -3 (the app's own station pass-2 value) instead of
#     the app's -5: 2 mm less crash depth if the plate is on after all.
#   * Once a trigger height is known (nozzle_z / station_z calibrated, or
#     station_z alone for a first tool pass) the Z probe stops z_margin
#     below it instead of descending to z_target.
#   * max_residual 0.5: a point that far off the fitted circle is a
#     mis-trigger; abort without saving. (Four symmetric points dilute a
#     single bad point's error to ~1/4 in the residual but move the centre
#     by half of it, so the default catches centre errors of ~1 mm.) This
#     is a crash guard, not a quality gate -- it is deliberately loose,
#     because the app has no such check at all and a merely mediocre pass
#     is something you tune out of a first layer. Tighten it to ~0.05 if
#     you would rather be told; the numbers are printed either way.
#   * gap_min/gap_max: nozzle_z must sit 1.5..5 mm above station_z (3.19 on
#     this unit). A bogus nozzle_z is what drives the first layer into the
#     plate, so an implausible one is not saved.
#   * START_PRINT and the Mainsail entry point refuse to print while
#     nozzle_z/station_z are missing (see ff-print-macros.cfg).

[ff_tool_offset]
# Start point (the app's test.json cylinder_x/cylinder_y; 28.5 / 214.5 on a
# stock unit, same as its compiled-in defaults). FF_IMPORT_FIRMWARE_CONFIG
# autosaves the unit's values into printer.cfg -- do not set them here.
#cylinder_x: 28.5
#cylinder_y: 214.5
# The tool pass starts nozzle_x_shift to -X of the station (app: 12.5).
#nozzle_x_shift: 12.5
# ESTOP travel from the centre (app: 14).
#probe_travel: 14
# ESTOP Z targets (app: -5 / station second pass -3; our default -3 / -3).
#z_target: -3
#z_target_station_2: -3
# Stop this far below a known trigger height instead of at z_target.
#z_margin: 2.0
# Probe height above the Z trigger, lift between passes, start/exit heights.
#z_clear: 0.6
#z_lift: 3
#z_start: 10
#z_final: 15
# Accel during ESTOP moves (app: 100) and what to restore afterwards
# (unset = the limit live before the run; the app forces 20000).
#probe_accel: 100
#accel_restore: 20000
# Plausibility guards -- 0 disables (app behaviour).
#max_residual: 0.5
#min_radius: 0
#max_radius: 0
#gap_min: 1.5
#gap_max: 5.0
# Plate check before anything descends with a nozzle: with the EMPTY carriage
# the station Z must not land more than plate_z_tolerance ABOVE the calibrated
# station_z (one-sided on purpose -- a plate can only hold the probe high; a
# low reading is not a plate) and a sideways probe must find the circle's
# edge. With the build
# plate still on the Z probe stops on the sheet (or never fires) and no edge
# exists -> the command refuses. PLATE_CHECK=0 on the command skips it once.
#plate_check: True
#plate_z_tolerance: 0.8
# Probe sampling, klipper-toolchanger's names, overridable per command with
# SAMPLES= / SAMPLES_TOLERANCE= / SAMPLES_TOLERANCE_RETRIES= /
# SAMPLES_RESULT= / SAMPLE_RETRACT_DIST= / PROBE_SPEED=. Left unset, each
# one follows the fork's own [e_stop <axis>]: sub_cycle_cnt touches (3),
# spread rejected above error_v (0.02), retried main_cycle_cnt times (10),
# retracting back_v (3) between them at `speed`. So the defaults probe
# exactly as this extra always has; these only widen or narrow that.
# The one addition is samples_result: the fork always averages.
#samples: 3
#samples_tolerance: 0.02
#samples_tolerance_retries: 10
#samples_result: average       # average | median
#sample_retract_dist: 3
#probe_speed: 5

# klipper-toolchanger's documented entry point (examples/calibrate-offsets.cfg):
# UIs such as HelixScreen's setup wizard look for this macro name and show its
# description as the on-screen instruction. Runs the station pass with an
# empty carriage, then every tool; the last tool stays mounted so a following
# SHAPER_CALIBRATE has mass on the carriage. Finish with SAVE_CONFIG.
# Same shape as upstream's macro: locate the sensor once, then select each
# tool and measure it.
[gcode_macro CALIBRATE_TOOL_OFFSETS]
description: Remove the build plate and clean all nozzles first. Calibrates the station, then the nozzle offset of every tool.
gcode:
    TOOL_LOCATE_SENSOR
    {% for tool in printer.toolchanger.tool_numbers %}
        SELECT_TOOL T={tool}
        TOOL_CALIBRATE_TOOL_OFFSET
    {% endfor %}
