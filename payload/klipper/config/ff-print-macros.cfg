# ---------------------------------------------------------------------------
# ff-print-macros.cfg -- print-lifecycle macros for Mainsail/Moonraker prints
#
# The touchscreen app implements ALL print-lifecycle behavior itself (see
# OKF/61-print-lifecycle-verified.md for the address-verified sequences); the
# Klipper fork ships no START/END/PAUSE/RESUME/CANCEL macros. These macros
# reproduce the app's sequences for prints started from Mainsail.
#
# REQUIRED -- this is not an optional drop-in; the mod does not work
# without it. Include from printer.cfg AFTER [pause_resume], [virtual_sdcard] and
# ff-filament.cfg (the nozzle clean reuses its helpers and tunables):
#     [include /usr/data/config/ff-filament.cfg]
#     [include /usr/data/config/ff-print-macros.cfg]
#
# Deliberate divergences from firmwareExe (documented in OKF/61):
#   * resume reheats all tools in parallel, not e1+e2 then e3+e4 staged
#   * no dmesg/meminfo dumps, no drop_caches shell calls
#   * idle timeout after resume goes back to 864000 (app oddly uses 600000)
#   * pause park height: the app's exact clamp formula was not recovered
#     (thresholds 50/100 known); we lift +10 mm clamped to 256 -- adjust to
#     taste.
#   * tool-presence gate (E0165): the app checks only the file's first tool
#     at prepare time (the others fail later, at their grab); we refuse up
#     front for every tool in TOOLS=.
#   * nozzle clean temperatures come from the slicer (TEMPS=) or NOZZLE=,
#     not from the touchscreen's per-slot material table; the clean purge
#     height is the fixed purge_z of ff-filament.cfg, not a fresh eddy
#     probe at (265, 4.8); the PA test-line variant (paTest flag) is not
#     reproduced.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# START_PRINT -- put in the slicer's machine start gcode, e.g. (OrcaSlicer,
# see orca/machine-start-gcode.txt for the full snippet):
#   START_PRINT BED=[bed_temperature_initial_layer_single] TOOL=[initial_extruder] \
#               NOZZLE=[nozzle_temperature_initial_layer] LAYER=[layer_height] LEVEL=0 \
#               TOOLS=0,2 TEMPS=220,0,240,0 CLEAN=1
#   TOOLS  every tool the file uses (comma list; Orca: is_extruder_used[n]).
#          Each must be docked or mounted or the job is refused before any
#          heating/homing (app: E0165 "T: %d, no install"). Defaults to TOOL.
#   TEMPS  per-tool clean temperature, indexed by tool number (0 or missing
#          = use NOZZLE). App: getFilamentOperationTemp = the slot's material
#          table temperature.
#   CLEAN  1 (default): purge + wipe every tool in TOOLS while the bed heats
#          (app: clearNozzlePrint). 0 skips it.
#   SOAK   seconds to dwell after the bed reaches target (app: 5 min). 0 = none.
# Heating of the nozzle itself is left to the sliced file (FF/Orca files carry
# M104/M109 + Tn), exactly as with touchscreen prints. Mirrors prepareForEddy
# minus the eddy probe touches (checkProbeZValue is app-internal).
#
# NOZZLE/BED/LAYER feed TOOLCHANGE_SET_PRINT_OFFSET, the port of the app's
# absolute print Z offset (BuildPage::startPrint @0x9fc148). The eddy G28 Z
# does NOT put the nozzle at the bed plane -- without this offset (~+3.2 mm
# on this unit) the first layer is driven into the plate.
# ---------------------------------------------------------------------------
# Refuse BEFORE heating/homing/grabbing if the Z frame cannot be established.
# The eddy-homed Z is ~3.2 mm low; with no nozzle_z/station_z the print-start
# offset cannot be computed and the first layer goes into the plate.
# TOOLS= (comma list) checks every listed tool; TOOL= a single one; neither
# -> every tool must be calibrated.
[gcode_macro _FF_REQUIRE_CALIBRATION]
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% if tool >= 0 and tool not in tools %}{% set _ = tools.append(tool) %}{% endif %}
    {% set tc = printer.ff_toolchange %}
    {% set missing = [] %}
    {% for t in tools %}
        {% if t not in tc.calibrated_tools %}{% set _ = missing.append(t) %}{% endif %}
    {% endfor %}
    {% set ok = (tools|length > 0 and missing|length == 0 and tc.station_z is not none)
                or (tools|length == 0 and tc.print_offset_ready) %}
    {% if not ok and not printer["gcode_macro _FF_JOB"].allow_uncalibrated %}
        { action_raise_error("Not calibrated: station_z=%s, calibrated tools %s, needed %s. "
            "Run STATION_CALIBRATE / TOOL_OFFSET_CALIBRATE (or FF_IMPORT_FIRMWARE_CONFIG) "
            "and SAVE_CONFIG. Without nozzle_z/station_z the print Z offset cannot be "
            "computed and the nozzle would be driven ~3 mm into the plate."
            % (tc.station_z, tc.calibrated_tools, tools)) }
    {% endif %}

# Tool-presence gate (app: prepareForEddy @0x9f2084-0x9f2130, checkInLocation
# -> "T: %d, no install" -> E0165). A tool is available when its dock switch
# is pressed or it is the one on the carriage. Refuses before any motion.
[gcode_macro _FF_REQUIRE_TOOLS]
gcode:
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% set tc = printer.ff_toolchange %}
    {% if tools|length > 0 and not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% set missing = [] %}
    {% for t in tools %}
        {% if t < 0 or t > 3 %}
            { action_raise_error("TOOLS: tool %s out of range 0..3" % t) }
        {% elif t not in tc.docked_tools and t != tc.current_tool %}
            {% set _ = missing.append(t) %}
        {% endif %}
    {% endfor %}
    {% if missing|length > 0 %}
        { action_raise_error("Tool(s) %s not installed (dock switch not pressed, not mounted); "
            "docked %s, mounted T%s. Install them or re-slice without them."
            % (missing, tc.docked_tools, tc.current_tool)) }
    {% endif %}

# ---------------------------------------------------------------------------
# _FF_NOZZLE_CLEAN TOOLS=<list> [TEMPS=<list>] [TEMP=<fallback>]
# Port of BuildPage::clearNozzlePrint @0x9f46f4 (50a/50b-nozzle-clean notes).
# Per tool, in order: grab, travel to the purge chute, heat to the tool's
# temperature and wait (+-3 C), chamber fans off, purge E50 / part fan 60 % /
# E-5, travel to the wipe spot (266.5, 13.8) and lower to clean_wipe_z,
# fans back, set the hotend to temp - clean_cool_delta and wait until it is
# there, part fan off, G1 Z10, release. Uses ff-filament.cfg's helpers and
# tunables ([gcode_macro _FF_FILAMENT]: purge_*, clean_*, purge_fan ...).
# The hotend is left at temp - clean_cool_delta, as the app leaves it.
# ---------------------------------------------------------------------------
[gcode_macro _FF_NOZZLE_CLEAN]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set fallback = params.TEMP|default(ff.default_temp)|float %}
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' and s|trim|int not in tools %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% set temps = [] %}
    {% for s in (params.TEMPS|default('')|string).split(',') %}
        {% if s|trim != '' %}{% set _ = temps.append(s|trim|float) %}{% endif %}
    {% endfor %}
    {% for tool in tools %}
        {% set temp = temps[tool] if tool < temps|length and temps[tool] > 0 else fallback %}
        {% set extruder = printer["tool T%d" % tool].extruder %}
        {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
        {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
        { action_respond_info("nozzle clean T%d at %.0f C" % (tool, temp)) }
        _FF_FILAMENT_PREP TOOL={tool} TEMP={temp} ALLOW_PRINTING=1
        SAVE_GCODE_STATE NAME=_ff_clean
        M83
        G92 E0
        G1 E{ff.purge_length} F{speed}               ; app: G92 E0; G1 E50 F<speed>; M400
        M400
        M106 P1 S{(ff.purge_fan * 255)|int}          ; app: M106 P1 S153
        G1 E-{ff.purge_retract} F{speed}             ; app: G92 E0; G1 E-5 F<speed>; M400
        M400
        G92 E0
        RESTORE_GCODE_STATE NAME=_ff_clean
        _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp}      ; cold wipe at (266.5, 13.8), see ff-filament.cfg
        _FF_FILAMENT_FINISH RELEASE=1 HEAT_OFF=0     ; fans back, release (app: doReleaseExtruderMgr)
    {% endfor %}

[gcode_macro START_PRINT]
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set level = params.LEVEL|default(0)|int %}
    {% set nozzle = params.NOZZLE|default(220)|float %}
    {% set layer = params.LAYER|default(0)|float %}
    {% set clean = params.CLEAN|default(1)|int %}
    {% set soak = params.SOAK|default(0)|float %}
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' and s|trim|int not in tools %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% if tools|length == 0 and tool >= 0 %}{% set _ = tools.append(tool) %}{% endif %}
    {% set tool_list = tools|join(',') %}
    _FF_REQUIRE_CALIBRATION TOOL={tool}{% if tool_list %} TOOLS={tool_list}{% endif %}
    {% if tool_list %}
        _FF_REQUIRE_TOOLS TOOLS={tool_list}          ; app: E0165 before any motion
    {% endif %}
    G90
    M82
    BED_MESH_CLEAR
    M400
    G28
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600
    SET_IDLE_TIMEOUT TIMEOUT=1800000
    {% if bed > 0 %}
        M140 S{bed}                      ; app: heatManager(bed) -- heats during the clean
    {% endif %}
    {% if clean and tools|length > 0 %}
        {% set temps = params.TEMPS|default('')|string|trim %}
        _FF_NOZZLE_CLEAN TOOLS={tool_list}{% if temps %} TEMPS={temps}{% endif %} TEMP={nozzle}
        M106 P1 S0                       ; app @0x9f27a4
    {% endif %}
    {% if bed > 0 %}
        M190 S{bed}
        {% if soak > 0 %}
            G4 P{(soak * 1000)|int}      ; heat soak (app: keepBedTempPrint = 5 min
                                         ; from the bed reaching target; SOAK=<s>)
        {% endif %}
        G28 Z                            ; app re-homes Z after the heat soak
    {% endif %}
    {% if level %}
        SET_VELOCITY_LIMIT ACCEL=2000
        M106 P1 S0
        BED_MESH_CALIBRATE
        SET_VELOCITY_LIMIT ACCEL=20000
        G1 Z10 F1200
        BED_MESH_PROFILE LOAD=default    ; app: heatBedThenPrintEddy @0x9f7950
    {% else %}
        BED_MESH_PROFILE LOAD=MESH_DATA  ; app: heatBedThenPrintEddy @0x9f79e4
        G1 Z10 F1200                     ; clearance for the dock run: the raw
                                         ; eddy frame sits ~3.2 mm low, so
                                         ; nominal Z10 is ~6.8 mm physical
    {% endif %}
    {% if tool >= 0 %}
        M104 S{nozzle} T{tool}           ; app: heatManager(active tool, print temp) @0x9f3348
        T{tool}                          ; grab first tool (ff_toolchange)
        TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={layer} TOOL={tool}
    {% else %}
        TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={layer}
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT=864000      ; app value during print

# ---------------------------------------------------------------------------
# Common end-of-print block: the app's single exit sequence @0x7a25f0, run for
# BOTH cancel and normal completion.
# ---------------------------------------------------------------------------
[gcode_macro _FF_PRINT_END]
gcode:
    TURN_OFF_HEATERS                     ; hotends + bed + chamber
    M106 S0
    M106 P2 S0
    M106 P3 S0
    SET_VELOCITY_LIMIT ACCEL=5000
    G92 E0
    G1 E-1 F300
    G92 E0
    M400
    {% set z = printer.toolhead.position.z %}
    {% if 'z' in printer.toolhead.homed_axes %}
        G90
        {% if z < 100.0 %}
            G1 Z150 F1800                ; bed presentation drop (app: 150/200/256.8)
        {% elif z < 150.0 %}
            G1 Z200 F1800
        {% elif z < 256.8 %}
            G1 Z256.8 F1800
        {% endif %}
    {% endif %}
    G90
    M106 S0
    SET_FAN_M106P2 ADJUSTED=0 FACTOR=0
    SET_FAN_M106 ADJUSTED=0 FACTOR=0
    SET_PA_ADVANCE T0=99.0 T1=99.0 T2=99.0 T3=99.0 ENABLE=0
    MUTE_MODE_DISABLE
    M220 S100
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=20000
    M400
    G92 E0
    BED_MESH_CLEAR
    CLEAR_PAUSE
    M82
    ; Needs a known position. Reached from CANCEL_PRINT after an error the
    ; axes may be unhomed, and raising here would abort the rest of the
    ; cleanup. Skipping is safe: the G28 wrapper docks a mounted tool before
    ; homing Z on the next job.
    {% if 'xyz' in printer.toolhead.homed_axes %}
        TOOLCHANGE_PARK                  ; dock the mounted tool (no-op if none)
    {% endif %}
    SET_GCODE_OFFSET Z=0 MOVE=1
    M18
    SET_IDLE_TIMEOUT TIMEOUT=600

# Slicer machine end gcode: just call END_PRINT
[gcode_macro END_PRINT]
gcode:
    _FF_PRINT_END
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=mainsail VALUE=0

# Job-origin flag: 1 = started via Mainsail. Set by the SDCARD_PRINT_FILE
# wrapper in ff-toolchange.cfg (only Moonraker sends that command; the
# touchscreen starts prints via M23), cleared by END_PRINT/CANCEL_PRINT and
# by any klipper restart. The app sends CANCEL_PRINT itself when cancelling
# from the screen (@0x7a0b24) and then runs its OWN cleanup with motion --
# running _FF_PRINT_END (M18, TOOLCHANGE_PARK) on top of that would break
# it, so the override only adds our cleanup for Mainsail-started jobs.
# Residual corner case (accepted): a Mainsail print that ends abnormally
# WITHOUT a restart leaves the flag at 1 until the next Mainsail job or
# restart; cancelling a touchscreen print in that window would run our
# cleanup into the app's. If that ever bites, run RESTART or
# SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=mainsail VALUE=0 first.
[gcode_macro _FF_JOB]
variable_mainsail: 0
# Escape hatch for the calibration gate (START_PRINT and the Mainsail entry
# point both refuse on an uncalibrated machine). Only for deliberate tests:
#   SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=allow_uncalibrated VALUE=1
variable_allow_uncalibrated: 0
gcode:

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT
    {% if printer["gcode_macro _FF_JOB"].mainsail %}
        _FF_PRINT_END
        SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=mainsail VALUE=0
    {% endif %}

# ---------------------------------------------------------------------------
# PAUSE -- mirrors the app: save tool temps, SAVE via pause_resume, hotends
# OFF (bed/chamber stay on), park lift, long idle timeout.
# ---------------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_t0: 0.0
variable_t1: 0.0
variable_t2: 0.0
variable_t3: 0.0
gcode:
    {% if printer.pause_resume.is_paused %}
        { action_respond_info("already paused") }
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT=864000
        M400
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t0 VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t1 VALUE={printer.extruder1.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t2 VALUE={printer.extruder2.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t3 VALUE={printer.extruder3.target}
        BASE_PAUSE                       ; stops SD + saves position/state
        M104 S0 T0
        M104 S0 T1
        M104 S0 T2
        M104 S0 T3
        {% if 'z' in printer.toolhead.homed_axes %}
            {% set z = printer.toolhead.position.z %}
            {% set park = [z + 10.0, 256.0]|min %}
            G90
            G1 Z{park} F500              ; park lift (app formula unrecovered)
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# RESUME -- reheat what PAUSE turned off, wait for arrival, then let
# pause_resume restore position (recover_velocity 50) and continue.
# ---------------------------------------------------------------------------
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        { action_respond_info("not paused") }
    {% else %}
        {% set p = printer["gcode_macro PAUSE"] %}
        {% if p.t0 > 0 %} M104 S{p.t0} T0 {% endif %}
        {% if p.t1 > 0 %} M104 S{p.t1} T1 {% endif %}
        {% if p.t2 > 0 %} M104 S{p.t2} T2 {% endif %}
        {% if p.t3 > 0 %} M104 S{p.t3} T3 {% endif %}
        {% if p.t0 > 0 %} M109 S{p.t0} T0 {% endif %}
        {% if p.t1 > 0 %} M109 S{p.t1} T1 {% endif %}
        {% if p.t2 > 0 %} M109 S{p.t2} T2 {% endif %}
        {% if p.t3 > 0 %} M109 S{p.t3} T3 {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT=864000
        {% if printer.ff_toolchange.current_tool >= 0 %}
            FF_RUNOUT_ARM                ; app re-arms the clog sensor after
                                         ; every resume (@0x7a0854)
        {% endif %}
        BASE_RESUME
    {% endif %}
