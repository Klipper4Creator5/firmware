# ---------------------------------------------------------------------------
# ff-chamber.cfg -- chamber heater for Mainsail prints, off on the Creator 5
#
# The Creator 5 Pro has a chamber heater; the plain Creator 5 does not. The
# two models ship the SAME Klipper tree -- printer.base.cfg declares
# [heater_generic chamber_heater] (heater_pin PE13 / sensor_pin PC1, both on
# the main mcu) on both. The whole difference lives in firmwareExe: the Pro
# binary carries "SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=" in
# CommMgr::heatManager case 5 and the non-Pro binary does not. The non-Pro app
# still READS the chamber sensor and still runs the chamber fans -- it simply
# never commands the heater, so the target stays 0 forever.
#
# That is load-bearing, because FlashForge patched extras/verify_heater.py to
# HARDCODE its parameters (chamber_heater -> check_gain_time 900, max_error
# 100, heating_gain 5) and ignore the config. Overriding [verify_heater
# chamber_heater] in a drop-in therefore does nothing at all. What keeps a
# non-Pro safe is only that nothing ever sets a target: check_event() returns
# early while target <= 0. Set one on a machine with no heating element and
# ~15 min later (900 s gain window, then error 100 accrues in seconds) klippy
# calls invoke_shutdown("Heater chamber_heater not heating at expected rate")
# -- mid-print.
#
# Mainsail and HelixScreen expose every heater_generic as a settable heater,
# so on a non-Pro they hand the user that shutdown. This file closes it by
# gating the command instead of removing the section: the object has to stay
# declared because HelixScreen and Mainsail subscribe to
# "heater_generic chamber_heater" on both models.
#
# Whether this machine HAS the heater is not configured here or anywhere
# else: printer.chamber.cfg declares the heater on the Pro and only a
# temperature_sensor on the plain Creator 5, so these macros just ask Klipper
# whether the object exists. Nothing to keep in sync, and this file is
# byte-identical in every package.
#
# REQUIRED -- not an optional drop-in:
#     [include printer.base.cfg]
#     ...
#     [include ff-chamber.cfg]
# ---------------------------------------------------------------------------

[gcode_macro _FF_CHAMBER]
description: M141/M191 tunables
# M191 stops waiting this far below the target. The chamber is a slow, lossy
# volume; the app never waited on it tighter than a couple of degrees.
variable_wait_band: 2.0
gcode:
    {% if 'heater_generic chamber_heater' in printer %}
        { action_respond_info("chamber heater present") }
    {% else %}
        { action_respond_info("no chamber heater on this model") }
    {% endif %}

# ---------------------------------------------------------------------------
# SET_HEATER_TEMPERATURE -- stock command, chamber target gated by model.
# Everything that is not a non-zero chamber target passes straight through, so
# hotends, the bed and "chamber off" (TARGET=0) behave exactly as before.
# On a machine with no heater the object does not exist at all, so the real
# command would fail with "Unknown heater" -- which is correct for a typed
# command but wrong for a sliced file, where an M141 would abort the print.
# So a blocked call warns and continues instead of raising. PID_CALIBRATE and
# anything else that reaches past these macros still fails, as it should.
# ---------------------------------------------------------------------------
[gcode_macro SET_HEATER_TEMPERATURE]
description: Set a heater target (chamber ignored on models without the heater)
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default('')|lower %}
    {% set target = params.TARGET|default(0)|float %}
    {% if heater == 'chamber_heater' and target > 0
          and 'heater_generic chamber_heater' not in printer %}
        { action_respond_info(
            "no chamber heater on this model -- ignoring TARGET=%.1f" % target) }
    {% else %}
        SET_HEATER_TEMPERATURE_BASE {rawparams}
    {% endif %}

# ---------------------------------------------------------------------------
# M141 [S<temp>] -- set chamber temperature, do not wait.
# M191 [S<temp>] -- set chamber temperature and wait for it.
# Klipper has neither built in, and the stock app drove the chamber straight
# from its own UI, so nothing in the stock firmware ever accepted them from a
# sliced file. Both route through SET_HEATER_TEMPERATURE above and so inherit
# the model gate.
# ---------------------------------------------------------------------------
[gcode_macro M141]
description: Set chamber temperature (S=target, 0 = off)
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S|default(0)|float}

[gcode_macro M191]
description: Set chamber temperature and wait (S=target, 0 = off)
gcode:
    {% set target = params.S|default(0)|float %}
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
    {% if target > 0 and 'heater_generic chamber_heater' in printer %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - ff.wait_band|float}
    {% endif %}
