# ff-legacy.cfg -- migration from firmwareExe's JSON.
#
# Keep it included (klippy-extras/ff_legacy.py must be in
# /usr/prog/klipper/klippy/extras/). With auto_import (default) the stock
# firmware's nozzle/station/dock numbers are loaded at every startup for as
# long as no [ff_tool n] has a saved nozzle position, so a fresh install
# starts with the calibration firmwareExe already made and a setup wizard can
# skip it. SAVE_CONFIG (after a recalibration, or by hand) persists the
# values and ends the auto import. Manual form:
#
#   FF_IMPORT_FIRMWARE_CONFIG            ; reads /usr/data/firmwareRes/config
#   SAVE_CONFIG                          ; persists nozzle_*/station_*/z_adjust
#
# The command also prints an [ff_tool n] / [ff_toolchange] / [ff_tool_offset]
# snippet with dock coordinates, feeds and the station start point -- paste
# that into ff-toolchange.cfg / ff-tool-offset.cfg by hand; those options are
# deliberately not autosaved. Afterwards the include can be removed.

[ff_legacy]
#auto_import: True
#firmware_config_dir: /usr/data/firmwareRes/config
