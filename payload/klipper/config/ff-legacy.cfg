# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it, and your changes go with
# it -- silently, save for one line in the install log. Put them in printer.cfg
# instead: no flash ever writes that file.
#
# Overriding works because Klipper parses with RawConfigParser(strict=False):
# same-named sections MERGE, the LAST value of an option wins, and a redefined
# [gcode_macro] replaces the original. So restate only what you are changing,
# at the END of printer.cfg, after the includes:
#
#     [ff_toolchange]
#     fast_feed: 24000     ; every other option in the section stays as shipped
#
# Whatever you leave out keeps the value shipped here. That is the point: your
# printer.cfg carries your differences, not a fork of this file.
# ---------------------------------------------------------------------------
# ff-legacy.cfg -- migration from firmwareExe's JSON.
#
# Keep it included (payload/klipper/extras/ff_legacy.py must be in
# /usr/prog/klipper/klippy/extras/). With auto_import (default) the stock
# firmware's nozzle/station/dock numbers are loaded at startup for as long as
# no [ff_tool n] has a saved nozzle position, so a fresh install starts with
# the calibration firmwareExe already made and a setup wizard can skip it.
# With auto_save (also default) that first import is persisted on the spot:
# klipper runs SAVE_CONFIG itself and restarts once, right after the first
# boot's ready and before the screen is up, and neither runs again. Set
# auto_save off to keep the values live-but-unsaved until a SAVE_CONFIG of
# your own. Manual form:
#
#   FF_IMPORT_FIRMWARE_CONFIG            ; reads /usr/data/firmwareRes/config
#   SAVE_CONFIG                          ; persists nozzle_*/station_*/z_adjust
#
# dock_x/dock_y and the station start point are staged for SAVE_CONFIG along
# with the rest -- nothing has to be pasted anywhere by hand. The command also
# prints an [ff_toolchange] snippet (x_correction, temp_offset, fast_feed,
# slow_feed, release_slow_feed), but only when the JSON disagrees with the
# running value; on a stock unit it never does. Keep this file included: see
# auto_import above.

[ff_legacy]
#auto_import: True
#auto_save: True
#firmware_config_dir: /usr/data/firmwareRes/config
