# anvil-klipper -- the Klipper4FlashForge fork: the whole klippy tree, and
# c_helper.so cross-compiled from the chelper sources shipped beside it.
#
# ARCHITECTURE IS THE DEFAULT, mipsel_xburst2, and that is not a formality:
# c_helper.so is the only ELF in the tree and the kernel refuses anything that
# is not o32/nan2008/mips32r2. An `all` here would let this install on a
# machine whose kernel cannot exec the one file that matters.
PKG_NAME=anvil-klipper

# THE PIN IS A COMMIT, composed as pkgs/moonraker composes its own: the
# release this fork descends from, then the short sha. The fork carries no
# version of its own, so 0.13.0+git<sha> is what opkg can order and a bare
# 40-character sha is not.
PKG_VERSION="0.13.0+git$(printf '%.8s' "$KLIPPER_VERSION")"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# THE INTERPRETER IS A DEPENDS: etc/s6-rc/source/klipper/run execs $FF_PYTHON
# against $MODDIR/klipper/klippy, so klippy is on our CPython 3.13 and the
# tree it runs is the one THIS package installs.
#
# THE LIST IS scripts/klippy-requirements.txt MINUS WHAT IS NOT REACHABLE
# HERE. python-can is not packaged (no CAN transport on this machine) and it
# is import-guarded, so its absence costs nothing.
#
# NUMPY IS NOT IN THAT CLASS and this comment used to claim it was.
# extras/stepper_resonance_tester.py opens with a bare `import numpy as np`,
# and klippy.py:122 walks every config section through a load_object that does
# not catch ImportError -- so with printer.base.cfg including FlashForge's
# printer.vibration.cfg ([stepper_resonance_tester]), a numpy-less install is
# a klippy that never reaches ready. It is a Depends this package cannot yet
# declare because no anvil-python-numpy exists to name;
# docs/notes/44-vfa-calibration.md has the chain and what packaging it takes.
#
# markupsafe and setuptools are not named
# because anvil-python-jinja2 declares the first and nothing needs the second.
#
# WHAT THIS FIXES: cffi and greenlet were installed by a hardcoded list in
# bin/payload.sh, so every build had them and no `opkg install anvil-klipper`
# did. pyserial and jinja2 were worse -- they arrived only as
# anvil-moonraker's Depends, so a BUILD_MOONRAKER=0 build shipped a klippy
# that imports serialhdl and dies the first time it opens an MCU.
#
# anvil-klipper-config is not optional either: printer.base.cfg is what
# printer.cfg includes and every other config hangs off it.
PKG_DEPENDS="anvil-klipper-config, anvil-python, anvil-python-cffi,
             anvil-python-greenlet, anvil-python-pyserial,
             anvil-python-jinja2"
PKG_BUILD_DEPENDS=""

# NO PKG_WHEN. The fork is the only Klipper, and nothing here is optional --
# the toolchanger extras this package carries and the ff-*.cfg that declare
# them are written against v0.13.

# KLIPPER_VERSION says nothing about payload/, which is five toolchanger
# extras -- so without this an edit to ff_toolchange.py reads as "already
# current" and the printer gets the previous release's.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_DESCRIPTION="The Klipper4FlashForge fork of Klipper (v0.13 generation), with c_helper.so cross-compiled from the chelper sources it ships with."
