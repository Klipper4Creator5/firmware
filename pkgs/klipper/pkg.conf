# anvil-klipper -- the Klipper4FlashForge fork: the whole klippy tree, and
# c_helper.so cross-compiled from the chelper sources shipped beside it.
#
# THE LAST CROSS-BUILD THAT LIVED IN bin/patch.sh. Section 1 unpacked this
# tarball, unpacked the Ingenic toolchain into work/.mips-toolchain, wrote its
# own gcc line and stamped a cache directory only it and bin/fetch-assets.sh
# knew the shape of -- every one of the things pkgs/lib.sh exists to do once.
# docs/notes/85-packaging.md phase 1 named Klipper as the one recipe still
# missing; this is it.
#
# ARCHITECTURE IS THE DEFAULT, mipsel_xburst2, and that is not a formality:
# c_helper.so is the only ELF in the tree and the kernel refuses anything that
# is not o32/nan2008/mips32r2. An `all` here would let this install on a
# machine whose kernel cannot exec the one file that matters.
PKG_NAME=anvil-klipper

# THE PIN IS A COMMIT, composed the way pkgs/moonraker composes its own: the
# release this fork descends from, then the short sha. The fork carries no
# version of its own -- it tracks upstream v0.13 -- so 0.13.0+git<sha> is what
# opkg can actually order, and a bare 40-character sha is not.
PKG_VERSION="0.13.0+git$(printf '%.8s' "$KLIPPER_VERSION")"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# THE INTERPRETER IS A DEPENDS NOW. This block used to say the opposite --
# "the reason is where klippy runs rather than what it imports", the stock
# klipperDaemon starting klippy under FlashForge's 3.8.2 while bin/patch.sh
# copied the tree into the software component -- and it named phase 7 of
# docs/notes/80-s6-migration.md as the change that would make it false. That
# change has happened: etc/s6-rc/source/klipper/run execs $FF_PYTHON against
# $MODDIR/klipper/klippy, so klippy is on our CPython 3.13 and the tree it
# runs is the one THIS package installs.
#
# THE LIST IS scripts/klippy-requirements.txt MINUS WHAT IS NOT REACHABLE
# HERE. python-can is not packaged (no CAN transport on this machine) and
# numpy is not either, which costs extras/stepper_resonance_tester.py and
# nothing else -- both are import-guarded by the modules that want them.
# markupsafe and setuptools are not named because anvil-python-jinja2 declares
# the first and nothing here needs the second at import.
#
# WHAT THIS FIXES, and it is not bookkeeping. cffi and greenlet were installed
# by a hardcoded list in bin/patch.sh, so every build had them and no `opkg
# install anvil-klipper` did. pyserial and jinja2 were worse: they arrived
# only as anvil-moonraker's Depends, so a BUILD_MOONRAKER=0 build shipped a
# klippy that imports serialhdl and dies the first time it opens an MCU.
#
# anvil-klipper-config is not optional either: printer.base.cfg is the file
# printer.cfg includes and every other config hangs off it, so a klippy tree
# without it is a Klipper that cannot start. Naming any of these in
# bin/patch.sh's MOD_ROOTS instead would answer the dependency in the one
# place a printer's own `opkg install anvil-klipper` never reads.
PKG_DEPENDS="anvil-klipper-config, anvil-python, anvil-python-cffi,
             anvil-python-greenlet, anvil-python-pyserial,
             anvil-python-jinja2"
PKG_BUILD_DEPENDS=""

# NO PKG_WHEN. The fork is the only Klipper, and nothing here is optional --
# the toolchanger extras this package carries and the ff-*.cfg that declare
# them are written against v0.13.

# KLIPPER_VERSION says nothing about payload/, and payload/ is now five
# toolchanger extras -- so without this an edit to ff_toolchange.py reads as
# "already current" and the printer gets the previous release's.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_DESCRIPTION="The Klipper4FlashForge fork of Klipper (v0.13 generation), with c_helper.so cross-compiled from the chelper sources it ships with."
