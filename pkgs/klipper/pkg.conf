# anvil-klipper -- the Klipper4FlashForge fork: the whole klippy tree, and
# c_helper.so cross-compiled from the chelper sources shipped beside it.
#
# THE LAST CROSS-BUILD THAT LIVED IN bin/patch.sh. Section 1 unpacked this
# tarball, unpacked the Ingenic toolchain into work/.mips-toolchain, wrote its
# own gcc line and stamped a cache directory only it and bin/fetch-assets.sh
# knew the shape of -- every one of the things pkgs/lib.sh exists to do once.
# docs/notes/85-packaging.md phase 1 named Klipper as the one recipe still
# missing; this is it.
#
# ARCHITECTURE IS THE DEFAULT, mipsel_xburst2, and that is not a formality:
# c_helper.so is the only ELF in the tree and the kernel refuses anything that
# is not o32/nan2008/mips32r2. An `all` here would let this install on a
# machine whose kernel cannot exec the one file that matters.
PKG_NAME=anvil-klipper

# THE PIN IS A COMMIT, composed the way pkgs/moonraker composes its own: the
# release this fork descends from, then the short sha. The fork carries no
# version of its own -- it tracks upstream v0.13 -- so 0.13.0+git<sha> is what
# opkg can actually order, and a bare 40-character sha is not.
PKG_VERSION="0.13.0+git$(printf '%.8s' "$KLIPPER_VERSION")"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# NO DEPENDS, and the reason is where klippy runs rather than what it imports.
# Today the stock /usr/prog/klipper/klipperDaemon starts klippy under
# FlashForge's own interpreter -- bin/patch.sh copies this tree into the
# SOFTWARE component, not into $MODDIR -- so naming anvil-python here would
# declare a dependency the running system does not have. The interpreter
# becomes a real Depends when phase 7 of docs/notes/80-s6-migration.md moves
# Klipper under $MODDIR and this mod starts klippy itself. Until then the
# package is honest about being a tree of files.
# anvil-klipper-config, though, is not optional in that way: printer.base.cfg
# is the file printer.cfg includes and every other config hangs off it, so a
# klippy tree without it is a Klipper that cannot start. It used to arrive
# because the per-model chamber package depended on it; those are gone, and
# naming it in bin/patch.sh's MOD_ROOTS instead would be answering a missing
# dependency in the one place a printer's own `opkg install anvil-klipper`
# never reads.
PKG_DEPENDS="anvil-klipper-config"
PKG_BUILD_DEPENDS=""

# NO PKG_WHEN. This recipe used to be gated on BUILD_KLIPPER=fork; that flag
# is gone and the fork is the only Klipper. Nothing else here is optional
# either -- the toolchanger extras this package carries and the ff-*.cfg that
# declare them are written against v0.13.

# KLIPPER_VERSION says nothing about payload/, and payload/ is now five
# toolchanger extras -- so without this an edit to ff_toolchange.py reads as
# "already current" and the printer gets the previous release's.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_DESCRIPTION="The Klipper4FlashForge fork of Klipper (v0.13 generation), with c_helper.so cross-compiled from the chelper sources it ships with."
