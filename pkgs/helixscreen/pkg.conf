# anvil-helixscreen -- the touchscreen UI.
#
# THE ONE ASSET PACKAGE WITH A BINARY IN IT. Mainsail and Moonraker are
# Architecture: all because nothing in them is compiled; this tarball is a
# prebuilt mipsel program and its libraries, so it carries the real
# architecture and is gated like anything else that executes on the printer.
# That gate is qa/replica/test_abi.py, which reads the ELF objects off the
# installed filesystem -- neither this recipe nor any build.sh checks them.
PKG_NAME=anvil-helixscreen

# HELIX_VERSION is "v0.99.115-creator5.2": a tag with an upstream version and
# a platform revision joined by a hyphen. The 'v' comes off as it does for
# Mainsail. The hyphen becomes a dot because opkg reads the LAST hyphen in a
# version field as the separator before the packaging revision -- which
# happens to parse correctly today and would stop the first time the tag
# gained another hyphen.
PKG_VERSION="$(printf '%s' "${HELIX_VERSION#v}" | tr '-' '.')"
PKG_RELEASE=1
PKG_SECTION=ui

PKG_EXCLUDE=".version"

PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_WHEN='[ "${BUILD_HELIX:-1}" = "1" ]'

# The printer-database entry this recipe stages over upstream's tree is not
# described by HELIX_VERSION, so it needs a cache key of its own. It did not
# have one: the file used to be hashed into anvil-core's PKG_STAMP_EXTRA, the
# package that does NOT contain it, so editing the json rebuilt the wrong
# recipe and left this one cached.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_DESCRIPTION="HelixScreen, the touchscreen UI, as published by upstream for the Creator 5. Includes this repo's printer-database entry so the printer is detected as a tool changer."
