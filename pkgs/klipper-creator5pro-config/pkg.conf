# anvil-klipper-creator5pro-config -- printer.chamber.cfg for Creator 5 Pro.
#
# ONE FILE, ONE MODEL, AND THE MODEL IS THE PACKAGE NAME. Anything that
# differs between the two machines exists once per machine and is installed
# under its real name; nothing is edited or templated, because the file IS the
# difference. Klipper can override an option but cannot un-declare a section,
# so the Creator 5 Pro, which has a chamber heater
# has to have its heater ABSENT rather than neutralised -- which is why this
# is two files and not one file with a flag.
#
# WHY A PACKAGE PER MODEL RATHER THAN A BUILD FLAG. The suffixed variants used
# to be picked by bin/patch.sh from TARGET_MACHINE and copied under their real
# name, which made the model a property of the BUILD: two builds of one commit
# produced different bytes under one version number, and nothing on the
# printer or in the feed recorded which machine a package was for. As two
# packages the model is a name you install, both are always built, and the
# feed carries both.
#
# PROVIDES AND CONFLICTS, AND WHY BOTH. printer.base.cfg has a bare
# [include printer.chamber.cfg] with no condition attached, so klippy does not
# start at all without exactly one of these. Provides on a virtual name lets
# anvil-klipper-config depend on "a chamber config" and be satisfied by
# either; Conflicts on the same name is what stops a printer installing both,
# which would be two packages owning one path and opkg letting whichever
# unpacked last win, silently. Neither field alone expresses "exactly one".
PKG_NAME=anvil-klipper-creator5pro-config
PKG_ARCH=all

PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# THIS IS THE PACKAGE A PERSON INSTALLS, and it pulls the shared half in:
# `opkg install anvil-klipper-creator5pro-config` and the toolchanger's config is
# on the machine. The dependency runs this way and not the other because the
# MODEL is the one fact opkg cannot work out for itself -- see the note in
# pkgs/klipper-config/pkg.conf about what resolving it by Provides would pick.
PKG_DEPENDS="anvil-klipper-config"
PKG_BUILD_DEPENDS=""
PKG_PROVIDES="anvil-klipper-chamber-config"
PKG_CONFLICTS="anvil-klipper-chamber-config"

# Gated with the toolchanger, not with the model. BOTH are built on every
# build whatever TARGET_MACHINE says -- that is the point of them being
# packages -- and bin/patch.sh stages the one this tarball is for.
PKG_WHEN='[ "${BUILD_TOOLCHANGE:-1}" = "1" ]'

PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_DESCRIPTION="Chamber sensor and heater declarations for Creator 5 Pro. Exactly one chamber config is installed; printer.base.cfg includes it unconditionally and klippy will not start without it."
