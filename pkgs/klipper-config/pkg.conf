# anvil-klipper-config -- the toolchanger's Klipper config: the ff-*.cfg
# includes, and printer.base.cfg which includes them.
#
# THESE WERE anvil-core's AND SHOULD NEVER HAVE BEEN. They are Klipper config
# and mean nothing to a machine that is not running Klipper; anvil-core is
# what makes the machine ours, and it had these only because it was the first
# recipe written.
#
# NOT PART OF pkgs/klipper, and the reason is the gate rather than the
# subject: these are BUILD_TOOLCHANGE's, while pkgs/klipper carries the
# program that implements these sections and is not optional at all. Config a
# printer's owner overrides from printer.cfg and code that ships whatever they
# choose are two different lifetimes.
#
# ARCHITECTURE all: Klipper .cfg, not one byte of native code.
PKG_NAME=anvil-klipper-config
PKG_ARCH=all

# The release's version, as anvil-core's is and for the same reason: these
# files have no upstream. PKG_STAMP_EXTRA is what actually notices an edit.
PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# NO DEPENDS, AND THE DIRECTION IS THE POINT. ff-chamber.cfg drives a chamber
# heater this package does not declare, so depending on the virtual name both
# model packages provide looks right -- and puts the arrow the wrong way
# round: opkg would resolve it by picking whichever provider it found first,
# a coin flip between two files that describe DIFFERENT HARDWARE.
#
# The model is not a detail to be resolved, it is the thing the installer
# knows and opkg does not. So the model package is what you install, and it
# depends on this one. Nothing sensible installs this package by name.
#
# The one Depends does not contradict that: the argument above is against a
# VIRTUAL name with two providers. anvil-timelapse is one concrete package, and
# printer.base.cfg's [include timelapse.cfg] is its file -- Klipper refuses to
# start on an include it cannot find.
PKG_DEPENDS="anvil-timelapse"
PKG_BUILD_DEPENDS=""

# The flag that turns the toolchanger off. With these files in anvil-core it
# did NOT gate the .cfg, so BUILD_TOOLCHANGE=0 shipped the config of a
# disabled feature -- harmless, and exactly the kind of flag that reads as
# working until somebody relies on it.
PKG_WHEN='[ "${BUILD_TOOLCHANGE:-1}" = "1" ]'

PKG_STAMP_EXTRA="$(pkg_payload_hash)"

# PRINTER.BASE.CFG IS THIS RECIPE'S TOO, and sits in prog/ because it lands on
# /usr/prog rather than under the prefix. It was in pkgs/klipper, which was
# wrong twice over: it is Klipper CONFIG rather than part of the Klipper
# program -- it carries the [include] lines and is the entry point to
# everything else here -- and it is installed under BUILD_TOOLCHANGE, which
# pkgs/klipper does not answer to.
PKG_DESCRIPTION="The toolchanger's Klipper config: printer.base.cfg and the includes it pulls in -- toolchange, tool offsets, filament handling, runout recovery, chamber macros and the legacy compatibility layer. The includes install to \$MODDIR/config and the installer copies them to /usr/data/config, where printer.base.cfg's relative includes resolve."
