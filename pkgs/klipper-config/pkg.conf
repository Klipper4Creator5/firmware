# anvil-klipper-config -- the toolchanger's Klipper config: the ff-*.cfg
# includes, and printer.base.cfg which includes them.
#
# THESE WERE anvil-core's AND SHOULD NEVER HAVE BEEN. They are Klipper config:
# they declare the toolchange macros, the tool offsets, the filament sensors
# and the runout handling, and they mean nothing to a machine that is not
# running Klipper. anvil-core is what makes the machine ours -- the boot
# script, the service library, the init scripts -- and it had these only
# because it was the first recipe and everything of ours started there.
#
# NOT PART OF pkgs/klipper, WHICH IS THE INTERESTING PART. That recipe is
# gated on BUILD_KLIPPER=fork: ask for BUILD_KLIPPER=stock and it does not
# exist, and nor would its files. But a stock-Klipper build still wants the
# toolchanger -- FlashForge's own klippy loads ff_*.py and reads these .cfg
# perfectly well -- so folding them into that recipe would have made the
# toolchanger a silent casualty of a flag about which klippy is shipped.
# They travel with the feature they configure, and the feature's flag is
# BUILD_TOOLCHANGE.
#
# ARCHITECTURE all: Klipper .cfg, not one byte of native code.
PKG_NAME=anvil-klipper-config
PKG_ARCH=all

# The release's version, as anvil-core's is, and for the same reason: these
# files have no upstream, so the only monotone number available is the one
# bin/pack.sh already stamps on the tarball. PKG_STAMP_EXTRA is what actually
# notices an edit.
PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# ff-chamber.cfg drives a chamber heater and reads a chamber sensor, and
# neither is declared here -- printer.chamber.cfg declares them, and which
# one you get depends on the model. So this depends on the VIRTUAL name both
# model packages provide, and either satisfies it. See
# pkgs/klipper-creator5-config/pkg.conf for why they also conflict.
PKG_DEPENDS="anvil-klipper-chamber-config"
PKG_BUILD_DEPENDS=""

# The flag that turns the toolchanger off. It gates bin/patch.sh's install of
# ff_*.py and our printer.base.cfg already; with these files in anvil-core it
# did NOT gate the .cfg, so BUILD_TOOLCHANGE=0 shipped the config of a
# disabled feature -- harmless, and exactly the kind of flag that reads as
# working until somebody relies on it.
PKG_WHEN='[ "${BUILD_TOOLCHANGE:-1}" = "1" ]'

PKG_STAMP_EXTRA="$(pkg_payload_hash)"

# PRINTER.BASE.CFG IS THIS RECIPE'S TOO, and it sits in prog/ because it
# lands on /usr/prog beside FlashForge's Klipper tree rather than under the
# prefix. It was in pkgs/klipper until now, which was wrong twice over: it is
# Klipper CONFIG rather than any part of the Klipper program -- it is the file
# that carries [include ff-toolchange.cfg] and [include printer.chamber.cfg],
# so it is the entry point to everything else here -- and pkgs/klipper is
# gated on BUILD_KLIPPER while this file is installed under BUILD_TOOLCHANGE.
# A BUILD_KLIPPER=stock build has no pkgs/klipper recipe at all, and was still
# copying a file out of its prog/ directory.
PKG_DESCRIPTION="The toolchanger's Klipper config: printer.base.cfg and the includes it pulls in -- toolchange, tool offsets, filament handling, runout recovery, chamber macros and the legacy compatibility layer. The includes install to \$MODDIR/config and the installer copies them to /usr/data/config, where printer.base.cfg's relative includes resolve."
