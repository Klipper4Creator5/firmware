# By using these files I affirm my respect for Ukraine's sovereignty and
# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-filament.cfg -- LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE for the
# Creator 5 Pro under Mainsail / HelixScreen. Port of the touchscreen app's
# FilamentLoad page, recovered from MIPS machine code:
# docs/notes/47-filament-load-recovered.md.
#
# Facts that shape these macros:
#   * Each tool has its own direct-drive extruder; "loading" is that tool's
#     own `G1 E...` after it has been grabbed. The [manual_stepper
#     gear_stepper] is the tool LOCK motor, not a feeder.
#   * The app grabs the tool, drives it to the purge chute (X275 Y254), heats
#     to material temp + 30, waits for |actual - target| <= 3, chamber fans
#     off, pushes 150 + 145 mm at F240, restores the fans, parks and sets the
#     heater to 0.
#   * The app's "unload" is THE SAME forward push -- the stock firmware has no
#     retract-unload at all. UNLOAD_FILAMENT below is therefore designed, not
#     ported: renew the melt, then pull out in two stages.
#   * No M109, no filament-sensor arming, no sensor check after the feed.
#
# Deliberate divergences:
#   * Purge height: the app probes the eddy at (265, 4.8) and lifts to
#     probeZ + 8; we go straight to `purge_z` (default 8) and skip the probe.
#     Z is only ever raised, never lowered, before the XY travel.
#   * Temperature comes from TEMP= (HelixScreen pre-fills it); the app's
#     per-material table is reproduced in `temps` for MATERIAL=PLA calls.
#   * While a print is PAUSED the macros act on the mounted tool only, do not
#     touch Z, do not park the tool and do not turn the heater off.
#   * TEMPERATURE_WAIT replaces the app's 1 s polling loop.
#
# REQUIRED, not an optional drop-in. printer.base.cfg already ships
# [include ff-filament.cfg]; do NOT add it to printer.cfg yourself.
#
# HelixScreen: assign LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE in Settings ->
# Macro Buttons. Its default Load/Unload buttons only mount/unmount the tool;
# a user-assigned macro outranks that.
# ---------------------------------------------------------------------------

[gcode_macro _FF_FILAMENT]
description: Tunables for LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE
# Purge chute position (app: moveLoadLocation, 275/254 @db6b2c/@db6b28) and
# the per-tool XY nudge the app applies by now_extruder (0:(0,0) 1:(-2,0)
# 2:(-2,1.5) 3:(-2,-8)).
variable_purge_x: 275.0
variable_purge_y: 254.0
variable_purge_z: 8.0
variable_tool_dx: [0.0, -2.0, -2.0, -2.0]
variable_tool_dy: [0.0, 0.0, 1.5, -8.0]
variable_travel_x_feed: 12000
variable_travel_y_feed: 24000
variable_approach_feed: 2400
# Feed: app pushes load_length_1 then load_length_2 (150 + 145 = 295 mm),
# F240, or F80 when the tool's nozzle is 0.25 mm.
variable_load_length_1: 150.0
variable_load_length_2: 145.0
variable_load_feed: 240
variable_load_feed_thin: 80
variable_load_boost: 30.0
# In-print (paused) load: app's LoadFilamentPrint pushes 100 then retracts 5.
variable_print_load_length: 100.0
variable_print_retract: 5.0
# Unload (designed, see header): renew the melt, quick pull out of the melt
# zone, then the rest at feed speed. unload_length must clear the drive gears
# and the fd_ex<n> switch above them; 80 mm is a conservative first guess for
# this compact direct drive -- shorten once measured.
variable_unload_prime: 10.0
variable_unload_fast: 20.0
variable_unload_fast_feed: 1200
variable_unload_length: 80.0
variable_unload_feed: 600
# Purge (app: clearNozzlePrint): E50 then E-5 with the part fan at 60 %.
variable_purge_length: 50.0
variable_purge_retract: 5.0
variable_purge_fan: 0.6
# Chamber fan around the feed (app: changeFilamentControlFan). The app also
# blacked out chamber_heat_fan here and restored it to 0.9; that fan is now a
# [heater_fan] tied to chamber_heater (see printer.chamber.cfg), so it is not
# settable and is deliberately left running -- a filament change over a hot
# element is the last moment to stop ventilating it. Only the draught that
# reaches the purge chute is worth silencing, and that is chamber_fan and this.
variable_chamber_loop_fan: 0.3
# Pre-print nozzle clean (app: clearNozzlePrint, used by START_PRINT via
# _FF_NOZZLE_CLEAN). After the purge the app parks at (266.5, 13.8), 1 mm
# above the probe Z it measured -- purge_z - 7 in this file's frame -- and
# cools the hotend by 100 C there before lifting, leaving the frozen ooze
# behind. clean_cool_delta 0 skips the cool-down wait.
variable_clean_wipe_x: 266.5
variable_clean_wipe_y: 13.8
variable_clean_wipe_z: 1.0        ; RAW eddy frame (app: probeZ + 1), see _FF_NOZZLE_WIPE
variable_clean_wipe_feed: 6000
variable_clean_wipe_z_feed: 600
variable_clean_cool_delta: 100.0
# App's g_mapFilamentTempDefault (.rodata 0xd61d44); 'custom' -> 220.
variable_temps: {'PLA': 220, 'PETG': 240, 'PLA-CF': 220, 'PETG-CF': 240,
                 'ABS': 250, 'ASA': 250, 'SILK': 220, 'PET-CF': 270,
                 'PAHT-CF': 280, 'S-PAHT': 280, 'S-MULTI': 270, 'PA-CF': 270,
                 'HIPS': 250, 'PVA': 220, 'TPU-90A': 220, 'TPU-95A': 220,
                 'TPU-64D': 220, 'PC': 260, 'PA': 260, 'PC-ABS': 260,
                 'PPS-CF': 290, 'CUSTOM': 220}
variable_default_temp: 220
# What is loaded in each tool.  The app kept the same thing per slot and looked
# the operation temperature up in the table above (getFilamentOperationTemp);
# nothing in the G-code file tells us, so it is configured here.  Used by the
# nozzle clean when START_PRINT is not given an explicit TEMPS=.
variable_tool_material: ['PLA', 'PLA', 'PLA', 'PLA']
# State shared between the helpers of one operation.
variable_tool: -1
variable_in_print: 0
variable_saved_chamber_fan: 0.0
# Never called: this holds the tunables and the shared state above, nothing
# more. The commands themselves carry the description: line Mainsail shows.
gcode:

# Internal: resolve TOOL / temperature, refuse in the wrong state, heat, mount
# the tool, travel to the purge chute, wait for temperature, chamber fans off.
# Leaves the extruder of TOOL active at the chute, ready for G1 E.
[gcode_macro _FF_FILAMENT_PREP]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tc = printer.ff_toolchange %}
    {% set temp = params.TEMP|float %}
    {% set tool = params.TOOL|int %}
    {% set state = printer.print_stats.state %}
    {% set paused = printer.pause_resume.is_paused %}
    # ALLOW_PRINTING=1: called from START_PRINT, where print_stats already
    # says 'printing' although the job has not moved yet. (Plain # lines:
    # Klipper strips '#'/';' to end of line BEFORE Jinja, so a {# #} comment
    # would reach the template as a broken '{' print statement.)
    {% set allow_printing = params.ALLOW_PRINTING|default(0)|int %}
    {% if state == 'printing' and not paused and not allow_printing %}
        { action_raise_error("Refusing: a print is running (pause it first)") }
    {% endif %}
    {% if paused %}
        {% if tool < 0 %}{% set tool = tc.current_tool %}{% endif %}
        {% if tool != tc.current_tool %}
            { action_raise_error("Print is paused with T%s mounted; filament operations on another tool would resume with the wrong tool" % tc.current_tool) }
        {% endif %}
    {% elif tool < 0 %}
        {% set tool = tc.current_tool %}
    {% endif %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("TOOL=0..3 required (no tool mounted to default to)") }
    {% endif %}
    {% if not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% set extruder = printer["tool T%d" % tool].extruder %}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=in_print VALUE={1 if paused else 0}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=saved_chamber_fan VALUE={printer["fan_generic chamber_fan"].speed}
    M104 S{temp} T{tool}                 ; app: heatManager first, heat while travelling
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28                              ; app: homeManager(1,1,1) when not homed
    {% endif %}
    G90
    {% if not paused %}
        ; app's line. It clears a GLOBAL X/Y offset; the per-tool frame
        ; is the grab's to set, not this line's.
        SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600
        M400
    {% endif %}
    {% if tool != tc.current_tool %}
        SELECT_TOOL T={tool}             ; grab: applies this tool's offsets, activates its extruder
        M400
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
    {% endif %}
    {% if not paused and printer.toolhead.position.z < ff.purge_z %}
        G1 Z{ff.purge_z} F3000           ; app: G1 Z<probeZ+8> F3000 (raised before XY here)
    {% endif %}
    G1 X{ff.purge_x - 25} F{ff.travel_x_feed}           ; app: G1 X250
    G1 Y{ff.purge_y + ff.tool_dy[tool]} F{ff.travel_y_feed}
    G1 X{ff.purge_x + ff.tool_dx[tool]} F{ff.approach_feed}
    M400
    TEMPERATURE_WAIT SENSOR={extruder} MINIMUM={temp - 3} MAXIMUM={temp + 3}   ; app: |cur-target| <= 3
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    {% if 'heater_generic chamber_heater' in printer
          and printer["heater_generic chamber_heater"].target > 0 %}
        SET_FAN_SPEED FAN=chamber_loop_fan SPEED=0
    {% endif %}

# ---------------------------------------------------------------------------
# Internal: restore fans, park the tool (unless paused), heater off.
# ---------------------------------------------------------------------------
[gcode_macro _FF_FILAMENT_FINISH]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = ff.tool %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    M400
    SET_FAN_SPEED FAN=chamber_fan SPEED={ff.saved_chamber_fan}
    {% if 'heater_generic chamber_heater' in printer
          and printer["heater_generic chamber_heater"].target > 0 %}
        SET_FAN_SPEED FAN=chamber_loop_fan SPEED={ff.chamber_loop_fan}
    {% endif %}
    {% if not ff.in_print %}
        {% if release %}
            UNSELECT_TOOL                ; app: doReleaseExtruderMgr
        {% endif %}
        {% if heat_off %}
            M104 S0 T{tool}              ; app: heatManager(tool, 0) on exit
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=in_print VALUE=0

# LOAD_FILAMENT TOOL=<0..3> [TEMP=<material temp>] [MATERIAL=PLA] [BOOST=30]
#               [LENGTH=<mm>] [SPEED=<mm/min>] [RELEASE=1] [HEAT_OFF=1]
# Feeds the spool of TOOL into its hotend at the purge chute, heating to
# TEMP + BOOST as the app does. While a print is paused: mounted tool only,
# in-print lengths (100 then -5), tool stays mounted.
[gcode_macro LOAD_FILAMENT]
description: Load filament into a tool's hotend (app FilamentLoad sequence)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set material = params.MATERIAL|default('')|upper %}
    {% set base = ff.temps[material] if material in ff.temps else ff.default_temp %}
    {% set temp = params.TEMP|default(base)|float %}
    {% set boost = params.BOOST|default(ff.load_boost)|float %}
    {% set length = params.LENGTH|default(ff.load_length_1 + ff.load_length_2)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set t = printer.ff_toolchange.current_tool if tool < 0 else tool %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp + boost}
    {% set nozzle = printer.configfile.settings[printer["tool T%d" % t].extruder].nozzle_diameter|float if t >= 0 else 0.4 %}
    {% set speed = params.SPEED|default(ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed)|int %}
    SAVE_GCODE_STATE NAME=_ff_filament
    M82
    G92 E0
    {% if printer.pause_resume.is_paused %}
        G1 E{ff.print_load_length} F{speed}     ; app LoadFilamentPrint: G1 E100
        M400
        G92 E0
        G1 E-{ff.print_retract} F{speed}        ; G1 E-5
        M400
    {% else %}
        {% set first = [length, ff.load_length_1]|min %}
        G1 E{first} F{speed}                     ; app: G1 E150 F240
        M400
        {% if length > first %}
            G1 E{length} F{speed}                ; app: G1 E145 (absolute E, G92 not repeated)
            M400
        {% endif %}
    {% endif %}
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}

# UNLOAD_FILAMENT TOOL=<0..3> [TEMP=<material temp>] [MATERIAL=PLA]
#                 [LENGTH=<mm>] [RELEASE=1] [HEAT_OFF=1]
# DESIGNED, no stock equivalent: heat to TEMP, renew the melt with a short
# push, pull `unload_fast` mm quickly out of the melt zone, then the remainder
# of LENGTH at `unload_feed`. Cut at the spool side first if it is tensioned.
[gcode_macro UNLOAD_FILAMENT]
description: Retract filament out of a tool's extruder (designed; stock app only pushes forward)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set material = params.MATERIAL|default('')|upper %}
    {% set base = ff.temps[material] if material in ff.temps else ff.default_temp %}
    {% set temp = params.TEMP|default(base)|float %}
    {% set length = params.LENGTH|default(ff.unload_length)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}
    SAVE_GCODE_STATE NAME=_ff_filament
    M83
    G92 E0
    G1 E{ff.unload_prime} F{ff.load_feed}           ; renew the melt so the tip pulls clean
    M400
    {% set fast = [ff.unload_fast, length]|min %}
    G1 E-{fast} F{ff.unload_fast_feed}               ; out of the melt zone before it freezes
    {% if length > fast %}
        G1 E-{length - fast} F{ff.unload_feed}
    {% endif %}
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}

# PURGE [TOOL=<0..3>] [PURGE_TEMP=<temp>] [LENGTH=50] [WIPE=1] [RELEASE=1]
#       [HEAT_OFF=1]
# Port of the app's clearNozzlePrint purge at the chute: E<LENGTH>, part fan
# 60%, E-5. Defaults to the mounted tool. WIPE=1 (default) also runs the cold
# wipe below; WIPE=0 stops at the purge.
# ---------------------------------------------------------------------------
# The app's post-purge wipe: park on the front-right wipe spot 1 mm above the
# EDDY trigger height there, cool by clean_cool_delta with the part fan still
# at purge_fan, lift. The ooze string freezes to the spot and tears off.
#
# The app's Z is raw-frame, but a mounted tool puts TWO layers between a
# G-code Z and the machine, so every one of them comes off to land on the same
# physical height: the operator's homing_origin.z, the tool's own frame, and
# the job term the frame also carries. Subtracting only the first parks the
# nozzle ~3.2 mm high and the wipe silently stops touching the spot.
[gcode_macro _FF_NOZZLE_WIPE]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|int %}
    {% set temp = params.TEMP|float %}
    {% set extruder = printer["tool T%d" % tool].extruder %}
    {% set wipe_z = ff.clean_wipe_z - printer.gcode_move.homing_origin.z
                    - printer["tool T%d" % tool].gcode_z_offset
                    - printer.toolchanger.print_z_offset %}
    G90
    G1 X{ff.purge_x - 25} F{ff.clean_wipe_feed}      ; app: G1 X250 F6000
    G1 Y{ff.clean_wipe_y} F{ff.travel_y_feed}        ; app: G1 Y13.8 F24000
    G1 X{ff.clean_wipe_x} F{ff.clean_wipe_feed}      ; app: G1 X266.5 F6000
    G1 Z{wipe_z} F{ff.clean_wipe_z_feed}             ; app: G1 Z<probeZ+1> F600
    M400
    {% if ff.clean_cool_delta > 0 and temp - ff.clean_cool_delta > 0 %}
        M104 S{temp - ff.clean_cool_delta} T{tool}   ; app: heatManager(tool, temp-100)
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={temp - ff.clean_cool_delta + 3}
    {% endif %}
    M106 P1 S0
    G1 Z10 F1200                                     ; app: G1 Z10 F1200
    M400

[gcode_macro PURGE]
description: Purge at the chute (app clearNozzlePrint sequence)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set temp = params.PURGE_TEMP|default(ff.default_temp)|float %}
    {% set length = params.LENGTH|default(ff.purge_length)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set wipe = params.WIPE|default(1)|int %}
    {% set t = printer.ff_toolchange.current_tool if tool < 0 else tool %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}
    {% set nozzle = printer.configfile.settings[printer["tool T%d" % t].extruder].nozzle_diameter|float if t >= 0 else 0.4 %}
    {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
    SAVE_GCODE_STATE NAME=_ff_filament
    M83
    G92 E0
    G1 E{length} F{speed}                            ; app: G92 E0; G1 E50 F<speed>; M400
    M400
    M106 P1 S{(ff.purge_fan * 255)|int}              ; app: M106 P1 S153
    G1 E-{ff.purge_retract} F{speed}                 ; app: G92 E0; G1 E-5 F<speed>; M400
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ff_filament
    {% if wipe %}
        _FF_NOZZLE_WIPE TOOL={t} TEMP={temp}         ; app: the purge string is torn off cold
    {% else %}
        M106 P1 S0
    {% endif %}
    _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}
