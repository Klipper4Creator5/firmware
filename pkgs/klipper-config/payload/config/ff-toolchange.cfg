# By using these files I affirm my respect for Ukraine's sovereignty and
# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg:
#
#     [ff_toolchange]
#     fast_feed: 24000     ; every other option in the section stays as shipped
# ---------------------------------------------------------------------------
# Configuration for the native Creator 5 Pro toolchanger, implemented by
# payload/klipper/extras/ff_tool.py + ff_toolchange.py. A Python extra rather
# than gcode_macros because firmwareExe's sequence polls the grab sensor
# before energising the lock motor and retries the approach up to three times,
# which a gcode_macro cannot do. See docs/notes/30-toolchange.md.
#
# PER-UNIT NUMBERS. Ordinary Klipper config; firmwareExe's JSON is not read.
#   [ff_tool <n>]    dock_x/dock_y        FF_IMPORT_FIRMWARE_CONFIG
#                    nozzle_x/y/z         TOOL_CALIBRATE_TOOL_OFFSET
#                    z_adjust             TOOL_Z_ADJUST; live at once,
#                                         autosaved only on SAVE=1
#   [ff_tool_offset] station_x/y/z        TOOL_LOCATE_SENSOR
# Do NOT put dock_*/nozzle_*/station_*/cylinder_* in this or any included file
# -- SAVE_CONFIG refuses to autosave an option an include already sets. They
# belong in the "#*#" block at the end of printer.cfg, like pid_* do. On a
# machine calibrated from the touchscreen the first boot after the flash runs
# FF_IMPORT_FIRMWARE_CONFIG + SAVE_CONFIG once; check TOOLCHANGE_STATUS before
# moving anything.
#
# OFFSETS are differences of nozzle_* against offset_base (T0), as
# CommMgr::setGrabGcodeOffsetMgr computes them:
#     X = nozzle_x[tool] - nozzle_x[base]
#     Y = nozzle_y[tool] - nozzle_y[base]
#     Z = nozzle_z[tool] - station_z + z_adjust[tool]   (absolute, ~+3.2 mm:
#                                  Z=0 is the bed whenever a tool is mounted)
# They are applied by a move transform BELOW Klipper's own G-code offset, in
# independent layers rather than one shared number: SET_GCODE_OFFSET is the
# operator's babystep alone; the job Z term comes from
# TOOLCHANGE_SET_PRINT_OFFSET (CLEAR=1 drops it); the tool's calibration and
# its z_adjust are the other two. While the job term and the babystep shared
# one number, ending a print wiped both.
#
# So the true machine Z of a G-code Z is that Z minus
# printer.gcode_move.homing_origin.z, the mounted tool's
# printer["tool T<n>"].gcode_z_offset, and printer.toolchanger.print_z_offset.
# (_FF_NOZZLE_WIPE in ff-filament.cfg is the one macro that does this.)
# printer.gcode_move.position is NOT the machine position -- it sits ABOVE the
# transform.
#
# SLICER: leave the change-filament G-code EMPTY, so Orca emits its own bare
# `Tn`, which reaches ff_toolchange.py's T<n> unimpeded. Files sliced with the
# older `T{next_extruder} ; ff-toolchange` marker still work.
#
# INSTALL. Flashing a package built from this repo is the whole install. By
# hand, onto a printer that is already modded:
#   1. cp payload/klipper/extras/ff_*.py /usr/data/anvil/klipper/klippy/extras/
#      (an OTA rewrites the software component the mod boots from, so re-flash
#      the mod after one.)
#   2. cp the ff-*.cfg to /usr/data/config/ and include them all -- the set is
#      mandatory, not a menu. Includes added to printer.cfg MUST go ABOVE its
#      "#*# <--- SAVE_CONFIG --->" marker, or Klipper reads them as corruption
#      and drops the whole autosave block with every calibrated value in it.
#      Order matters only where one file overrides another: ff-runout.cfg
#      after printer.base.cfg, ff-chamber.cfg after printer.chamber.cfg.
#   3. FF_IMPORT_FIRMWARE_CONFIG + SAVE_CONFIG (see ff-legacy.cfg).
#   4. TOOLCHANGE_STATUS, and confirm sensor names AND geometry before moving.
# ---------------------------------------------------------------------------

# One section per tool. Deliberately empty: the dock coordinates and the
# nozzle calibration are per unit and live in printer.cfg's SAVE_CONFIG block,
# filled by FF_IMPORT_FIRMWARE_CONFIG. A tool without a dock refuses to be
# grabbed or released.
[ff_tool 0]

[ff_tool 1]

[ff_tool 2]

[ff_tool 3]

[ff_toolchange]
# X added to every dock_x (the app's grabOffset; 0 on this unit).
#x_correction: 0.0
# Feeds, mm/min. The app stores mm/s and multiplies by 60.
#fast_feed: 30000
#slow_feed: 5400
#release_slow_feed: 5400
# degC-to-mm thermal term of the print-start Z offset:
# (nozzle_temp - 120) * temp_offset. The app's tempOffset.
#temp_offset: 0.00045
# Base tool for the offset differences. Does NOT cancel out in X/Y: changing
# it shifts every tool's applied X/Y by a constant, and only the tool-to-tool
# relative geometry is invariant. In Z it does not enter once station_z known.
#offset_base: 0
# Reported as each tool's `fan` in the klipper-toolchanger-shaped status
# (objects `toolchanger` and `tool T0..T3` are always registered, so UIs such
# as HelixScreen see a real toolchanger; ASSIGN_TOOL is refused).
#part_fan: fan_generic fanM106

# Homing safety. firmwareExe auto-homes before a grab, but a remote T<n>
# silently starting G28 can crash into whatever is on the bed, so an unhomed
# toolchange ABORTS by default. True restores the app's behaviour.
#auto_home: False

# Staging positions. These are code constants in the app, not stored config.
x_safe: 250
x_approach: 280
grab_pullback: 20
grab_retreat_feed: 1500
release_retreat_feed: 4800
accel_move: 8000
# accel_restore -- the app hardcodes 20000; unset, the module restores the
# accel limit that was live when the sequence started, so a machine configured
# below 20000 does not leave a toolchange faster than its [printer] max_accel.
#accel_restore: 20000

# restore_axis -- klipper-toolchanger's RESTORE_AXIS, as the default for T<n>,
# SELECT_TOOL and UNSELECT_TOOL when they do not name one. Unset, as shipped,
# restores nothing: a stock file's start block places the toolhead itself.
# Parking zeroes the tool's X and Y offsets but not Z, so the ~3.2 mm
# bed-frame term survives an UNSELECT_TOOL.
#restore_axis: xy
#restore_feed: 9000

# Sensor names -- microswitches, exposed as [gcode_button] sections in
# printer.base.cfg, but what they ARE is the app's sensors. dock_sensors is
# one per tool, PRESSED meaning that tool IS docked; grab_sensors are OR'd,
# any PRESSED meaning the carriage is mated with a tool.
dock_sensors: extruder_pos1, extruder_pos2, extruder_pos3, extruder_pos4
grab_sensors: extruder_grab1, extruder_grab2, extruder_grab3, extruder_grab4

# Lock-motor macros, confirmed present in printer.motor.cfg. The production
# lock is a [manual_stepper gear_stepper] on an A4988 with a PWM
# current-reference pin, NOT the DC-motor-on-H-bridge of the dev config:
#   MOTOR_GRAB    -> STEPPER_LOCK: VREF 0.25, MOVE=0.07 SPEED=0.25, M400
#   MOTOR_GRAB2   -> VREF 0.25, MOVE=0.03 SPEED=0.02 SYNC=0, then a delayed
#                    LOW_VREF drops the ref to 0.05 after 1.7 s
#   MOTOR_RELEASE -> STEPPER_UNLOCK: VREF 0.35, MOVE=-0.1 STOP_ON_ENDSTOP=1
#   MOTOR_STOP    -> commented out; a NO-OP. We still call it, as the app does.
grab_macro: MOTOR_GRAB
grab2_macro: MOTOR_GRAB2
release_macro: MOTOR_RELEASE
stop_macro: MOTOR_STOP


# Moonraker's print entry point is [ff_print] (extras/ff_print.py), NOT a
# SDCARD_PRINT_FILE wrapper here: it takes the command over in Python at
# klippy:connect and calls FF_BEFORE_PRINT_START before chaining to the
# builtin. Two wrappers on one command would fight over the rename.

# Homing Z with a head on the carriage rams the nozzle into the plate: Z homes
# on the carriage's eddy sensor, ~3.2 mm BELOW the nozzle tip. So G28 docks a
# mounted tool first -- X/Y home to 0, away from the docks at X~297, and
# docking needs only X/Y. If the dock sensors cannot say whether a head is on,
# Z homing is refused outright.
[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set tc = printer.ff_toolchange %}
    {% set axes = rawparams|upper %}
    {% set wants_z = 'Z' in axes or ('X' not in axes and 'Y' not in axes) %}
    {% if wants_z and not tc.state_ok %}
        { action_raise_error("Refusing to home Z: cannot tell whether a tool is mounted (%s). A head on the carriage would be driven into the plate. Check the docks, then retry." % tc.state_reason) }
    {% elif wants_z and tc.current_tool >= 0 %}
        { action_respond_info("T%d is mounted -- docking it before homing Z" % tc.current_tool) }
        G28.1 X Y
        TOOLCHANGE_PARK
        G28.1 {rawparams}
    {% else %}
        G28.1 {rawparams}
    {% endif %}

# Input shaper / resonance tests with a head on the carriage. Mainsail and
# HelixScreen send the stock commands verbatim and know nothing about tools,
# and measuring an empty carriage gives the wrong moving mass. These wrappers
# home if needed, grab shaper_tool when nothing is mounted, and pass the
# original parameters through. Needs [resonance_tester].
[gcode_macro _FF_SHAPER_PREP]
variable_shaper_tool: 0
gcode:
    {% set tc = printer.ff_toolchange %}
    {% if not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28                              ; docks a mounted tool first (wrapper above)
    {% endif %}
    {% if tc.current_tool < 0 %}
        { action_respond_info("no tool mounted -- grabbing T%d for the resonance test" % shaper_tool) }
        T{shaper_tool}
    {% endif %}

[gcode_macro SHAPER_CALIBRATE]
rename_existing: _FF_SHAPER_CALIBRATE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_SHAPER_CALIBRATE_BASE {rawparams}

[gcode_macro TEST_RESONANCES]
rename_existing: _FF_TEST_RESONANCES_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_TEST_RESONANCES_BASE {rawparams}

[gcode_macro MEASURE_AXES_NOISE]
rename_existing: _FF_MEASURE_AXES_NOISE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_MEASURE_AXES_NOISE_BASE {rawparams}

# VFA (vertical fine artifacts) -- the motor torque-ripple compensation, which
# is a DIFFERENT mechanism from the input shaping above and shares only the
# accelerometer. The commands come from klippy/extras/stepper_resonance_tester.py;
# these wrappers are ours, and exist for the reason the three above do: both
# sweep the carriage and read [lis2dw], so an empty carriage measures the wrong
# moving mass.
#
# STEPPER_RESONANCE_FACTORY_CALIBRATE IS DELIBERATELY NOT WRAPPED, and the
# reason is worth stating because the obvious edit is wrong. It is not a
# Python-registered command like the two below -- it is a [gcode_macro] in
# FlashForge's printer.vibration.cfg. Klipper parses with
# RawConfigParser(strict=False), so a second section of the same name MERGES
# with the first rather than sitting beside it: a
# `[gcode_macro STEPPER_RESONANCE_FACTORY_CALIBRATE]` here would not wrap that
# macro, it would BE that macro, with a rename_existing pointing at a command
# that does not exist yet.
#
# It needs no wrapper anyway. Its whole body is two
# STEPPER_RESONANCE_SEARCH_CALIBRATE calls, and those are wrapped here -- so
# the prep happens either way, once, from whichever command is reached first
# (_FF_SHAPER_PREP homes only if unhomed and grabs a tool only if none is
# mounted, so the second call is a no-op).
#
# NO SAVE_CONFIG HERE EITHER. The search applies its result live with
# MCLIB_SET_RESONANCE_DAMP and stages it with configfile.set, which only
# SAVE_CONFIG writes -- so without one the calibration is lost on the next
# restart. The stock app had exactly this split: the macro's own SAVE_CONFIG is
# commented out, and the app issued one separately at the end of the whole
# calibration run. It stays the operator's step because SAVE_CONFIG restarts
# klippy, which is not a thing a macro should do to somebody mid-session:
#
#     STEPPER_RESONANCE_FACTORY_CALIBRATE
#     SAVE_CONFIG
#
# See docs/notes/44-vfa-calibration.md.
[gcode_macro STEPPER_RESONANCE_SEARCH_CALIBRATE]
rename_existing: _FF_STEPPER_RESONANCE_SEARCH_CALIBRATE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_STEPPER_RESONANCE_SEARCH_CALIBRATE_BASE {rawparams}

[gcode_macro STEPPER_RESONANCE_REFINE_CALIBRATE]
rename_existing: _FF_STEPPER_RESONANCE_REFINE_CALIBRATE_BASE
gcode:
    _FF_SHAPER_PREP
    _FF_STEPPER_RESONANCE_REFINE_CALIBRATE_BASE {rawparams}
