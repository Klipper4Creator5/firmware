# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-tool-offset.cfg -- nozzle XY/Z offset calibration, Klipper-native.
# Implemented by payload/klipper/extras/ff_tool_offset.py. Recovered
# sequence: docs/notes/46-offset-calibration-recovered.md
#
# The station sits BELOW the bed plane, so the build plate has to come off --
# not asked for as a flag: the plate check parks the carriage and measures.
#
#   TOOL_CALIBRATE_TOOL_OFFSET  the MOUNTED tool (SELECT_TOOL T=<n> first):
#       zero the G-code offset, go to (cylinder_x - 12.5, cylinder_y), ESTOP Z
#       to z_target, four ESTOP probes outward (+X +Y -X -Y, 14 mm) at Z+0.6,
#       circle fit, second pass centred on that fit with Z re-probed, store as
#       [ff_tool n]'s nozzle_x/y/z. Identical to the touchscreen's
#       "Four-point" calibration, constants included.
#   TOOL_LOCATE_SENSOR          the same with an EMPTY carriage, from
#       (cylinder_x, cylinder_y); stores station_x/y/z in [ff_tool_offset].
#       station_z feeds TOOLCHANGE_SET_PRINT_OFFSET, so re-run it whenever the
#       station or bed is disturbed.
#   TOOL_OFFSET_STATUS          the saved values, and whether a calibration is
#       staged but unsaved.
#
# Results go to the SAVE_CONFIG block of printer.cfg, like PID results:
#       #*# [ff_tool 1]
#       #*# nozzle_x = 16.407789   nozzle_y = 211.986710   nozzle_z = 1.426736
#       #*# [ff_tool_offset]
#       #*# station_x = 28.791826  station_y = 212.639328  station_z = -1.678819
# Applied live and persisted by SAVE_CONFIG (restart). The stored numbers are
# absolute station-frame, so calibrating only T2 leaves T0/T1/T3 valid.
# firmwareExe's extruder.json is never read or written.
#
# Prerequisites: [ff_tool 0..3] and [ff_toolchange]; the PEI sheet removed.
# Both commands run G28 themselves when an axis is unhomed -- every move they
# make is in absolute machine coordinates, so an unhomed axis is a crash, not
# a warning. HOME=0 refuses instead of homing. Do not write nozzle_*/station_*
# in an include -- SAVE_CONFIG refuses to autosave an option an include
# already sets.
#
# Safety notes, all divergences from the app, which accepts ANY numbers:
#   * homing docks a mounted tool (Z homes on the carriage's eddy sensor), so
#     the tool pass picks its tool back up and refuses to measure if it
#     cannot.
#   * the plate check runs first on both commands and REFUSES if the build
#     plate is still on -- a measurement, not an operator's promise.
#   * z_target defaults to -3, not the app's -5: 2 mm less crash depth.
#   * once a trigger height is known, the Z probe stops z_margin below it
#     instead of descending to z_target.
#   * max_residual 0.05: a point that far off the fitted circle is a
#     mis-trigger, so abort without saving. Four symmetric points dilute a bad
#     point's error in the residual but move the centre by half of it.
#   * gap_min/gap_max: nozzle_z must sit 1.5..5 mm above station_z. A bogus
#     nozzle_z is what drives the first layer into the plate.
#   * START_PRINT refuses to print while nozzle_z/station_z are missing.

[ff_tool_offset]
# Start point (the app's test.json cylinder_x/cylinder_y). FF_IMPORT_FIRMWARE_
# CONFIG autosaves the unit's values into printer.cfg -- do not set them here.
#cylinder_x: 28.5
#cylinder_y: 214.5
# The tool pass starts nozzle_x_shift to -X of the station (app: 12.5).
#nozzle_x_shift: 12.5
# ESTOP travel from the centre (app: 14).
#probe_travel: 14
# ESTOP Z targets (app: -5 / station second pass -3; our default -3 / -3).
#z_target: -3
#z_target_station_2: -3
# Stop this far below a known trigger height instead of at z_target.
#z_margin: 2.0
# Probe height above the Z trigger, lift between passes, start/exit heights.
#z_clear: 0.6
#z_lift: 3
#z_start: 10
#z_final: 15
# Accel during ESTOP moves (app: 100) and what to restore afterwards
# (unset = the limit live before the run; the app forces 20000).
#probe_accel: 100
#accel_restore: 20000
# Plausibility guards -- 0 disables (app behaviour).
#max_residual: 0.05
#min_radius: 0
#max_radius: 0
#gap_min: 1.5
#gap_max: 5.0
# Plate check before anything descends with a nozzle: with the EMPTY carriage
# the station Z must not land more than plate_z_tolerance ABOVE the calibrated
# station_z (one-sided on purpose -- a plate can only hold the probe high) and
# a sideways probe must find the circle's edge. PLATE_CHECK=0 skips it once.
#plate_check: True
#plate_z_tolerance: 0.8
# Probe sampling, klipper-toolchanger's names, overridable per command with
# SAMPLES= / SAMPLES_TOLERANCE= / SAMPLES_TOLERANCE_RETRIES= /
# SAMPLES_RESULT= / SAMPLE_RETRACT_DIST= / PROBE_SPEED=. Left unset, each
# follows the fork's own [e_stop <axis>], so the defaults probe exactly as
# this extra always has. The one addition is samples_result: the fork always
# averages.
#samples: 3
#samples_tolerance: 0.02
#samples_tolerance_retries: 10
#samples_result: average       # average | median
#sample_retract_dist: 3
#probe_speed: 5

# klipper-toolchanger's documented entry point: UIs such as HelixScreen's
# setup wizard look for this macro name and show its description as the
# on-screen instruction. Runs the station pass with an empty carriage, then
# every tool; the last stays mounted so a following SHAPER_CALIBRATE has mass
# on the carriage. Finish with SAVE_CONFIG.
[gcode_macro CALIBRATE_TOOL_OFFSETS]
description: Remove the build plate and clean all nozzles first. Calibrates the station, then the nozzle offset of every tool.
gcode:
    TOOL_LOCATE_SENSOR
    {% for tool in printer.toolchanger.tool_numbers %}
        SELECT_TOOL T={tool}
        TOOL_CALIBRATE_TOOL_OFFSET
    {% endfor %}
