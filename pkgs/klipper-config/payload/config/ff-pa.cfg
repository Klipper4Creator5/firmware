# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-pa.cfg -- automatic pressure advance, Klipper-native. Implemented by
# payload/klipper/klippy/extras/ff_pa.py. Recovered sequence:
# docs/notes/51-pa-calibration-recovered.md
#
# What this actually is. The MEASUREMENT is neither ours nor Klipper's: it
# happens inside the closed eBoard MCU, which watches 16-bit samples arriving
# on its second UART from a transducer we have not identified and answers one
# number per line. This drives the same sweep the touchscreen drives and reads
# that number. We ship the eBoard firmware unchanged, so we get the verdicts
# it gives the stock app.
#
# Four facts that shape this file:
#   * The lines are extruded ~8 mm above the plate, IN FREE AIR. Nothing
#     prints them and nothing ever looks at them -- they exist only to make a
#     pressure transient at the two 10x flow steps. Expect about a gram of
#     loose filament on the plate, and clear it before the next print.
#   * Only the verdict 9 passes. Within a sweep the SMALLEST passing candidate
#     wins; the result is the mean of three sweep winners. So the answer can
#     never come out below the smallest candidate (0.0100 by default).
#   * The candidate order is scrambled while the Y ladder is not, so adjacent
#     lines on the plate are never adjacent in PA and a slow drift cannot bias
#     a contiguous band.
#   * FF_PA_CALIBRATE REPORTS. It does not save the number, does not write
#     printer.cfg and does not apply anything on a toolchange. Put the value
#     in your own [extruder<n>] or your slicer.
#
# Deliberate divergences from the app:
#   * the extruder's own pressure advance is restored on exit. The app leaves
#     the last candidate (0.0400) installed, which it can afford because it
#     immediately overrides it via SET_PA_ADVANCE -- and we do not.
#   * a run where every line came back with the SAME verdict is refused. The
#     app accepts it, and what it then reports is the smallest candidate
#     dressed up as a measurement. See require_discrimination.
#   * cold extruder, empty tool and out-of-range geometry are refused before
#     anything moves, instead of failing mid-line with the eBoard armed.
#   * the app's SET_KINEMATIC_POSITION replay is NOT ported: our sweep is
#     plain G1 under Klipper's own kinematics, so there is nothing to correct
#     and replaying it would only lie to Klipper about where the carriage is.
#   * the timing is NOT "improved". pa_action is an immediate MCU command and
#     there is deliberately no M400 between the last G1 and ACTION=0. The
#     closed scorer was tuned against that. Do not add barriers.
#
#   FF_PA_CALIBRATE [TOOL=] [TEMP=] [SWEEPS=] [CANDIDATES=] [DRY_RUN=1]
#       the full sweep on the MOUNTED tool. Roughly 4-5 minutes and ~1 g of
#       filament for the full five sweeps. DRY_RUN=1 prints the whole script
#       and the computed Z without moving. SWEEPS=1 is one sweep, ~1 min.
#   FF_PA_PROBE [PA=] [Y=] [TOOL=] [TEMP=]
#       ONE line, one verdict. This is the bring-up tool: run it across the
#       seven candidates by hand and confirm the eBoard gives you more than
#       one distinct answer before you trust any averaged number.
#   FF_PA_STATUS
#       the config in force, whether [pa_adjust] bound its eBoard commands,
#       the driver pin state, and the last run's table.
#
# Requires [pa_adjust] against [mcu eboard], [ff_toolchange], and the two
# driver latch pins -- all in printer.base.cfg. All axes homed, a tool
# mounted, filament loaded, the hotend at material temperature.
#
# Until a machine has shown that the eBoard actually discriminates between
# candidates (FF_PA_PROBE, above), a hand-tuned PA tower remains the
# recommended method and this is an experiment.
# ---------------------------------------------------------------------------

[ff_pa]
# The app's seven, in its scrambled order (@0x791ae0..0x791d70).
#candidates: 0.0100, 0.0200, 0.0150, 0.0350, 0.0250, 0.0300, 0.0400
# The only verdict the app accepts (@0x792878). The eBoard's own counter
# saturates at 10, so this looks like a graded score with 9 as the gate --
# but what the other values mean has not been pinned down.
#pass_value: 9
# Up to `sweeps` passes; stop as soon as `winners` of them produced a winner;
# the result is the mean of exactly those. Fewer is a hard failure, not a
# fallback to a partial mean.
#sweeps: 5
#winners: 3
# Y = y_start + y_step * i, one line per candidate.
#y_start: 50
#y_step: 5
# The line: start X, then "X:E:feedrate" per segment, E for the segment
# ENDING at that X. E is a constant 0.0567865 mm/mm throughout -- only the
# SPEED changes, 18 mm/s against 183 mm/s, and the two fast bursts are the
# only place pressure advance can show up.
#x_start: 40
#segments: 60:1.13573:1080, 100:2.27146:10980, 120:1.13573:1080,
#          140:1.13573:1080, 180:2.27146:10980, 200:1.13573:1080
#travel_feed: 30000
# Motion limits held for the sweep, restored on exit to whatever was live
# (printer.base.cfg ships 30000 / 9, so this is a real reduction).
#sweep_accel: 5000
#sweep_square_corner_velocity: 9
# Height of the lines, RAW eddy frame -- the same number and the same frame
# as [gcode_macro _FF_FILAMENT] purge_z, which is where this follows from
# when left unset. Z= on the command line overrides it for one run.
#line_z:
#line_z_feed: 3000
# The X/Y driver latch the app holds for the duration, restored to whatever
# it was. Empty disables the latch entirely.
#tmc_pins: enable_pin_tmc_x, enable_pin_tmc_y
# pa_action's two arguments. The firmware tests == 11 for start and treats
# everything else as stop; pc is stored and never read back on this eBoard
# firmware, so 666 is cargo we keep for fidelity.
#action_start: 11
#action_stop: 0
#action_pc: 666
# Refuse a result when every line came back with the same verdict. If that
# verdict is the passing one the sweep still produces a plausible number --
# the smallest candidate -- and it is an artefact, not a measurement. False
# downgrades this to a warning above the result.
#require_discrimination: True
# Refuse when the tool's fd_ex<n> switch says there is no filament. An
# unloaded tool extrudes nothing and scores nothing, quietly.
#require_filament_sensor: True
# The app's |current - target| <= 3 window, used when TEMP= is given.
#min_temp_margin: 3
