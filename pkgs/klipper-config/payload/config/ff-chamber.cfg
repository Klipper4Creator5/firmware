# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-chamber.cfg -- the chamber: heater (gated by model) and light.
#
# The Creator 5 Pro has a chamber heater; the plain Creator 5 does not. The
# declaration lives in printer.chamber.cfg, which differs by model: the Pro
# gets [heater_generic chamber_heater], the plain Creator 5 only
# [temperature_sensor chamber]. The non-Pro app reads the sensor and runs the
# chamber fans but never commands the heater, so its target stays 0.
#
# That is load-bearing, because FlashForge patched extras/verify_heater.py to
# HARDCODE its parameters and ignore the config, so overriding [verify_heater
# chamber_heater] does nothing. What keeps a non-Pro safe is only that nothing
# ever sets a target: check_event() returns early while target <= 0. Set one
# on a machine with no heating element and ~15 min later klippy calls
# invoke_shutdown("Heater chamber_heater not heating at expected rate"),
# mid-print. Mainsail and HelixScreen expose every heater_generic as settable,
# so on a non-Pro they hand the user that shutdown.
#
# This file closes it by gating the COMMAND rather than removing the section:
# the object has to stay declared because both UIs subscribe to it on both
# models. Whether this machine HAS the heater is not configured anywhere --
# these macros just ask Klipper whether the object exists, so this file is
# byte-identical in every package.
#
# REQUIRED -- not an optional drop-in.
# ---------------------------------------------------------------------------

[gcode_macro _FF_CHAMBER]
description: M141/M191 tunables
# M191 stops waiting this far below the target. The chamber is a slow, lossy
# volume; the app never waited on it tighter than a couple of degrees.
variable_wait_band: 2.0
# Never called: this holds the tunable above, nothing more. M141/M191 do the
# model gating themselves.
gcode:

# SET_HEATER_TEMPERATURE -- stock command, chamber target gated by model.
# Anything that is not a non-zero chamber target passes straight through, so
# hotends, the bed and "chamber off" behave exactly as before. On a machine
# with no heater the real command would fail with "Unknown heater", which is
# right for a typed command but would abort a print on a sliced M141 -- so a
# blocked call warns and continues. PID_CALIBRATE and anything else reaching
# past these macros still fails, as it should.
[gcode_macro SET_HEATER_TEMPERATURE]
description: Set a heater target (chamber ignored on models without the heater)
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set heater = params.HEATER|default('')|lower %}
    {% set target = params.TARGET|default(0)|float %}
    {% if heater == 'chamber_heater' and target > 0
          and 'heater_generic chamber_heater' not in printer %}
        { action_respond_info(
            "no chamber heater on this model -- ignoring TARGET=%.1f" % target) }
    {% else %}
        SET_HEATER_TEMPERATURE_BASE {rawparams}
    {% endif %}

# M141 [S<temp>] -- set chamber temperature, do not wait.
# M191 [S<temp>] -- set chamber temperature and wait for it.
# Klipper has neither built in, and the stock app drove the chamber from its
# own UI, so nothing in stock firmware ever accepted them from a sliced file.
# Both route through SET_HEATER_TEMPERATURE and inherit the model gate.
[gcode_macro M141]
description: Set chamber temperature (S=target, 0 = off)
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S|default(0)|float}

[gcode_macro M191]
description: Set chamber temperature and wait (S=target, 0 = off)
gcode:
    {% set target = params.S|default(0)|float %}
    {% set ff = printer['gcode_macro _FF_CHAMBER'] %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
    {% if target > 0 and 'heater_generic chamber_heater' in printer %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - ff.wait_band|float}
    {% endif %}

# ---------------------------------------------------------------------------
# The chamber light, on at startup.
#
# printer.base.cfg declares [led chamber_led] and stops there, as FlashForge
# ships it. Klipper defaults initial_WHITE to 0, and switching the light was
# firmwareExe's job -- the binary this mod replaces -- so the chamber would
# stay dark, reading as a broken lamp rather than a missing command.
#
# Overriding one option rather than restating the section: a second
# [led chamber_led] MERGES into the first and white_pin carries over from
# printer.base.cfg, which is FlashForge's file verbatim. This file is included
# after it, which is what makes the override land.
#
# To drive it by hand:
#     SET_LED LED=chamber_led WHITE=1     ; on
#     SET_LED LED=chamber_led WHITE=0     ; off
# Set initial_WHITE back to 0 for a machine that should boot dark.
# ---------------------------------------------------------------------------
[led chamber_led]
initial_WHITE: 1.0
