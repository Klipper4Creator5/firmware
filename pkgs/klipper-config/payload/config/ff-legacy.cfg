# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-legacy.cfg -- migration from firmwareExe's JSON. Keep it included. It
# registers ONE command and does nothing at startup:
#
#   FF_IMPORT_FIRMWARE_CONFIG            ; reads /usr/data/firmwareRes/config
#   SAVE_CONFIG                          ; persists nozzle_*/station_*/z_adjust
#
# On a fresh install you type neither: bin/ff-startup.py runs them once on the
# first boot after the mod is installed and stamps
# /usr/data/anvil/.firmware-config-imported so it never runs again. Delete
# that stamp to make the next boot redo it. MOD_IMPORT=0 turns it off;
# MOD_IMPORT_TIMEOUT is how long it waits for the stack (240s).
#
# Earlier releases did this inside klippy, with auto_import / auto_save on
# this section. Both options are gone -- remove them from printer.cfg if you
# set them, or klipper will refuse to start on an unknown option.
#
# dock_x/dock_y and the station start point are staged for SAVE_CONFIG along
# with the rest. The command also prints an [ff_toolchange] snippet, but only
# when the JSON disagrees with the running value.

[ff_legacy]
#firmware_config_dir: /usr/data/firmwareRes/config
