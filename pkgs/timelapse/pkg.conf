# anvil-timelapse -- moonraker-timelapse: the Moonraker component and Klipper
# macros behind Mainsail's Timelapse tab.
#
# ARCHITECTURE all: one .py and one .cfg, no native code. The encoder is its
# own package -- anvil-ffmpeg, which moonraker.conf points at.
PKG_NAME=anvil-timelapse
PKG_ARCH=all

# A COMMIT: upstream tagged v0.0.1 in 2021 and has developed on main ever
# since, so the only release is far older than the code anyone wants. Composed
# like pkgs/moonraker's old snapshot version, but off the commit DATE -- with
# no release worth descending from, the date is what orders one pin vs the next.
# `~<sha>` rather than `+git<sha>`: apk's version grammar has no `+`. See the
# same note in pkgs/klipper/pkg.conf.
PKG_VERSION="$(printf '%s' "$TIMELAPSE_DATE" | tr -d -)~$(printf '%.8s' "$TIMELAPSE_VERSION")"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

# tornado because the component imports tornado.ioloop directly; everything
# else it uses (klippy_apis, database, file_manager, shell_command, webcam) is
# Moonraker's own.
#
# NOT anvil-moonraker, though it plainly needs it: that arrow would make a
# CYCLE, since anvil-moonraker depends on this one (its moonraker.conf carries
# the [timelapse] section, and Moonraker dies on a section with no component).
# Only that direction is a hard failure, so only it is declared -- this package
# alone is inert, not broken.
#
# anvil-ffmpeg because the render shells out to it by absolute path, and
# FlashForge's own build cannot stand in: it has no rotate or flip filters.
# wget is NOT here -- that one really is the stock firmware's, a busybox
# applet, and no package in this feed provides it.
PKG_DEPENDS="anvil-python-tornado, anvil-ffmpeg"
PKG_BUILD_DEPENDS=""

# NO PKG_WHEN, unlike every other optional piece here. moonraker.conf's
# [timelapse] section and printer.base.cfg's [include timelapse.cfg] are both
# fatal when unsatisfied, so an off switch would give a printer that does not
# boot rather than one without timelapses. It ships always, like anvil-klipper.
#
# No PKG_STAMP_EXTRA: with the ffmpeg shim gone this recipe has no payload/ of
# its own, so TIMELAPSE_VERSION describes every input it has.

PKG_DESCRIPTION="moonraker-timelapse: the Moonraker component and Klipper macros that record a print frame by frame and render it with the printer's own ffmpeg. Drives Mainsail's Timelapse tab."
