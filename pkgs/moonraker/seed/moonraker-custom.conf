# /usr/data/config/moonraker-custom.conf -- YOUR Moonraker settings.
#
# THIS FILE IS YOURS. No update ever writes it. It is created once, on the
# first install that ships it, and left alone from then on -- the mod only
# checks that it exists.
#
# moonraker.conf, next to it, is mod-owned and IS overwritten on every update
# (that is how the [webcam] block and the API lockdown reach the printer).
# So put your changes here instead. This file is included at the END of
# moonraker.conf, and Moonraker applies options in the order it reads them,
# so anything you set here wins over what the mod shipped.
#
# Restate only the option you are changing, under its real section header:
#
#     [authorization]
#     trusted_clients:
#         192.168.1.0/24
#
# Everything you leave out keeps the value moonraker.conf shipped.
#
# DO NOT DELETE THIS FILE. moonraker.conf includes it by name, and Moonraker
# treats an include that matches nothing as a fatal config error -- it will
# refuse to start, and Mainsail will not load. Leaving it empty is fine;
# a file of nothing but these comments is a valid, inert include.
#
# Adding a whole new section works too -- [update_manager], [notifier ...],
# [power ...], and so on. See https://moonraker.readthedocs.io/
