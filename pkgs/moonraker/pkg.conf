# anvil-moonraker -- the Klipper API server.
#
# ARCHITECTURE all. Moonraker is pure python; every native module it imports
# comes from the interpreter's site-packages, which is a different package.
# See bin/payload.sh section 4 for why the stock 2022 build is not good enough
# and why this rides on the data partition instead of over /usr/prog.
PKG_NAME=anvil-moonraker
PKG_ARCH=all

# THE PIN IS A RELEASE TAG now, so the version is just the release. It used to
# be a commit -- 0.8.0+git<sha> -- because no release had both lmdb and the
# webcam "enabled" flag Mainsail filters on, and this repo could not ship the
# sqlite the releases after it wanted. It builds its own CPython now, so it
# can. apk orders 0.11.0 after every 0.8.0 string that shipped.
PKG_VERSION="${MOONRAKER_VERSION#v}"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

# Moonraker runs on the CPython 3.13 this repo builds and imports twelve
# third-party packages, each its own package.
#
# THE LIST IS moonraker-requirements.txt MINUS WHAT MOONRAKER DOES NOT IMPORT.
# Not on it: anvil-python-pillow, which only the metadata SUBPROCESS uses, so
# a printer without it serves fine and shows no gcode thumbnails; and
# anvil-python-preprocess-cancellation, imported lazily in that same
# subprocess. Both are Recommends in spirit. apk HAS a recommends field and
# nothing in its solver reads it, so they are roots in bin/payload.sh;
# install-if is the field that would work and moving them is its own change.
# anvil-libsodium is not here either: libnacl declares it, which is where a
# ctypes dependency belongs. Neither are the requirements 0.11.0 grew for
# components this printer does not enable -- paho-mqtt, zeroconf, apprise,
# ldap3, python-periphery -- nor its msgspec and uvloop speedups, both of
# which Moonraker imports under contextlib.suppress(ImportError).
#
# WHAT 0.11.0 CHANGED HERE: dbus-next became dbus-fast, importlib-metadata
# (and its zipp) is new, and pyserial-asyncio is gone -- nothing imports it
# any more. anvil-python-lmdb STAYS, and versions.env says why: it is what
# reads the old database during the one-time conversion to sqlite.
#
# anvil-timelapse is on the list for a different reason than any of those: it
# is not imported but CONFIGURED. The [timelapse] section moonraker.conf ships
# names its component, and Moonraker treats a section with nothing behind it
# as fatal.
PKG_DEPENDS="anvil-python, anvil-python-tornado, anvil-python-lmdb,
             anvil-timelapse,
             anvil-python-streaming-form-data, anvil-python-distro,
             anvil-python-inotify-simple, anvil-python-libnacl,
             anvil-python-dbus-fast, anvil-python-jinja2,
             anvil-python-pyserial, anvil-python-importlib-metadata,
             anvil-python-smart-open, anvil-python-setuptools"
PKG_BUILD_DEPENDS=""

# moonraker.conf is edited in this repo and MOONRAKER_VERSION says nothing
# about it, so the recipe needs a key over its own files -- without one, an
# edit to the config reads as "already current".
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_WHEN='[ "${BUILD_MOONRAKER:-1}" = "1" ]'

PKG_DESCRIPTION="Moonraker, the Klipper API server. Runs on the interpreter this mod ships, from /usr/data/anvil/moonraker."
