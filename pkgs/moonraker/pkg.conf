# anvil-moonraker -- the Klipper API server.
#
# ARCHITECTURE all. Moonraker is pure python; every native module it imports
# comes from the interpreter's site-packages, which is a different package
# built for a different reason. Nothing in this tree is an ELF object, so
# there is no architecture to claim. See bin/patch.sh section 4 for the long
# version of why the stock 2022 build is not good enough and why this rides on
# the data partition instead of over /usr/prog.
PKG_NAME=anvil-moonraker
PKG_ARCH=all

# THE PIN IS A COMMIT, NOT A RELEASE, and versions.env explains why: the last
# release still on lmdb is v0.8.0 (Feb 2023) and the webcam "enabled" flag
# Mainsail filters on arrived in April 2023, so no release has both, and
# FlashForge's python 3.8.2 has no _sqlite3 for the versions that moved off
# lmdb. A 40-character sha is not a package version anybody can compare, so
# the field is composed the way Debian composes one for a snapshot: the last
# release this descends from, then the commit. opkg then orders it after
# 0.8.0 and before 0.9.0, which is exactly where it belongs.
PKG_VERSION="0.8.0+git$(printf '%.8s' "$MOONRAKER_VERSION")"
PKG_RELEASE=1
PKG_SECTION=net

PKG_EXCLUDE=".version"

# WHAT MOONRAKER ACTUALLY NEEDS, now that the feed can satisfy it. It runs on
# the CPython 3.13 this repo builds (payload/anvil-env.sh points FF_PYTHON at
# it) and imports thirteen third-party packages, each of which is its own .ipk.
#
# THE LIST IS moonraker-requirements.txt MINUS WHAT MOONRAKER DOES NOT IMPORT.
# Not on it: anvil-python-pillow, which only the metadata SUBPROCESS uses, so a
# printer without it serves fine and shows no gcode thumbnails; and
# anvil-python-preprocess-cancellation, imported lazily in that same
# subprocess. Both are Recommends in spirit -- opkg has no such field, and
# putting them in Depends would make a thumbnail library non-optional.
# anvil-libsodium is not here either: libnacl declares it, which is where a
# ctypes dependency belongs.
PKG_DEPENDS="anvil-python, anvil-python-tornado, anvil-python-lmdb,
             anvil-python-streaming-form-data, anvil-python-distro,
             anvil-python-inotify-simple, anvil-python-libnacl,
             anvil-python-dbus-next, anvil-python-jinja2,
             anvil-python-pyserial, anvil-python-pyserial-asyncio,
             anvil-python-smart-open, anvil-python-setuptools"
PKG_BUILD_DEPENDS=""

# moonraker.conf is edited in this repo and MOONRAKER_VERSION says nothing
# about it, so the recipe needs a key over its own files. Without one, an edit
# to the config reads as "already current" and the printer gets the previous
# release's.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"

PKG_WHEN='[ "${BUILD_MOONRAKER:-1}" = "1" ]'

PKG_DESCRIPTION="Moonraker, the Klipper API server, pinned to the newest commit that still uses lmdb. Runs on the interpreter this mod ships, from /usr/data/anvil/moonraker."
