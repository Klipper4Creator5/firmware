# anvil-sntpd -- the NTP client, because this printer has no clock of its own.
#
# THE PROBLEM IT SOLVES. There is no RTC and no battery: at every power-on the
# kernel starts from whatever the build stamped into it and stays there until
# something on the machine asks the network what time it is. Nothing on the
# stock rootfs can ask -- FlashForge's busybox is v1.31.1 built without the
# ntpd applet (it has date, hwclock, rdate and crond; rdate speaks RFC 868,
# not NTP) -- so a stock printer's idea of "now" is fiction, which is why job
# timestamps, log ordering and TLS certificate validity are all wrong on a
# machine that has been unplugged.
#
# ONE BINARY AND NO CONFIGURATION FILE. sntpd takes its servers and its poll
# interval on the command line, so the whole policy is the argument list in
# pkgs/anvil-core/payload/etc/s6-rc/source/ntp/run and there is no second place
# to look. That is the reason it is this client and not OpenNTPd or chrony,
# both of which want a config file, a privsep user and a chroot directory --
# three pieces of state to place on a read-only rootfs, to run one UDP query.
PKG_NAME=anvil-sntpd
PKG_VERSION="$SNTPD_VERSION"
PKG_RELEASE=1
PKG_SECTION=net
PKG_EXCLUDE=".version"

# Plain C against the glibc the toolchain's sysroot already provides. src's
# Makefile.am names -lrt in `sntpd_LIBS`, which is not a variable automake
# reads, so nothing links it -- and glibc 2.29 has clock_gettime in libc
# anyway.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="sntpd, a small SNTP client. Keeps the printer's clock right: there is no RTC, so without it every boot starts at the wrong time and stays there."
