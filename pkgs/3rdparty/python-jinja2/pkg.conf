# anvil-python-jinja2 -- for the CPython this feed builds.
#
# Template rendering for Moonraker and for klippy's gcode macros.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_JINJA2_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-jinja2
PKG_VERSION="$(pypkg_version jinja2)"
PKG_RELEASE=1
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python, anvil-python-markupsafe"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="Jinja2 -- the template engine Moonraker and klippy's gcode macros render through."
