# anvil-python-pycparser -- for the CPython this feed builds.
#
# cffi's only runtime dependency; it parses the C declarations cffi is given.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_PYCPARSER_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-pycparser
PKG_VERSION="$(pypkg_version pycparser)"
PKG_RELEASE=1
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="pycparser -- a C parser in pure python. cffi's only runtime dependency."
