# anvil-python-lmdb -- for the CPython this feed builds.
#
# Moonraker's database AT THE PINNED COMMIT, and the package that disappears
# the moment MOONRAKER_VERSION moves past 80c7620 (lmdb -> sqlite), which is
# the whole reason for having built an interpreter with _sqlite3.
#
# THE PIN IS IN versions.env, as PYPKG_LMDB_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-lmdb
PKG_VERSION="$(pypkg_version lmdb)"
PKG_RELEASE=1
PKG_SECTION=python

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="lmdb -- the memory-mapped database Moonraker keeps its state in, built as a real CPython extension rather than the cffi backend that would compile at import time."
