# anvil-python-tornado -- for the CPython this feed builds.
#
# Moonraker's web server. Its C speedup is optional and its PUBLISHED WHEEL
# carries an x86-64 copy of it, which is exactly what pkg_pywheel's
# --no-binary :all: is for.
#
# THE PIN IS IN versions.env, as PYPKG_TORNADO_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-tornado
PKG_VERSION="$(pypkg_version tornado)"
PKG_RELEASE=1

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="Tornado -- the web framework Moonraker serves on, with its C speedup built for mipsel."
