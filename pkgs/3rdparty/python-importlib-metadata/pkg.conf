# anvil-python-importlib-metadata -- for the CPython this feed builds.
#
# New with Moonraker 0.11.0: moonraker/utils/source_info.py imports it at
# module scope. The BACKPORT and not the 3.13 stdlib importlib.metadata,
# because that is the name upstream writes, and a package whose imports we
# rewrite is a package we maintain.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_IMPORTLIB_METADATA_FILE, beside its
# sha256 and beside the others. PKG_VERSION is READ OUT OF that file name
# rather than written again here, so there is one string to bump and no way
# for the two to disagree.
PKG_NAME=anvil-python-importlib-metadata
PKG_VERSION="$(pypkg_version importlib-metadata)"
PKG_RELEASE=1
PKG_ARCH=all

PKG_EXCLUDE=".version"
# zipp is its one runtime dependency, and it is imported at module scope.
PKG_DEPENDS="anvil-python, anvil-python-zipp"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="importlib_metadata -- the backport of the stdlib module. Moonraker reads its own version through it."
