# anvil-mainsail -- the web UI, as a package.
#
# THE FIRST PACKAGE HERE THAT COMPILES NOTHING: Mainsail is a zip of static
# files that upstream builds, so this recipe unpacks it and says where it
# goes -- the cheapest possible exercise of pkg_stage and Architecture: all.
#
# ARCHITECTURE all, AND THAT IS NOT A SHORTCUT. There is no ELF in this
# package, so a build for one printer is byte-identical to a build for
# another, and saying `mipsel_xburst2` would claim a constraint that does not
# exist.
PKG_NAME=anvil-mainsail
PKG_ARCH=all

# The 'v' comes off: MAINSAIL_VERSION is a git tag ("v2.18.2") and a package
# version is a version, not a tag name. The package manager compares these
# fields, and a
# leading letter is one more thing for it to be wrong about.
PKG_VERSION="${MAINSAIL_VERSION#v}"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

# No Depends, and worth saying why rather than leaving it blank: Mainsail is
# served by the STOCK nginx, which is the rootfs's and not a package in this
# feed. What we ship for nginx is a config file, and that lives in anvil-core.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

# Gated, because the zip is a download and a build configured without it has
# nothing to unpack. BUILD_MAINSAIL defaults to 1, so this is false only when
# somebody has deliberately left Mainsail out -- and then the right answer is
# a feed with no anvil-mainsail in it, not a failed build.
PKG_WHEN='[ "${BUILD_MAINSAIL:-1}" = "1" ]'

PKG_DESCRIPTION="Mainsail, the Klipper web interface. Static files served by the printer's own nginx from /usr/data/anvil/www/mainsail."
