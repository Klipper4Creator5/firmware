# anvil-ffmpeg -- ffmpeg, ours, for the timelapse render.
#
# WHY NOT FLASHFORGE'S. Theirs is configured --disable-everything with a
# narrow enable list and NO hflip/vflip/transpose/rotate, so a webcam with a
# rotation or a flip set renders nothing at all -- measured by asking their
# binary for -filters. Ours enables those and nothing else new.
#
# THERE IS NO HARDWARE ENCODER TO USE INSTEAD, and it is worth writing down so
# nobody re-derives it: the X2600's device tree declares jpege (a JPEG
# encoder), jpegd and felix, and felix is an H.264 DECODER -- the die has no
# H.264 encode block. Of those only felix has a driver in the stock kernel.
# So x264 in software is the only way to an H.264 mp4 on this machine, and the
# render is tuned for speed instead (-preset ultrafast, in moonraker.conf).
PKG_NAME=anvil-ffmpeg

PKG_VERSION="$FFMPEG_VERSION"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

# Nothing at runtime: --disable-shared means the libav* are linked into the one
# binary, and libx264 comes in as a static archive from anvil-x264-dev.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="x264"

PKG_DESCRIPTION="ffmpeg, built for the timelapse render: image2 in, libx264 out, and the rotate/flip filters FlashForge's own build leaves out."
