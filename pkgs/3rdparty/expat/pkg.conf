# anvil-expat-dev -- a static library CPython is linked against.
#
# SECTION libdevel, and the name says -dev, because there is no runtime half:
# a static archive ends up inside whatever links it, so nothing of this is ever
# installed on a printer. It is a real package rather than a directory in
# somebody's build tree so that "does it contain the headers its dependent
# needs" is a question CPython's configure answers on every build.
PKG_NAME=anvil-expat-dev
PKG_VERSION="$EXPAT_VERSION"
PKG_RELEASE=1
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_DESCRIPTION="expat headers and static library. Linked into CPython's pyexpat via --with-system-expat."
