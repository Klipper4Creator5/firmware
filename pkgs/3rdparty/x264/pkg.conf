# x264 -- the H.264 encoder ffmpeg encodes timelapses with.
#
# FlashForge ships one too, on the prog partition, and we do not use it: it is
# the .so their ffmpeg links, and our ffmpeg is a different build against
# different headers. Ours is static and goes in as dev files only.
#
# NAMED -dev OUTRIGHT, as anvil-zlib-dev is, rather than splitting with
# PKG_DEV_FILES: nothing here is a runtime file, so a split would leave an
# empty anvil-x264 beside it that no printer would ever want.
PKG_NAME=anvil-x264-dev

# A SNAPSHOT, not a release: upstream tags nothing. The version is the snapshot
# name reduced to its date and time so a package manager compares dates.
#
# The upstream name is `snapshot-20191217-2245-stable`, and neither the dashes
# nor the trailing word survive translation: apk splits a name from a version
# at the last `-[0-9]`, and `-2245` there would be read as a malformed release
# rather than part of the version. `20191217.2245` orders identically and is
# a version apk can parse. pkg_version_ok gates it.
PKG_VERSION="$(printf '%s' "${X264_VERSION#snapshot-}" | sed 's/-stable$//; s/-/./g')"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="x264, the H.264 encoder. Built static for anvil-ffmpeg; nothing at runtime installs it."
