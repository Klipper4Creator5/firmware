# anvil-libarchive -- build-only, like anvil-zlib. See pkgs/3rdparty/zlib/pkg.conf for
# why the anvil- prefix and why a build-only library is a real package.
#
# PKG_BUILD_DEPENDS is where the dependency on zlib is written down, and it is
# NOT the same field as PKG_DEPENDS. This one names recipes: it decides build
# order and it is what pkg_deps unpacks into the sysroot, and it never reaches
# the control file. PKG_DEPENDS is what opkg reads at install time, and it is
# empty here because zlib is linked in rather than loaded -- a package that
# declared a runtime dependency on a library it had statically absorbed would
# be asking the printer to install something nothing will ever open.
PKG_NAME=anvil-libarchive-dev
PKG_VERSION="$LIBARCHIVE_VERSION"
PKG_RELEASE=1
PKG_SECTION=libdevel
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="zlib"
PKG_DESCRIPTION="libarchive headers and static library, cut down to gzip and tar. This is what opkg reads .ipk files with; its configure hard-fails without it. Nothing installs this on the printer."
