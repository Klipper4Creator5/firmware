# anvil-python-cffi -- for the CPython this feed builds.
#
# klippy's chelper, and the package that justifies the whole glibc decision:
# this is what dlopens FlashForge's own c_helper.so, measured. It links the
# static -fPIC libffi this feed already builds for the interpreter's _ctypes.
#
# THE PIN IS IN versions.env, as PYPKG_CFFI_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-cffi
PKG_VERSION="$(pypkg_version cffi)"
PKG_RELEASE=1
PKG_SECTION=python

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python, anvil-python-pycparser"
PKG_BUILD_DEPENDS="python libffi"

PKG_DESCRIPTION="cffi -- C foreign function interface. What klippy's chelper loads FlashForge's c_helper.so through."
