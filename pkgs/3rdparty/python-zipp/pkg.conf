# anvil-python-zipp -- for the CPython this feed builds.
#
# Here for one reason: importlib_metadata imports it. Nothing else in the feed
# does, and if that dependency ever goes away this package goes with it.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_ZIPP_FILE, beside its sha256 and beside
# the others. PKG_VERSION is READ OUT OF that file name rather than written
# again here, so there is one string to bump and no way for the two to
# disagree.
PKG_NAME=anvil-python-zipp
PKG_VERSION="$(pypkg_version zipp)"
PKG_RELEASE=1
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="zipp -- pathlib-compatible zipfile.Path. importlib_metadata's one runtime dependency."
