# anvil-execline -- skarnet's scripting language, shipped because s6-rc
# requires it.
#
# THIS PACKAGE EXISTS AGAINST A DOCUMENTED DECISION NOT TO SHIP IT. s6-rc has
# no --disable-execline: it links -lexecline unconditionally and
# s6-rc-compile writes execline scripts into every compiled database whether
# or not our own services need them. The "2.1MB for nothing" that argued
# against it was measured unstripped and statically linked against musl; built
# the way everything is built now it is 1008KB for all 53 binaries.
#
# ALL 53 SHIP, deliberately, rather than a chosen subset. Which execline
# programs a compiled database references depends on the service definitions:
# a plain longrun needs none, a pipeline needs fdswap, a oneshot needs the
# runner. A subset picked from today's services fails the day somebody adds a
# pipeline -- at boot, on a printer, naming a program nobody decided to leave
# out.
PKG_NAME=anvil-execline
PKG_VERSION="$EXECLINE_VERSION"
PKG_RELEASE=1
PKG_EXCLUDE=".version"

# No runtime Depends: libskarnet is linked in statically, and libc is the
# rootfs's. The build dependency below is a different thing entirely.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="skalibs"

# THE HEADERS AND THE ARCHIVE GO TO anvil-execline-dev. s6 and s6-rc link
# libexecline, so the feed has to carry it -- but a printer has no compiler
# and no reason to hold 48KB of headers. Splitting them means `apk add
# anvil-execline` puts 53 binaries on the machine and nothing else, while
# pkg_deps still unpacks both halves into its sysroot.
PKG_DEV_FILES="include lib"
PKG_DEV_DESCRIPTION="execline headers and static library. Needed to link s6 and s6-rc; nothing installs this on a printer."

PKG_DESCRIPTION="execline, skarnet's non-interactive scripting language. Shipped because s6-rc links it and its compiled databases exec it."
