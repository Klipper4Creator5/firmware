# anvil-python-inotify-simple -- for the CPython this feed builds.
#
# Moonraker's file_manager watches the gcode directory through it.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_INOTIFY_SIMPLE_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-inotify-simple
PKG_VERSION="$(pypkg_version inotify-simple)"
PKG_RELEASE=1
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="inotify_simple -- a thin wrapper over inotify. Pure python; Moonraker's file manager watches the gcode directory with it."
