# busybox -- optional, and the only package in this feed built from a file
# that is not in the repository and was not downloaded by fetch-assets.sh.
#
# FlashForge's busybox is a small applet set missing several things the mod's
# init scripts would like. Pointing BUSYBOX_BIN at a fuller build puts one at
# $MODDIR/bin/busybox, which is on the PATH anvil-env.sh exports, ahead of
# /bin.
PKG_NAME=anvil-busybox

# ABSENT, NOT FAILED. With BUSYBOX_BIN unset -- every normal build, CI's
# included -- pkg_recipes does not list this recipe, so nothing fetches,
# builds, indexes or installs it. The `-f` is part of the condition rather
# than an error because a config.env carried between machines routinely names
# a path that exists on only one of them.
PKG_WHEN='[ -n "${BUSYBOX_BIN:-}" ] && [ -f "$BUSYBOX_BIN" ]'

# READ OUT OF THE BINARY, because there is nothing else to read it from: no
# tarball name, no versions.env pin, no configure script. busybox stamps
# "BusyBox v1.31.1" into its own .rodata, and that string is the only
# statement about this file's identity that comes from the file. A build that
# cannot be identified gets 0, leaving PKG_STAMP_EXTRA as the whole cache key.
PKG_VERSION=$(strings -a "$BUSYBOX_BIN" 2>/dev/null \
    | sed -n 's/^BusyBox v\([0-9][0-9.]*\).*/\1/p' | head -n1)
PKG_VERSION="${PKG_VERSION:-0}"
PKG_RELEASE=1

# pkg_end writes its cache stamp at the root of the recipe's output tree, and
# without this line it ships as $MODDIR/.version -- a top-level dotfile in the
# prefix root, named after nothing. Every recipe excludes it.
PKG_EXCLUDE=".version"

# THE CONTENT IS THE CACHE KEY, as for anvil-core: the version cannot see the
# input. Two different busybox builds of v1.31.1 are the same version string,
# and swapping one for the other must rebuild.
PKG_STAMP_EXTRA=$(sha256sum "$BUSYBOX_BIN" 2>/dev/null | cut -c1-16)

# No Depends and nothing to build against. busybox is a single static-ish
# binary from outside this build; whatever it links, it links already, and
# bin/build-packages.sh's ABI gate decides whether the printer can run it.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="A fuller busybox at \$MODDIR/bin/busybox, from config.env's BUSYBOX_BIN. Optional: the stock rootfs has a busybox already, this one has more applets."
