# What bin/build-packages.sh needs to turn build.sh's output into an .ipk.
# Sourced, so it is shell and may read anything bin/common.sh exports -- which
# is where $SODIUM_VERSION comes from, so the version in the package is the
# pin in versions.env and cannot be set twice.
#
# THE FIRST RECIPE, and the shape every later one should copy: a build.sh that
# leaves a $MODDIR-relative tree under work/, and this file saying what to
# call it. Nothing here knows how libsodium is compiled and nothing in
# build.sh knows what a package is.
PKG_NAME=anvil-libsodium
PKG_VERSION="$SODIUM_VERSION"

# The PACKAGING revision, bumped when this recipe changes but the upstream
# version does not. opkg compares `1.0.20-1` against `1.0.20-2` and upgrades,
# which is the only way to ship a repackage without lying about which
# libsodium is inside.
PKG_RELEASE=1

PKG_SECTION=libs

# The tree to package, laid out the way it should appear under $MODDIR --
# which is exactly what build.sh already produces for bin/patch.sh to copy
# into the payload, so no restaging happens here.
PKG_ROOT="$SODIUM_BUILD"

# build.sh's cache stamp lives in that tree and is a build artefact, not a
# shipped file. Left in, it would install as $MODDIR/.version.
PKG_EXCLUDE=".version"

# No Depends. libsodium links libc and nothing else, and libc is the rootfs's
# -- not ours to depend on. The field being genuinely empty rather than merely
# unwritten is worth stating.
PKG_DEPENDS=""

# Nothing to build against either: libsodium's own sources are the whole
# build. The field is here rather than left to default because its absence in
# a recipe that HAS dependencies is the bug it exists to prevent -- pkg_deps
# would fill an empty sysroot and configure would find the host's headers.
PKG_BUILD_DEPENDS=""

PKG_DESCRIPTION="NaCl-compatible crypto library. Loaded by ctypes from libnacl, which is how Moonraker's authorization component signs its ed25519 JWTs."
