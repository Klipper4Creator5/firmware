# anvil-opkg -- the package manager, and the one package here that a printer
# actually installs.
#
# PKG_DEPENDS is empty and PKG_BUILD_DEPENDS is not, which is the distinction
# worth reading twice: zlib and libarchive are linked INTO this binary, so they
# are needed to build it and are not needed to run it. Writing them into
# PKG_DEPENDS would make opkg refuse to install unless two development packages
# were on the printer, for libraries already inside the file being installed.
PKG_NAME=anvil-opkg
PKG_VERSION="$OPKG_VERSION"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="zlib libarchive"
PKG_DESCRIPTION="The opkg package manager. Installs and removes .ipk packages under /usr/data/anvil, which is also the prefix it was configured with -- opkg resolves its own status database from that path, not from --offline-root. zlib and libarchive are linked in; only the printer's glibc is needed at runtime."
