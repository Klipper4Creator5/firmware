# anvil-openssl-dev -- libssl and libcrypto, linked into CPython's _ssl and
# _hashlib.
#
# --openssldir IS WHERE THE INTERPRETER LOOKS FOR CA CERTIFICATES ON THE
# PRINTER, and nothing installs any there. `import ssl` works; verifying a
# certificate chain does not, until somebody ships a ca-certificates bundle.
# That is a known gap rather than a bug in this recipe -- see
# tools/python/README.md -- and it is recorded here because the path is baked
# into the library at compile time and moving $MODDIR would move it.
#
# SECTION libdevel and a -dev name: these are static archives that end up
# inside the interpreter. Nothing of this is installed on a printer.
PKG_NAME=anvil-openssl-dev
PKG_VERSION="$OPENSSL_VERSION"
PKG_RELEASE=1
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_DESCRIPTION="OpenSSL headers and static libraries. Linked into CPython's _ssl and _hashlib; the printer's own python has neither."
