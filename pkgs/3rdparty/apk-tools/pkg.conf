# anvil-apk-tools -- the package manager, and the one package here that a
# printer actually installs.
#
# It began as the proof of concept in docs/notes/85-packaging.md and is now a
# root in bin/payload.sh's MOD_ROOTS whenever the feed is built as apk. The
# binary is cross-built with prefix.patch, so its database defaults to
# $MODDIR -- / on this printer is a read-only squashfs and nothing may be
# created at /lib/apk or /etc/apk.
#
# THE BOOTSTRAP COPY IS NOT THIS ONE. A v3 .apk cannot be opened without an
# apk, so bin/build-payload.py puts the same binary on the stick at /mnt/apk
# to install the feed with; this package is what the printer ends up carrying,
# with a database row to match.
PKG_NAME=anvil-apk-tools
PKG_VERSION="$APK_TOOLS_VERSION"
PKG_RELEASE=1

# zlib and openssl are LINKED IN, not shipped beside: the same distinction
# they are needed to BUILD this and are not needed to run it. openssl is the
# interesting half -- already cross-built for CPython, which is why
# PKG_BUILD_DEPENDS is this short and why adopting apk removed a cross-build
# rather than adding one.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS="zlib openssl"

PKG_EXCLUDE=".version"

PKG_DESCRIPTION="Alpine's package manager. Installs and removes .apk packages under /usr/data/anvil, which is also where its database lives -- upstream resolves both the database and the install destination from --root, and / on this printer is a read-only squashfs, so a patch defaults the first to /usr/data/anvil and leaves the second at /. zlib and openssl are linked in; only the printer's glibc is needed at runtime."

# The tree build.sh installs into, named in bin/common.sh so nothing spells
# work/pkg/apk-tools twice.
PKG_ROOT="$APK_TOOLS_BUILD"

# THE PATCH IS AN INPUT. pkg_stamp hashes the pin and the toolchain, and the
# pin does not move when prefix.patch is edited -- without this a changed
# patch would be a warm cache and the old binary would ship.
PKG_STAMP_EXTRA="$(sha256sum "$PKG_DIR/prefix.patch" 2>/dev/null | cut -d' ' -f1)"
