# anvil-python-streaming-form-data -- for the CPython this feed builds.
#
# Moonraker's upload parser, Cython-generated C. The pin is NOT the 1.13.0
# moonraker-requirements.txt asks for: that release ships a pregenerated
# _parser.c calling the four-argument _PyLong_AsByteArray, which grew a fifth
# parameter in 3.13, so every integer conversion in the file fails to compile.
#
# THE PIN IS IN versions.env, as PYPKG_STREAMING_FORM_DATA_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-streaming-form-data
PKG_VERSION="$(pypkg_version streaming-form-data)"
PKG_RELEASE=1
PKG_SECTION=python

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python, anvil-python-smart-open"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="streaming_form_data -- Moonraker's multipart upload parser, with its Cython-generated C built for mipsel."
