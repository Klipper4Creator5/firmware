# anvil-python-setuptools -- for the CPython this feed builds.
#
# A RUNTIME DEPENDENCY OF NOTHING IN THIS FEED, and shipped anyway. It is the
# fix for a MEASURED failure: a tree without pkg_resources made lmdb fall back
# to its cffi path and try to invoke mips-linux-gnu-gcc ON THE PRINTER at
# Moonraker startup, and there is no compiler on a printer. Installing lmdb as
# a wheel rather than as an egg removes that path as well, so this is now belt
# and braces -- and 4.9MB of it, which makes it the one obvious package to
# drop if the data partition ever gets tight. A separate package is what makes
# that a decision somebody can take.
#
# The SAME sdist is also the host-side build backend for most of this feed:
# pkg_buildpython installs it into the throwaway x86-64 interpreter. One pin,
# both jobs, so the setuptools that generates the shipped .so files is the
# setuptools whose hash is checked in versions.env.
#
# ARCHITECTURE all. Nothing in this package is compiled; it is python source
# and it runs on any interpreter that can import it.
#
# THE PIN IS IN versions.env, as PYPKG_SETUPTOOLS_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-setuptools
PKG_VERSION="$(pypkg_version setuptools)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="setuptools and pkg_resources. Nothing in this feed imports them at runtime; they are here so that lmdb never reaches for its compile-at-import fallback."
