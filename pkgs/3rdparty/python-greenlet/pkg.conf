# anvil-python-greenlet -- for the CPython this feed builds.
#
# klippy's reactor. THE MIPS STACK-SWITCHING ASSEMBLY WAS NEVER THE PROBLEM;
# C++ designated initializers were. greenlet 3.x writes its PyTypeObjects as
# designated initializers, which gcc 7.2 -- the only compiler that produces
# this printer's ABI -- accepts only in declaration order with no gaps, and
# refuses anything else with "sorry, unimplemented: non-trivial designated
# initializers not supported". build.sh rewrites the skipped fields as explicit
# zeros first. Bumping this pin means re-running that, and it fails loudly
# rather than quietly.
#
# THE PIN IS IN versions.env, as PYPKG_GREENLET_FILE, beside its sha256 and
# beside the other seventeen. PKG_VERSION is READ OUT OF that file name rather
# than written again here, so there is one string to bump and no way for the
# two to disagree.
PKG_NAME=anvil-python-greenlet
PKG_VERSION="$(pypkg_version greenlet)"
PKG_RELEASE=1

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="greenlet -- lightweight coroutines, klippy's reactor. Its C++ sources are rewritten for gcc 7.2 before they are compiled."
