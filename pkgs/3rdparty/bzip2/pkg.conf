# anvil-bzip2-dev -- libbz2, linked into CPython's _bz2 module.
#
# The one project here with no configure at all: bzip2 ships a Makefile and
# nothing else, which is what pkg_build's PKG_CONFIGURE=none is for.
#
# Section libdevel and a -dev name, because a static archive ends up inside
# whatever links it. Nothing of this is installed on a printer.
PKG_NAME=anvil-bzip2-dev
PKG_VERSION="$BZIP2_VERSION"
PKG_RELEASE=1
PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_DESCRIPTION="libbz2 headers and static library. Linked into CPython's _bz2 module."
