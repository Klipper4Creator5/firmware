# anvil-python-dbus-fast -- for the CPython this feed builds.
#
# Moonraker's dbus_manager component, which is a CORE component and imports
# this at module scope: without it the server does not start, whatever
# [machine] provider is configured. Replaces anvil-python-dbus-next, which
# Moonraker 0.11.0 stopped using.
#
# ARCHITECTURE all. The sdist cythonises nine of its modules for speed, and
# build.sh sets SKIP_CYTHON=1 so it ships the python those were generated
# from -- the same code, running anywhere. Compiling them would make this
# package mipsel and buy speed on a path that carries a handful of polkit
# calls per boot.
#
# ARCH all EVEN THOUGH THE WHEEL IS PLATFORM-TAGGED. poetry-core marks the
# distribution impure because pyproject declares a build script at all, so
# SKIP_CYTHON=1 still produces a cp313-...-x86_64 file name. What that file
# CONTAINS is 29 .py and not one .so, and the content is what ships -- which
# is also why this recipe does not call pkg_pynative.
#
# THE PIN IS IN versions.env, as PYPKG_DBUS_FAST_FILE, beside its sha256 and
# beside the others. PKG_VERSION is READ OUT OF that file name rather than
# written again here, so there is one string to bump and no way for the two
# to disagree.
PKG_NAME=anvil-python-dbus-fast
PKG_VERSION="$(pypkg_version dbus-fast)"
PKG_RELEASE=1
PKG_SECTION=python
PKG_ARCH=all

PKG_EXCLUDE=".version"
PKG_DEPENDS="anvil-python"
PKG_BUILD_DEPENDS="python"

PKG_DESCRIPTION="dbus_fast -- a DBus library, shipped as its pure-python build. Moonraker's dbus_manager uses it."
