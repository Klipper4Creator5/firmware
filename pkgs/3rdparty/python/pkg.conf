# anvil-python -- CPython, cross-compiled for the printer.
#
# WHY THERE IS A SECOND PYTHON ON THIS MACHINE AT ALL. FlashForge built its
# 3.8.2 without _sqlite3, and that single omission is what pins
# MOONRAKER_VERSION to a 2023 commit: every Moonraker from v0.9.0 on keeps its
# database in sqlite. This interpreter has a working sqlite3, which is what
# eventually unpins it.
#
# THE PREFIX IS COMPILED IN, exactly as it is for s6. sys.prefix and the stdlib
# search that follows from it are baked in at configure time, so moving the
# directory on the printer breaks the interpreter -- it has to be rebuilt, not
# renamed. That is also the argument for putting it in $MODDIR with everything
# else rather than somewhere private: there is one prefix to keep stable, not
# two.
#
# ONLY bin/python3.13 SHIPS, and the name matters. payload/anvil-env.sh
# PREPENDS $MODDIR/bin to PATH (s6-svscan execs s6-supervise by name off PATH,
# so it has to), so a bin/python3 of ours would sit AHEAD of FlashForge's for
# every process that sources it, and anything saying `python3` rather than
# "$FF_PYTHON" would silently change interpreter. `make install` creates that
# symlink, plus idle3, pydoc3 and the *-config scripts; build.sh names the one
# binary it ships and the rest are simply never copied out of the staging tree.
PKG_NAME=anvil-python
PKG_VERSION="$PY_VERSION"
PKG_RELEASE=1
PKG_SECTION=lang

PKG_EXCLUDE=".version"

# NO Depends, AND THAT IS A MEASURED CLAIM RATHER THAN AN OVERSIGHT. Every C
# library this interpreter uses is linked in STATICALLY -- see build.sh -- so
# the only shared objects it needs are the printer's own libc, libm, libdl,
# libpthread and libatomic.so.1, all of which are on the stock rootfs. Nothing
# in this feed has to be installed first.
PKG_DEPENDS=""

# SEVEN LIBRARIES, AND EACH ONE IS EXACTLY ONE stdlib MODULE. openssl is _ssl
# and _hashlib, sqlite is _sqlite3, zlib is zlib, libffi is _ctypes, xz is
# _lzma, bzip2 is _bz2, expat is pyexpat. build.sh gates all seven by name
# after the build, because CPython's answer to a library it cannot link is to
# record the module as absent and CARRY ON -- a silent success that produces an
# interpreter missing the one module this package exists for.
PKG_BUILD_DEPENDS="openssl sqlite zlib libffi xz bzip2 expat"

# THE HEADERS ARE THE POINT OF THE DEV SPLIT HERE, more than anywhere else in
# this feed. The eighteen pkgs/3rdparty/python-* recipes cross-compile C extensions
# against them, and before this package existed they reached them by building
# inside bin/patch.sh at the one moment an untrimmed staging tree happened to
# be on disk. A -dev package is that moment made durable: the headers are in
# the feed, a wheel recipe names `python` as a build dependency and gets them,
# and a printer -- which builds no extension modules -- installs none of it.
#
# config-3.13-* comes along because sysconfig's LIBPL points into it, and a
# sysconfig answering with a directory that does not exist is the kind of thing
# a future setuptools notices. libpython3.13.a is deleted in build.sh rather
# than shipped inside it: 35MB of static archive that nothing links.
PKG_DEV_FILES="include lib/pkgconfig lib/python$PY_MM/config-$PY_MM-*"
PKG_DEV_DESCRIPTION="CPython headers and build configuration for mipsel. This is what the pkgs/3rdparty/python-* recipes compile their C extensions against; nothing installs it on a printer."

PKG_DESCRIPTION="CPython $PY_VERSION for the printer, with sqlite3, ssl, lzma, bz2, ctypes and expat linked in statically. Installs as bin/python3.13 -- never as python3, which would shadow the stock interpreter on PATH."
