# anvil-core -- this repo's own files: the init scripts, the two shell
# libraries everything sources, the helper programs and the configuration.
#
# THE ONLY RECIPE WHOSE SOURCE IS ENTIRELY THIS CHECKOUT. Everything else
# under pkg/ unpacks a pinned tarball whose sha256 is in versions.env, and the
# few that also carry files of ours carry them beside the tarball rather than
# instead of it. These files are edited here, reviewed here, and have no
# upstream -- which is why the recipe says so with pkg_intree and why the
# cache key needs the extra field below.
#
# ARCHITECTURE all. Shell, Python source, JSON and Klipper .cfg. Not one byte
# of native code, so there is no architecture to claim -- and, usefully, no
# reason for a printer to reject it.
PKG_NAME=anvil-core
PKG_ARCH=all

# THE VERSION IS THE RELEASE'S. MOD_VER is what bin/pack.sh already stamps on
# the tarball and what bin/common.sh defaults to today's date, and it is
# pinnable (MOD_VER=20260824) precisely so an old release can be rebuilt --
# the same property every other package here gets from an upstream version
# number. It is monotone, so opkg orders upgrades correctly.
PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_SECTION=base
PKG_EXCLUDE=".version"

# No Depends, deliberately, and it is the interesting empty field in this
# tree. The init scripts call s6 and start Moonraker, so naming anvil-s6 and
# anvil-moonraker here looks obviously right -- and would be wrong: each of
# those services is a separate package that a build can leave out
# (BUILD_MOONRAKER) or a printer can `opkg remove`, and the scripts that would
# have started it must still install and still say, in the boot log, that it is
# not there. This package is what makes the machine ours; the things it can
# start are separate decisions.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

# THE CACHE KEY IS THE CONTENT, because the version cannot be. MOD_VER is a
# date: with it pinned, an edit to payload/init.d/S60nginx would read as
# "already current" and the printer would get yesterday's script; without it
# pinned, the package rebuilds once a day whether or not anything changed.
# Neither is a cache. So the version says which release this is and this says
# what is actually in it -- sixteen hex digits over exactly the files the
# recipe ships.
#
# IT IS ONE find OVER ONE DIRECTORY, and that is the layout paying for itself.
# This used to be an eight-path list naming payload/ and assets/ subtrees by
# hand, which is a cache key that goes stale the first time somebody ships a
# file from a directory nobody remembered to add -- silently, because a stamp
# that misses an input reports "already current" rather than failing. build.sh
# stages $PKG_DIR/payload wholesale, so hashing $PKG_DIR/payload wholesale is
# the same set by construction and cannot drift from it.
#
# seed/ is deliberately NOT hashed: it is not in the package, so an edit to
# anvil.conf.in must not invalidate a build whose output does not contain it.
# bin/patch.sh copies it itself and has no cache to fool.
#
# prog/ USED TO BE IN THAT SENTENCE and is not any more: firmwareExe and
# start.sh moved under payload/prog/, so they are package files now and the
# hash covers them like everything else. bin/patch.sh still puts them in the
# software component -- it just takes them from the installed payload rather
# than from a directory beside this file. See payload/bin/anvil-link-prog.sh.
#
# It has to stay cheap: pkg_conf is called for every recipe by pkg_recipes,
# by pkg_order and by bin/fetch-assets.sh's pkg_needs, so this hash runs
# several times per build. Seventy small text files is a few milliseconds.
PKG_STAMP_EXTRA="$(pkg_payload_hash)"


PKG_DESCRIPTION="The mod's own scripts and configuration: init.d services, the shared environment and service libraries, the wifi and startup helpers, and the nginx and Moonraker config."
