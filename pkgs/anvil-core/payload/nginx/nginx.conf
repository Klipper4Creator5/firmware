# anvil nginx -- serves Mainsail and proxies Moonraker.
# Run with:  nginx -p /usr/data/anvil/nginx -c /usr/data/anvil/nginx/nginx.conf
#
# FlashForge's own web stack is gone: the mod replaces firmwareExe, which
# served the stock HTTP API, and their nginx was already commented out of
# klipper/start.sh. Nothing else listens on :80.
#
# We run on our OWN prefix rather than editing /usr/prog/nginx/conf/nginx.conf
# because /usr/prog is the firmware partition: every FlashForge package
# reinstalls it, so a config written there is undone by the next stock flash.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /usr/prog/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  off;
    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path  tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    # Mainsail uploads gcode through this vhost.
    client_max_body_size 1024m;
    proxy_read_timeout   600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout   600s;

    upstream moonraker {
        server 127.0.0.1:7125;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/data/anvil/www/mainsail;
        index index.html;

        # Mainsail is a SPA: unknown paths must fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the shell, or updates silently do nothing.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # The camera, so one forwarded port is enough to see the stream.
        # S65camera starts mjpg-streamer here; with no camera attached this
        # 502s, which is the honest answer for "no camera".
        location /webcam/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # MJPEG is one endless response: no buffering, no read timeout.
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        # No static /server/files/ blocks here on purpose. Moonraker serves
        # its own file trees and must keep doing so: nginx would only ever
        # answer GET, while the SAME paths carry DELETE (Mainsail's delete
        # button) and POST (move/copy), which serving from disk would 405.
        #
        # A prefix location would not have worked anyway -- the regex above
        # matches /server/ too, and nginx gives regex locations precedence.
    }
}
